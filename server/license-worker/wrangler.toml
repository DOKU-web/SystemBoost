name = "systemboost-license"
main = "src/index.js"
compatibility_date = "2026-11-01"

# KV namespace systemboost-license-LICENSES
[[kv_namespaces]]
binding = "LICENSES"
id = "55d7a49d2e7940d5a261cdf568169480"

# Usage statistics (src/stats.js): every ping writes, which KV's free plan cannot take.
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "stats-1"
new_sqlite_classes = ["Stats"]

# Hourly GitHub download counts, so the daily numbers have no holes while the dashboard is closed.
[triggers]
crons = ["7 * * * *"]

[vars]
# Lemon Squeezy auto-payments only (manual payment links do not use this):
# off  = closed: no checkout, no keys (default)
# test = only Lemon Squeezy test-mode orders get keys, valid 24 h
# live = only real orders get keys
SALES_MODE = "off"
PUBLIC_URL = "https://systemboost-license.euning97.workers.dev"
# Accounts v2 (email accounts, 2-step login, devices, linked keys, consents, the security log, recovery requests,
# POST /keys/resend) and the privacy policy for them start at this instant (licence agreement Article 8, 30 days' notice).
# Before it the Worker does for accounts what the server of 2026-11-13 did and /privacy shows the policy of then with the
# new one as a preview (src/accounts_gate.js). Missing or not a valid instant: not yet.
ACCOUNTS_V2_FROM = "2027-01-01T00:00:00+09:00"
LS_STORE_ID = "REPLACE"
LS_VARIANT_MONTHLY = "REPLACE"
LS_VARIANT_YEARLY = "REPLACE"
LS_VARIANT_LIFETIME = "REPLACE"
