<div class="grid">
  <div class="card"><h3>Frame generation</h3><p>2× to 8×, an auto mode that follows your refresh rate, or a custom output FPS. Works on NVIDIA, AMD and Intel graphics, and shows the real multiplier and added latency as numbers.</p></div><div class="card"><h3>Upscaling + sharpening</h3><p>Scales low-resolution windowed games up to your screen with adjustable sharpness.</p></div>

<section id="news" class="news">
  <div class="nh"><span class="badge">New</span><h2>SystemBoost 0.8.18</h2></div>
  <p class="nd">For Windows · the next version after 0.8.14. 0.8.15, 0.8.16 and 0.8.17 were not released separately.</p>
  <div class="ng"><div class="ni"><h3>✦ PC Recommendations (Ultra · Business)</h3><p>Press 'Start check' under '✦ Recommendations' on the left. For about a minute the app reads this PC's specs (CPU, RAM, graphics card, monitor) and runs short benchmarks, then recommends frame generation settings (multiplier, quality), boost options and things to change yourself. Run the check with your games closed.</p><ul><li>Turn on the ones you pick with 'Apply selected recommendations at once', and put them back with 'Undo applied recommendations'. Settings are backed up before they change.</li><li>Benchmark numbers are not game FPS. The effect in games differs from game to game. Results are stored only on this PC and sent nowhere.</li></ul></div>
  <div class="ni"><h3>👤 Member accounts (optional)</h3><ul><li>An account is optional. Key-only users and existing ID members carry on as now.</li><li>You can also sign up with an email address, and log in with your ID or email. New: 'Two-step verification', 'Logged-in devices' (log devices out) and 'My licenses' (keys linked to your account).</li><li>'Get my key again': enter the email you bought your key with, and the key is sent to that email. No membership needed.</li><li>The new account features appear after the seller's server is updated. Email sign-up, reset emails and 'Get my key again' work once the seller turns on email sending.</li></ul></div>
  <div class="ni"><h3>⚠️ Overclocking &amp; power limit notice and consent</h3><ul><li>The first time you turn on overclocking / power limit, the 'Overclocking &amp; Power Limit Notice' appears, and it turns on only after you agree. Even if you turned it on before, the app changes no graphics card values until you agree.</li><li>You're asked again when the graphics card or the notice's wording changes. 'Withdraw consent' turns overclocking / power limit off and returns the graphics card to factory values. Details: <a href="license.html#oc">Article 6-2 of the EULA</a>.</li></ul></div>
  <div class="ni"><h3>🖥️ AMD Radeon</h3><ul><li>The Radeon driver features are built with AMD's official SDK (ADLX). They don't put code into games or read game memory. Not yet tested on a real Radeon PC.</li><li>Information (temperature, clocks, power, usage), driver game profile (Anti-Lag on and Radeon Chill off during games), Ultra: power limit and clock tuning and AMD auto-tuning for desktop Radeon cards, all plans: restore factory defaults.</li><li>Until December 31, 2026, the Radeon features turn on only after you separately accept the AMD component terms (<a href="license.html#a12-2">Article 12-2 of the EULA</a>) the first time you use them. From January 1, 2027, this article applies to all users.</li></ul></div>

<section id="news" class="news">
  <div class="nh"><span class="badge">새 버전</span><h2>SystemBoost 0.8.18</h2></div>
  <p class="nd">Windows용 · 0.8.14 다음 판이에요. 0.8.15, 0.8.16, 0.8.17은 따로 출시하지 않았어요.</p>
  <div class="ng"><div class="ni"><h3>✦ PC 맞춤 추천 (울트라 · 산업)</h3><p>왼쪽 '✦ 맞춤 추천'에서 '검사 시작'을 누르면 1분쯤 이 PC의 사양(CPU, RAM, 그래픽카드, 모니터)을 읽고 짧은 벤치마크를 돌린 뒤, 프레임 생성 설정(배수, 품질), 부스트 항목, 직접 바꿔야 하는 참고 사항을 추천해요. 게임을 끈 뒤에 검사해요.</p><ul><li>고른 추천은 '선택한 추천 한 번에 적용'으로 켜고, '추천 적용 되돌리기'로 원래대로 돌려요. 바꾸는 설정은 적용 전에 백업돼요.</li><li>벤치마크 값은 게임 FPS가 아니에요. 게임에서의 효과는 게임마다 달라요. 검사 결과는 이 PC에만 저장되고 어디로도 보내지 않아요.</li></ul></div>
  <div class="ni"><h3>👤 회원 계정 (선택)</h3><ul><li>계정은 선택이에요. 키만 쓰는 사용자와 지금의 아이디 회원은 지금처럼 써요.</li><li>이메일로도 가입하고, 아이디나 이메일로 로그인해요. '2단계 인증', '로그인된 기기'(기기 로그아웃), '내 라이선스'(계정에 연결한 키)가 생겼어요.</li><li>'키 다시 받기': 키를 살 때 쓴 이메일을 넣으면 그 이메일로 키를 보내요. 회원이 아니어도 돼요.</li><li>새 계정 기능은 판매자 서버가 업데이트된 뒤에 나타나요. 이메일 가입, 재설정 메일, 키 다시 받기는 판매자가 메일 보내기를 켠 뒤에 쓸 수 있어요.</li></ul></div>
  <div class="ni"><h3>⚠️ 오버클럭 · 전력 제한 안내와 동의</h3><ul><li>오버클럭 / 전력 제한을 처음 켤 때 '오버클럭 · 전력 제한 안내'가 나오고, 동의해야 켜져요. 예전에 켜 두었더라도 동의하기 전에는 그래픽카드 값을 바꾸지 않아요.</li><li>그래픽카드가 바뀌었거나 안내 문구가 바뀌면 다시 물어봐요. '동의 철회'를 누르면 오버클럭 / 전력 제한을 끄고 그래픽카드를 공장 초기값으로 돌려요. 자세한 내용은 <a href="license.html#oc">사용권 계약 제6조의2</a>에 있어요.</li></ul></div>
  <div class="ni"><h3>🖥️ AMD 라데온</h3><ul><li>라데온 드라이버 기능을 AMD 공식 SDK(ADLX)로 넣었어요. 게임에 코드를 넣거나 게임 메모리를 읽지 않아요. 아직 실제 라데온 PC에서 시험하지 않았어요.</li><li>정보 보기(온도, 클럭, 전력, 사용률), 드라이버 게임 프로필(게임 중 Anti-Lag 켜기, Radeon Chill 끄기), 울트라: 데스크톱 라데온의 전력 제한·클럭 조정과 AMD 자동 튜닝, 모든 플랜: 공장 초기값으로 복구.</li><li>2026년 12월 31일까지는 라데온 기능을 처음 쓸 때 AMD 구성 요소 조건(<a href="license.html#a12-2">사용권 계약 제12조의2</a>)에 따로 동의해야 켜져요. 2027년 1월 1일부터는 이 조항이 모든 사용자에게 적용돼요.</li></ul></div>
  <div class="ni"><h3>🆓 3일 체험은 없어요</h3><p>0.8.14의 안내와 사용권 계약(2027년 1월 1일 시행 예정이던 조항)에 3일 체험이 적혀 있었지만, 체험은 제공하지 않아요. 구매 전에는 무료 플랜으로 써 보세요(프레임 생성 2배, 벤치마크).</p></div></div>
  <p class="nf">앱이 새 버전을 자동으로 받아 두고, 끌 때 적용해요. 전체 변경 내용은 <a href="https://github.com/DOKU-web/SystemBoost/releases/latest">릴리스 노트</a>와 <a href="https://discord.gg/zUyeV2SJwm">공식 디스코드</a> #changelog에 있어요.</p>

<h3 class="bt">5대 · 10대 묶음 키 (2026년 12월 9일부터)</h3>
<div class="card tbl"><table class="bund"><tr><th></th><th>5대</th><th>10대</th></tr><tr><td class="p">프로</td><td>₩84,500 <span class="w">대당 ₩16,900</span></td><td>₩149,000 <span class="w">대당 ₩14,900</span></td></tr><tr><td class="u">울트라</td><td>₩254,500 <span class="w">대당 ₩50,900</span></td><td>₩449,000 <span class="w">대당 ₩44,900</span></td></tr><tr><td class="b">산업</td><td>₩382,000 <span class="w">대당 ₩76,400</span></td><td>₩674,000 <span class="w">대당 ₩67,400</span></td></tr></table></div>
<p class="pl">같은 플랜의 연간 키 5개나 10개를 한 번에 사요. 키 하나에 PC 한 대이고, 회사 업무용 PC나 가족 PC처럼 구매자가 관리하는 PC에 써요. 계좌이체 · 직접 결제로만 팔고, 자동 결제와 할인 티켓은 없어요.</p>
<ul class="fine"><li>가격은 원화(KRW) 기준이에요.</li><li>결제는 앱의 <b>플랜</b> 화면에서 해요. 결제가 확인되면 라이선스 키가 앱에 바로 등록돼요. 결제가 열리기 전에는 버튼이 '결제 준비 중'으로 보여요.</li><li><b>계좌이체 · 직접 결제</b>는 자동으로 결제되지 않아요. 기간이 끝나면 무료 플랜으로 돌아가고, 계속 쓰려면 다시 결제하면 돼요.</li><li>계좌이체는 이렇게 해요: 앱에서 주문 코드(SB-XXXX-XXXX)를 받고 → 판매자 계좌로 입금하고 → 앱에서 '고객센터에 입금 알리기'를 누르면 → 판매자가 확인한 뒤 24시간 안에 키를 보내요. 24시간은 입금을 알린 때부터예요.</li><li><b>카드 구독</b>은 2026년 12월 8일부터 열려요. 해지할 때까지 기간마다 자동으로 결제되고 키도 자동으로 연장돼요. 해지는 결제 메일의 구독 관리 링크에서 언제든 할 수 있고, 이미 결제한 기간까지는 써요.</li><li>유료 플랜에만 있는 기능은 구매 전에 써 볼 수 없어요. 무료 플랜에도 2배 프레임 생성과 벤치마크가 있으니, 먼저 내 PC에서 확인해 보세요.</li><li>추천 코드나 초대 코드가 있으면 플랜 화면과 계정 메뉴에서 입력할 수 있어요. 초대 보상인 할인 티켓은 직접 결제에만 쓸 수 있어요.</li><li>키는 받은 날부터 7일 안에 청약을 철회할 수 있어요. 키를 등록해 유료 기능을 쓰기 시작하면 철회가 제한될 수 있어요. 자세한 조건은 <a href="license.html#a9">사용권 계약 제9조</a>에 있어요.</li><li><b>산업</b> 키는 0.8.10 이상에서 써요.</li><li>이미 받은 프리미엄 키는 그대로 프로로 쓸 수 있어요.</li></ul>
<h2>설치</h2>
<div class="note"><b>Windows</b><ol><li>설치판을 받아 실행하면 바로 설치되고 켜져요. 관리자 권한은 필요 없어요.</li><li>"Windows의 PC 보호" 창이 뜨면 <b>추가 정보 → 실행</b>을 누르세요. 아직 코드 서명 전이라 처음 한 번 떠요.</li><li>포터블은 압축을 풀고 SystemBoost.exe를 실행하면 돼요.</li></ol></div>

  <div class="ng"><div class="ni"><h3>✦ Recomendaciones para tu PC (Ultra · Business)</h3><p>Pulsa «Start check» en «✦ Recommendations», a la izquierda. Durante un minuto aproximadamente, la app lee las especificaciones de este PC (CPU, RAM, tarjeta gráfica, monitor) y ejecuta benchmarks cortos; después recomienda ajustes de generación de fotogramas (multiplicador, calidad), opciones de boost y cosas que debes cambiar tú. Haz la comprobación con los juegos cerrados.</p><ul><li>Activa las que elijas con «Apply selected recommendations at once» y deshazlas con «Undo applied recommendations». Los ajustes se guardan en una copia de seguridad antes de cambiar.</li><li>Los valores del benchmark no son FPS de juego. El efecto en los juegos varía según el juego. Los resultados solo se guardan en este PC y no se envían a ninguna parte.</li></ul></div>
  <div class="ni"><h3>👤 Cuentas de miembro (opcional)</h3><ul><li>La cuenta es opcional. Quienes solo usan una clave y los miembros actuales con ID siguen como hasta ahora.</li><li>Ahora también puedes registrarte con un correo e iniciar sesión con tu ID o tu correo. Novedades: «Two-step verification» (verificación en dos pasos), «Logged-in devices» (cerrar sesión en dispositivos) y «My licenses» (claves vinculadas a tu cuenta).</li><li>«Get my key again»: escribe el correo con el que compraste la clave y la clave se envía a ese correo. No hace falta ser miembro.</li><li>Las nuevas funciones de cuenta aparecen cuando se actualiza el servidor del vendedor. El registro por correo, los correos de restablecimiento y «Get my key again» funcionan cuando el vendedor activa el envío de correos.</li></ul></div>
  <div class="ni"><h3>⚠️ Aviso y consentimiento de overclock · límite de potencia</h3><ul><li>La primera vez que activas el overclock / límite de potencia aparece el «Overclocking &amp; Power Limit Notice», y solo se activa cuando aceptas. Aunque lo hubieras activado antes, la app no cambia ningún valor de la tarjeta gráfica hasta que aceptes.</li><li>Se te vuelve a preguntar si cambia la tarjeta gráfica o el texto del aviso. «Withdraw consent» desactiva el overclock / límite de potencia y devuelve la tarjeta gráfica a los valores de fábrica. Detalles en el <a href="license.html#oc">artículo 6-2 del contrato</a>.</li></ul></div>
  <div class="ni"><h3>🖥️ AMD Radeon</h3><ul><li>Las funciones del controlador Radeon se han hecho con el SDK oficial de AMD (ADLX). No introducen código en los juegos ni leen su memoria. Aún no se han probado en un PC con Radeon real.</li><li>Información (temperatura, frecuencias, potencia, uso), perfil de juego del controlador (Anti-Lag activado y Radeon Chill desactivado durante el juego), Ultra: límite de potencia y ajuste de frecuencias y ajuste automático de AMD en Radeon de escritorio, todos los planes: restaurar los valores de fábrica.</li><li>Hasta el 31 de diciembre de 2026, las funciones Radeon solo se activan si, la primera vez que las usas, aceptas por separado las condiciones de los componentes de AMD (<a href="license.html#a12-2">artículo 12-2 del contrato</a>). Desde el 1 de enero de 2027, este artículo se aplica a todos los usuarios.</li></ul></div>
  <div class="ni"><h3>🆓 No hay prueba de 3 días</h3><p>Los avisos y el contrato de licencia de la 0.8.14 (en una cláusula que iba a entrar en vigor el 1 de enero de 2027) mencionaban una prueba de 3 días, pero no se ofrece ninguna prueba. Antes de comprar, usa el plan gratuito (generación de fotogramas 2×, benchmark).</p></div></div>

  <div class="ng"><div class="ni"><h3>✦ Рекомендации для вашего ПК (Ultra · Business)</h3><p>Нажмите «Start check» в разделе «✦ Recommendations» слева. Примерно за минуту приложение считывает характеристики этого ПК (процессор, ОЗУ, видеокарта, монитор) и запускает короткие бенчмарки, а затем рекомендует настройки генерации кадров (множитель, качество), пункты ускорения и то, что нужно изменить самому. Запускайте проверку с закрытыми играми.</p><ul><li>Выбранные рекомендации включаются кнопкой «Apply selected recommendations at once», а «Undo applied recommendations» возвращает всё как было. Изменяемые настройки сохраняются в резервную копию перед применением.</li><li>Значения бенчмарка — это не FPS в играх. Эффект в играх зависит от игры. Результаты проверки хранятся только на этом ПК и никуда не отправляются.</li></ul></div>
  <div class="ni"><h3>👤 Учётная запись (по желанию)</h3><ul><li>Учётная запись не обязательна. Те, кто пользуется только ключом, и нынешние участники с ID продолжают как сейчас.</li><li>Теперь можно зарегистрироваться по эл. почте и входить по ID или почте. Новое: «Two-step verification» (двухэтапная проверка), «Logged-in devices» (выход на устройствах) и «My licenses» (ключи, привязанные к учётной записи).</li><li>«Get my key again»: укажите почту, с которой покупали ключ, и ключ придёт на эту почту. Быть участником не нужно.</li><li>Новые функции учётной записи появятся после обновления сервера продавца. Регистрация по почте, письма для сброса и «Get my key again» заработают, когда продавец включит отправку писем.</li></ul></div>
  <div class="ni"><h3>⚠️ Предупреждение о разгоне и лимите мощности и согласие</h3><ul><li>При первом включении разгона / лимита мощности появляется «Overclocking &amp; Power Limit Notice», и функция включается только после вашего согласия. Даже если вы включали её раньше, до согласия приложение не меняет значения видеокарты.</li><li>Если меняется видеокарта или текст предупреждения, согласие запрашивается снова. «Withdraw consent» выключает разгон / лимит мощности и возвращает видеокарте заводские значения. Подробнее — <a href="license.html#oc">статья 6-2 соглашения</a>.</li></ul></div>
  <div class="ni"><h3>🖥️ AMD Radeon</h3><ul><li>Функции драйвера Radeon сделаны на официальном SDK от AMD (ADLX). Они не внедряют код в игры и не читают память игр. На реальном ПК с Radeon они ещё не проверялись.</li><li>Сведения (температура, частоты, мощность, загрузка), игровой профиль драйвера (во время игры Anti-Lag включён, Radeon Chill выключен), Ultra: лимит мощности и настройка частот и автонастройка AMD для настольных Radeon, все тарифы: возврат к заводским значениям.</li><li>До 31 декабря 2026 года функции Radeon включаются только после того, как при первом использовании вы отдельно примете условия для компонентов AMD (<a href="license.html#a12-2">статья 12-2 соглашения</a>). С 1 января 2027 года эта статья действует для всех пользователей.</li></ul></div>
  <div class="ni"><h3>🆓 Пробного периода на 3 дня нет</h3><p>В уведомлениях и лицензионном соглашении версии 0.8.14 (в пункте, который должен был вступить в силу 1 января 2027 года) упоминался пробный период на 3 дня, но он не предоставляется. Перед покупкой попробуйте бесплатный тариф (генерация кадров 2×, бенчмарк).</p></div></div>

  <div class="ng"><div class="ni"><h3>✦ Empfehlungen für deinen PC (Ultra · Business)</h3><p>Klicke links unter „✦ Recommendations“ auf „Start check“. Etwa eine Minute lang liest die App die Daten dieses PCs aus (CPU, RAM, Grafikkarte, Monitor) und führt kurze Benchmarks aus; danach empfiehlt sie Einstellungen für die Bildgenerierung (Faktor, Qualität), Boost-Optionen und Dinge, die du selbst ändern musst. Schließe vor dem Check deine Spiele.</p><ul><li>Ausgewählte Empfehlungen schaltest du mit „Apply selected recommendations at once“ ein, mit „Undo applied recommendations“ machst du sie rückgängig. Geänderte Einstellungen werden vorher gesichert.</li><li>Benchmark-Werte sind keine Spiel-FPS. Die Wirkung in Spielen ist von Spiel zu Spiel verschieden. Die Ergebnisse bleiben nur auf diesem PC und werden nirgendwohin gesendet.</li></ul></div>
  <div class="ni"><h3>👤 Mitgliedskonto (freiwillig)</h3><ul><li>Ein Konto ist freiwillig. Wer nur einen Schlüssel nutzt und bisherige ID-Mitglieder machen weiter wie jetzt.</li><li>Du kannst dich jetzt auch per E-Mail registrieren und mit ID oder E-Mail anmelden. Neu: „Two-step verification“ (Zwei-Schritt-Bestätigung), „Logged-in devices“ (Geräte abmelden) und „My licenses“ (mit dem Konto verknüpfte Schlüssel).</li><li>„Get my key again“: Gib die E-Mail-Adresse ein, mit der du den Schlüssel gekauft hast, und der Schlüssel wird an diese Adresse geschickt. Eine Mitgliedschaft ist nicht nötig.</li><li>Die neuen Kontofunktionen erscheinen, nachdem der Server des Verkäufers aktualisiert wurde. Registrierung per E-Mail, Mails zum Zurücksetzen und „Get my key again“ funktionieren, sobald der Verkäufer den Mailversand einschaltet.</li></ul></div>

<section id="news" class="news">
  <div class="nh"><span class="badge">Nouveau</span><h2>SystemBoost 0.8.18</h2></div>
  <p class="nd">Pour Windows · la version qui suit la 0.8.14. Les versions 0.8.15, 0.8.16 et 0.8.17 n’ont pas été publiées séparément.</p>
  <div class="ng"><div class="ni"><h3>✦ Recommandations pour votre PC (Ultra · Business)</h3><p>Cliquez sur « Start check » dans « ✦ Recommendations », à gauche. Pendant environ une minute, l’app lit la configuration de ce PC (processeur, RAM, carte graphique, écran) et lance de courts benchmarks, puis recommande des réglages de génération d’images (multiplicateur, qualité), des options de boost et des points à changer vous-même. Lancez la vérification jeux fermés.</p><ul><li>Activez celles que vous choisissez avec « Apply selected recommendations at once » et annulez-les avec « Undo applied recommendations ». Les réglages modifiés sont sauvegardés avant le changement.</li><li>Les valeurs du benchmark ne sont pas des FPS en jeu. L’effet dans les jeux varie d’un jeu à l’autre. Les résultats restent uniquement sur ce PC et ne sont envoyés nulle part.</li></ul></div>
  <div class="ni"><h3>👤 Compte membre (facultatif)</h3><ul><li>Le compte est facultatif. Les utilisateurs qui n’ont qu’une clé et les membres actuels avec identifiant continuent comme maintenant.</li><li>Vous pouvez aussi vous inscrire avec une adresse e-mail et vous connecter avec votre identifiant ou votre e-mail. Nouveau : « Two-step verification » (validation en deux étapes), « Logged-in devices » (déconnecter des appareils) et « My licenses » (clés liées au compte).</li><li>« Get my key again » : saisissez l’e-mail utilisé pour acheter la clé, et la clé est envoyée à cette adresse. Pas besoin d’être membre.</li><li>Les nouvelles fonctions de compte apparaissent après la mise à jour du serveur du vendeur. L’inscription par e-mail, les e-mails de réinitialisation et « Get my key again » fonctionnent une fois que le vendeur a activé l’envoi d’e-mails.</li></ul></div>
  <div class="ni"><h3>⚠️ Avis et consentement pour l’overclocking · la limite de puissance</h3><ul><li>La première fois que vous activez l’overclocking / la limite de puissance, l’« Overclocking &amp; Power Limit Notice » s’affiche, et la fonction ne s’active qu’après votre accord. Même si vous l’aviez activée avant, l’app ne modifie aucune valeur de la carte graphique tant que vous n’avez pas donné votre accord.</li><li>Votre accord est redemandé si la carte graphique ou le texte de l’avis change. « Withdraw consent » désactive l’overclocking / la limite de puissance et remet la carte graphique aux valeurs d’usine. Détails à l’<a href="license.html#oc">article 6-2 du contrat</a>.</li></ul></div>
  <div class="ni"><h3>🖥️ AMD Radeon</h3><ul><li>Les fonctions du pilote Radeon sont faites avec le SDK officiel d’AMD (ADLX). Elles n’injectent pas de code dans les jeux et ne lisent pas leur mémoire. Elles n’ont pas encore été testées sur un vrai PC Radeon.</li><li>Informations (température, fréquences, puissance, utilisation), profil de jeu du pilote (Anti-Lag activé et Radeon Chill désactivé pendant le jeu), Ultra : limite de puissance et réglage des fréquences et réglage automatique AMD pour les Radeon de bureau, toutes les offres : retour aux valeurs d’usine.</li><li>Jusqu’au 31 décembre 2026, les fonctions Radeon ne s’activent que si vous acceptez séparément, à la première utilisation, les conditions des composants AMD (<a href="license.html#a12-2">article 12-2 du contrat</a>). À partir du 1er janvier 2027, cet article s’applique à tous les utilisateurs.</li></ul></div>
  <div class="ni"><h3>🆓 Pas d’essai de 3 jours</h3><p>Les avis et le contrat de licence de la 0.8.14 (dans une clause qui devait entrer en vigueur le 1er janvier 2027) mentionnaient un essai de 3 jours, mais aucun essai n’est proposé. Avant d’acheter, essayez l’offre gratuite (génération d’images 2×, benchmark).</p></div></div>
  <p class="nf">L’app télécharge seule les nouvelles versions et les installe à la fermeture. Toutes les modifications : <a href="https://github.com/DOKU-web/SystemBoost/releases/latest">notes de version</a> et #changelog sur le <a href="https://discord.gg/zUyeV2SJwm">Discord officiel</a>.</p>
