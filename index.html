  <div class="ng"><div class="ni"><h3>🏢 새 플랜 산업 · 플랜 이름 변경</h3><p>유료 플랜이 <b>프로 · 울트라 · 산업</b> 세 가지가 됐어요. 프리미엄은 이름만 프로로 바뀌었고 기능과 가격은 그대로예요.</p><ul><li><b>산업 (Windows)</b>: 울트라의 모든 기능 + 방송 모드 · 업무 모드 · 시작 프로그램 정리. 월 ₩12,900 · 연 ₩89,900.</li><li><b>방송 모드</b>: OBS · Streamlabs · PRISM · XSplit이 켜져 있는 동안 방송 프로그램을 '보통 이상' 우선순위로 올리고 Windows 알림을 꺼요. 방송 프로그램이 꺼지면 원래대로 돌아가요.</li><li><b>업무 모드</b>: Zoom · Teams · Webex · Skype와 직접 고른 업무 프로그램의 우선순위를 올려요. 게임과 시스템 프로그램은 바꾸지 않아요.</li><li><b>시작 프로그램 정리</b>: 작업 관리자의 '시작 앱'과 같은 방식으로 켜고 꺼요. 게임 보안 프로그램의 자동 시작은 끌 수 없어요.</li><li>실제 OBS 방송과 화상 회의에서는 아직 시험하지 못했어요.</li></ul></div>
  <div class="ni"><h3>📅 일정과 그 밖의 변경</h3><ul><li><b>12월 8일</b>: 카드 구독 시작 (프로 · 울트라 · 산업 월간 · 연간)</li><li><b>12월 9일</b>: 5대 · 10대 묶음 키 판매 시작, <a href="license.html">사용권 계약</a> 개정 시행. 업데이트 후 한 번 다시 동의해요.</li><li>게임과 게임 보안 프로그램(안티치트)은 앱이 열거나 바꾸지 않아요 (0.8.9).</li><li>프레임 생성 창은 이제 캡처에서 숨기지 않아요. 화면 전체를 녹화 · 송출하면 생성된 화면이 나가고, 게임 창만 캡처하면 원본 게임 화면이 나가요.</li><li>왼쪽 메뉴의 '★ 프리미엄'은 '★ 플랜'으로 바뀌었어요.</li></ul></div></div>
  <p class="nf">앱이 새 버전을 자동으로 받아 두고, 끌 때 적용해요. 전체 변경 내용은 <a href="https://github.com/DOKU-web/SystemBoost/releases/latest">릴리스 노트</a>와 <a href="https://discord.gg/zUyeV2SJwm">공식 디스코드</a> #changelog에 있어요.</p>

<h3 class="bt">5대 · 10대 묶음 키 (2026년 12월 9일부터)</h3>
<div class="card tbl"><table class="bund"><tr><th></th><th>5대</th><th>10대</th></tr><tr><td class="p">프로</td><td>₩84,500 <span class="w">대당 ₩16,900</span></td><td>₩149,000 <span class="w">대당 ₩14,900</span></td></tr><tr><td class="u">울트라</td><td>₩254,500 <span class="w">대당 ₩50,900</span></td><td>₩449,000 <span class="w">대당 ₩44,900</span></td></tr><tr><td class="b">산업</td><td>₩382,000 <span class="w">대당 ₩76,400</span></td><td>₩674,000 <span class="w">대당 ₩67,400</span></td></tr></table></div>
<p class="pl">같은 플랜의 연간 키 5개나 10개를 한 번에 사요. 키 하나에 PC 한 대이고, 회사 업무용 PC나 가족 PC처럼 구매자가 관리하는 PC에 써요. 계좌이체 · 직접 결제로만 팔고, 자동 결제와 할인 티켓은 없어요. 산업 묶음은 Windows용이에요.</p>
<ul class="fine"><li>가격은 원화(KRW) 기준이에요.</li><li>결제는 앱의 <b>플랜</b> 화면에서 해요. 결제가 확인되면 라이선스 키가 앱에 바로 등록돼요. 결제가 열리기 전에는 버튼이 '결제 준비 중'으로 보여요.</li><li><b>계좌이체 · 직접 결제</b>는 자동으로 결제되지 않아요. 기간이 끝나면 무료 플랜으로 돌아가고, 계속 쓰려면 다시 결제하면 돼요.</li><li><b>카드 구독</b>은 2026년 12월 8일부터 열려요. 해지할 때까지 기간마다 자동으로 결제되고 키도 자동으로 연장돼요. 해지는 결제 메일의 구독 관리 링크에서 언제든 할 수 있고, 이미 결제한 기간까지는 써요.</li><li>구매 전에 3일 동안 써 볼 수 있는 시험 키를 드려요. <a href="https://discord.gg/zUyeV2SJwm">공식 디스코드</a> #help에 요청해 주세요.</li><li>추천 코드나 초대 코드가 있으면 플랜 화면과 계정 메뉴에서 입력할 수 있어요. 초대 보상인 할인 티켓은 직접 결제에만 쓸 수 있어요.</li><li>키는 받은 날부터 7일 안에 청약을 철회할 수 있어요. 키를 등록해 유료 기능을 쓰기 시작하면 철회가 제한될 수 있어요. 자세한 조건은 <a href="license.html#a9">사용권 계약 제9조</a>에 있어요.</li><li><b>산업</b>은 Windows에서만 팔아요. 산업 키는 0.8.10 이상에서 쓰고, Mac에서 넣으면 울트라 기능이 열려요.</li><li>이미 받은 프리미엄 키는 그대로 프로로 쓸 수 있어요.</li></ul>
<h2>설치</h2>
<div class="note"><b>Windows</b><ol><li>설치판을 받아 실행하면 바로 설치되고 켜져요. 관리자 권한은 필요 없어요.</li><li>"Windows의 PC 보호" 창이 뜨면 <b>추가 정보 → 실행</b>을 누르세요. 아직 코드 서명 전이라 처음 한 번 떠요.</li><li>포터블은 압축을 풀고 SystemBoost.exe를 실행하면 돼요.</li></ol></div>
<div class="note"><b>macOS</b><ol><li>칩에 맞는 .pkg를 받아 설치하세요. Apple 메뉴 → 이 Mac에 관하여에서 칩을 확인할 수 있어요.</li><li>처음 켤 때 '화면 기록' 권한을 허용해 주세요. 게임 화면을 캡처하는 데 필요해요.</li></ol></div>
<div class="note"><b>알아 두세요</b><p>프레임 생성은 다음 프레임을 기다려야 해서 입력 지연이 조금 늘어요(늘어난 값은 프로그램에 표시돼요). 빠른 반응이 중요한 경쟁 게임에는 권장하지 않아요.</p><p>게임은 테두리 없는 창 또는 창 모드로 실행해 주세요.</p></div>

const LANGS = ["en", "ko", "ja", "zh", "es", "pt", "ru", "de", "fr"], META = {"en": {"title": "SystemBoost — Smoother game motion", "desc": "Captures your screen to generate in-between frames and scales small windowed games up to full screen. Nothing is injected into games."}, "ko": {"title": "SystemBoost — 게임 화면을 더 부드럽게", "desc": "화면을 캡처해서 중간 프레임을 만들고, 작은 창 게임을 화면 크기로 키우는 프로그램. 게임에 주입하지 않습니다."}, "ja": {"title": "SystemBoost — ゲーム画面をもっと滑らかに", "desc": "画面をキャプチャして中間フレームを生成し、小さなウィンドウのゲームを画面サイズに拡大します。ゲームには注入しません。"}, "zh": {"title": "SystemBoost — 让游戏画面更流畅", "desc": "捕获屏幕生成中间帧，并把小窗口游戏放大到全屏。不注入任何游戏。"}, "es": {"title": "SystemBoost — Movimiento más fluido en tus juegos", "desc": "Captura la pantalla para generar fotogramas intermedios y amplía los juegos en ventana pequeña a pantalla completa. No inyecta nada en los juegos."}, "pt": {"title": "SystemBoost — Movimento mais suave nos seus jogos", "desc": "Captura a tela para gerar quadros intermediários e amplia jogos em janela pequena para tela cheia. Nada é injetado nos jogos."}, "ru": {"title": "SystemBoost — более плавная картинка в играх", "desc": "Захватывает экран, создаёт промежуточные кадры и увеличивает игры в маленьком окне до полного экрана. Ничего не внедряет в игры."}, "de": {"title": "SystemBoost — flüssigere Bewegung in deinen Spielen", "desc": "Erfasst den Bildschirm, erzeugt Zwischenbilder und skaliert kleine Fensterspiele auf Vollbild. Nichts wird in Spiele injiziert."}, "fr": {"title": "SystemBoost — des jeux plus fluides", "desc": "Capture l’écran pour générer des images intermédiaires et agrandit les jeux en petite fenêtre en plein écran. Rien n’est injecté dans les jeux."}};
function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && LANGS.includes(q)) return q;
  try { const s = localStorage.getItem("sbLang"); if (s && LANGS.includes(s)) return s; } catch (e) {}
  for (const l of (navigator.languages || [navigator.language || "en"])) {
    const p = String(l).toLowerCase().slice(0, 2); if (LANGS.includes(p)) return p;
  }
  return "en";
}
function show(lang, keepScroll) {

  const root = document.getElementById("root");

  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = META[lang].title;

  sel.onchange = () => { try { localStorage.setItem("sbLang", sel.value); } catch (e) {}
    const u = new URL(location.href); u.searchParams.set("lang", sel.value); history.replaceState(null, "", u); show(sel.value, true); };
  if (typeof afterShow === "function") afterShow(lang);
  if (!keepScroll && location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
}
show(pick());
</script>
