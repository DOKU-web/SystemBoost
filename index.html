  <h1>Make your games look <em>smoother</em></h1>
  <p class="lead">SystemBoost captures the screen, generates in-between frames, and sharply scales small windowed games up to full screen. It never touches game files or memory.</p>
  <a class="btn main" href="#">Download for Windows</a>
  <div class="ver">Free · Updates automatically</div>
  <div class="others"><a data-k="win-setup" href="#">Windows installer</a><a data-k="win-portable" href="#">Windows portable (zip)</a></div>
</section>
<div class="grid">
  <div class="card"><h3>Frame generation</h3><p>2× to 8×, an auto mode that follows your refresh rate, or a custom output FPS. Works on NVIDIA, AMD and Intel graphics, and shows the real multiplier and added latency as numbers.</p></div><div class="card"><h3>Upscaling + sharpening</h3><p>Scales low-resolution windowed games up to your screen with adjustable sharpness.</p></div>
  <div class="card"><h3>Resource sharing</h3><p>Lowers the CPU priority of other programs while you play. Everything goes back when you turn it off.</p></div><div class="card"><h3>Automatic updates</h3><p>New versions download in the background and install when you close the app. Your settings and history stay.</p></div>
</div>
<section id="news" class="news">
  <div class="nh"><span class="badge">New</span><h2>SystemBoost 0.8.18</h2></div>
  <p class="nd">For Windows · the next version after 0.8.14. 0.8.15, 0.8.16 and 0.8.17 were not released separately.</p>
  <div class="ng"><div class="ni"><h3>✦ PC Recommendations (Ultra · Business)</h3><p>Press 'Start check' under '✦ Recommendations' on the left. For about a minute the app reads this PC's specs (CPU, RAM, graphics card, monitor) and runs short benchmarks, then recommends frame generation settings (multiplier, quality), boost options and things to change yourself. Run the check with your games closed.</p><ul><li>Turn on the ones you pick with 'Apply selected recommendations at once', and put them back with 'Undo applied recommendations'. Settings are backed up before they change.</li><li>Benchmark numbers are not game FPS. The effect in games differs from game to game. Results are stored only on this PC and sent nowhere.</li></ul></div>
  <div class="ni"><h3>👤 Member accounts (optional)</h3><ul><li>An account is optional. Key-only users and existing ID members carry on as now.</li><li>You can also sign up with an email address, and log in with your ID or email. New: 'Two-step verification', 'Logged-in devices' (log devices out) and 'My licenses' (keys linked to your account).</li><li>'Get my key again': enter the email you bought your key with, and the key is sent to that email. No membership needed.</li><li>The new account features appear after the seller's server is updated. Email sign-up, reset emails and 'Get my key again' work once the seller turns on email sending.</li></ul></div>
  <div class="ni"><h3>⚠️ Overclocking &amp; power limit notice and consent</h3><ul><li>The first time you turn on overclocking / power limit, the 'Overclocking &amp; Power Limit Notice' appears, and it turns on only after you agree. Even if you turned it on before, the app changes no graphics card values until you agree.</li><li>You're asked again when the graphics card or the notice's wording changes. 'Withdraw consent' turns overclocking / power limit off and returns the graphics card to factory values. Details: <a href="license.html#oc">Article 6-2 of the EULA</a>.</li></ul></div>
  <div class="ni"><h3>🖥️ AMD Radeon</h3><ul><li>The Radeon driver features are built with AMD's official SDK (ADLX). They don't put code into games or read game memory. Not yet tested on a real Radeon PC.</li><li>Information (temperature, clocks, power, usage), driver game profile (Anti-Lag on and Radeon Chill off during games), Ultra: power limit and clock tuning and AMD auto-tuning for desktop Radeon cards, all plans: restore factory defaults.</li><li>Until December 31, 2026, the Radeon features turn on only after you separately accept the AMD component terms (<a href="license.html#a12-2">Article 12-2 of the EULA</a>) the first time you use them. From January 1, 2027, this article applies to all users.</li></ul></div>
  <div class="ni"><h3>🆓 No 3-day trial</h3><p>The 0.8.14 notices and license agreement (in a clause that was to take effect on January 1, 2027) mentioned a 3-day trial, but no trial is offered. Before you buy, try the free plan (2× frame generation, benchmark).</p></div></div>
  <p class="nf">The app downloads new versions by itself and installs them when you close it. Full changes: <a href="https://github.com/DOKU-web/SystemBoost/releases/latest">release notes</a> and #changelog on the <a href="https://discord.gg/zUyeV2SJwm">official Discord</a>.</p>
</section>

  <p>These parts of the license agreement change on <b>January 1, 2027</b>. The new wording takes effect that day; until then, the previous wording applies. What changes:</p>
  <ul><li><a href="license.html#a1">Article 1</a>: SystemBoost is a program for Windows. The “sales page” means the app's ★ Plans screen, the app's Support and the help page (/help) of the seller's server.</li><li><a href="license.html#a3">Article 3(2)</a>: each plan's features, and what each feature needs to work, are as shown on the app's ★ Plans screen at the time of purchase.</li><li><a href="license.html#a3">Article 3(3)</a> (cancellation and refunds): cancelling a card subscription stops the next automatic payment; you use the period already paid until it ends, then return to the free plan (the same for yearly subscriptions). Money for a period already paid is refunded on withdrawal under Article 9, in the case of Article 3(10), and wherever else the law provides for a refund.</li><li><a href="license.html#a3">Article 3(10)</a>: if the seller rejects a direct-payment order, such as a bank transfer, no key is issued, and money already received is returned without delay, at the latest within 3 business days of receiving it, or the seller takes the steps needed to return it.</li><li><a href="license.html#a3">Article 3(11)</a>: if a minor buys a paid plan without a legal representative's consent, the minor or the legal representative may cancel the purchase, except where the Civil Act does not allow cancellation.</li><li><a href="license.html#oc">Article 6-2</a> (new, overclocking and hardware tuning): overclocking and changing the power limit may cause system instability, game crashes, higher temperatures, shorter component lifespan or hardware damage, and may void the manufacturer's warranty. You are solely responsible for choosing to enable these features and for the results (except damage caused by SystemBoost's intentional misconduct or gross negligence). They turn on only after you accept the notice; you can withdraw consent at any time, and records of consent and withdrawal stay on your PC (and with your member account if you are signed in).</li><li><a href="license.html#a8">Article 8</a> (personal information): usage statistics start off. It describes key records and orders, member accounts (email sign-up, two-step verification, logged-in devices), the security log (including IP addresses, 30 days), account recovery requests (90 days), key resend emails, answers to card subscription price changes (3 years), the seller's Discord alerts, support requests, backups, and transfers abroad through Cloudflare and Resend (US companies).</li><li><a href="license.html#a9">Article 9(2) and (5)</a>: the seller offers a free plan that can be used before purchase; features found only in paid plans cannot be tried before purchase. Questions about withdrawal and refunds go to the support center in the app or on the help page, or to the contact shown on the sales page.</li><li><a href="license.html#a10">Article 10(3)</a>: for damage caused by the seller's minor negligence, compensation covers ordinary damage, up to the amount you paid for the program or 100,000 won, whichever is greater (100,000 won if you use only the free plan).</li><li><a href="license.html#a12-2">Article 12-2</a> (new, AMD components): the AMD components (ADLX SDK) in versions with the Radeon driver features may be used only with AMD hardware. You may not transfer, copy (except a reasonable backup), modify, reverse engineer or distribute them, among other things. AMD gives no warranty, and AMD's total liability is at most 100 US dollars. You must follow export and import laws, and AMD may enforce this article directly against you. The seller's warranty and liability follow Article 10 and are not reduced by this article. Until December 31, 2026, you accept these terms separately the first time you use the Radeon features.</li></ul>
  <p>After you update, the app asks you to accept the revised agreement once. Full text: <a href="license.html">License agreement · Privacy</a>. This is a translation: the Korean text is the agreement, and if the two differ, the Korean text governs.</p>

<div class="note"><b>Good to know</b><p>Frame generation has to wait for the next frame, so input latency goes up a little (the app shows how much). Not recommended for competitive games.</p><p>Run games in borderless or windowed mode.</p></div>

  <div class="nh"><span class="badge">새 버전</span><h2>SystemBoost 0.8.18</h2></div>
  <p class="nd">Windows용 · 0.8.14 다음 판이에요. 0.8.15, 0.8.16, 0.8.17은 따로 출시하지 않았어요.</p>
  <div class="ng"><div class="ni"><h3>✦ PC 맞춤 추천 (울트라 · 산업)</h3><p>왼쪽 '✦ 맞춤 추천'에서 '검사 시작'을 누르면 1분쯤 이 PC의 사양(CPU, RAM, 그래픽카드, 모니터)을 읽고 짧은 벤치마크를 돌린 뒤, 프레임 생성 설정(배수, 품질), 부스트 항목, 직접 바꿔야 하는 참고 사항을 추천해요. 게임을 끈 뒤에 검사해요.</p><ul><li>고른 추천은 '선택한 추천 한 번에 적용'으로 켜고, '추천 적용 되돌리기'로 원래대로 돌려요. 바꾸는 설정은 적용 전에 백업돼요.</li><li>벤치마크 값은 게임 FPS가 아니에요. 게임에서의 효과는 게임마다 달라요. 검사 결과는 이 PC에만 저장되고 어디로도 보내지 않아요.</li></ul></div>
  <div class="ni"><h3>👤 회원 계정 (선택)</h3><ul><li>계정은 선택이에요. 키만 쓰는 사용자와 지금의 아이디 회원은 지금처럼 써요.</li><li>이메일로도 가입하고, 아이디나 이메일로 로그인해요. '2단계 인증', '로그인된 기기'(기기 로그아웃), '내 라이선스'(계정에 연결한 키)가 생겼어요.</li><li>'키 다시 받기': 키를 살 때 쓴 이메일을 넣으면 그 이메일로 키를 보내요. 회원이 아니어도 돼요.</li><li>새 계정 기능은 판매자 서버가 업데이트된 뒤에 나타나요. 이메일 가입, 재설정 메일, 키 다시 받기는 판매자가 메일 보내기를 켠 뒤에 쓸 수 있어요.</li></ul></div>
  <div class="ni"><h3>⚠️ 오버클럭 · 전력 제한 안내와 동의</h3><ul><li>오버클럭 / 전력 제한을 처음 켤 때 '오버클럭 · 전력 제한 안내'가 나오고, 동의해야 켜져요. 예전에 켜 두었더라도 동의하기 전에는 그래픽카드 값을 바꾸지 않아요.</li><li>그래픽카드가 바뀌었거나 안내 문구가 바뀌면 다시 물어봐요. '동의 철회'를 누르면 오버클럭 / 전력 제한을 끄고 그래픽카드를 공장 초기값으로 돌려요. 자세한 내용은 <a href="license.html#oc">사용권 계약 제6조의2</a>에 있어요.</li></ul></div>
  <div class="ni"><h3>🖥️ AMD 라데온</h3><ul><li>라데온 드라이버 기능을 AMD 공식 SDK(ADLX)로 넣었어요. 게임에 코드를 넣거나 게임 메모리를 읽지 않아요. 아직 실제 라데온 PC에서 시험하지 않았어요.</li><li>정보 보기(온도, 클럭, 전력, 사용률), 드라이버 게임 프로필(게임 중 Anti-Lag 켜기, Radeon Chill 끄기), 울트라: 데스크톱 라데온의 전력 제한·클럭 조정과 AMD 자동 튜닝, 모든 플랜: 공장 초기값으로 복구.</li><li>2026년 12월 31일까지는 라데온 기능을 처음 쓸 때 AMD 구성 요소 조건(<a href="license.html#a12-2">사용권 계약 제12조의2</a>)에 따로 동의해야 켜져요. 2027년 1월 1일부터는 이 조항이 모든 사용자에게 적용돼요.</li></ul></div>
  <div class="ni"><h3>🆓 3일 체험은 없어요</h3><p>0.8.14의 안내와 사용권 계약(2027년 1월 1일 시행 예정이던 조항)에 3일 체험이 적혀 있었지만, 체험은 제공하지 않아요. 구매 전에는 무료 플랜으로 써 보세요(프레임 생성 2배, 벤치마크).</p></div></div>

<h3 class="bt">5대 · 10대 묶음 키 (2026년 12월 9일부터)</h3>
<div class="card tbl"><table class="bund"><tr><th></th><th>5대</th><th>10대</th></tr><tr><td class="p">프로</td><td>₩84,500 <span class="w">대당 ₩16,900</span></td><td>₩149,000 <span class="w">대당 ₩14,900</span></td></tr><tr><td class="u">울트라</td><td>₩254,500 <span class="w">대당 ₩50,900</span></td><td>₩449,000 <span class="w">대당 ₩44,900</span></td></tr><tr><td class="b">산업</td><td>₩382,000 <span class="w">대당 ₩76,400</span></td><td>₩674,000 <span class="w">대당 ₩67,400</span></td></tr></table></div>
<p class="pl">같은 플랜의 연간 키 5개나 10개를 한 번에 사요. 키 하나에 PC 한 대이고, 회사 업무용 PC나 가족 PC처럼 구매자가 관리하는 PC에 써요. 계좌이체 · 직접 결제로만 팔고, 자동 결제와 할인 티켓은 없어요.</p>
<ul class="fine"><li>가격은 원화(KRW) 기준이에요.</li><li>결제는 앱의 <b>플랜</b> 화면에서 해요. 결제가 확인되면 라이선스 키가 앱에 바로 등록돼요. 결제가 열리기 전에는 버튼이 '결제 준비 중'으로 보여요.</li><li><b>계좌이체 · 직접 결제</b>는 자동으로 결제되지 않아요. 기간이 끝나면 무료 플랜으로 돌아가고, 계속 쓰려면 다시 결제하면 돼요.</li><li>계좌이체는 이렇게 해요: 앱에서 주문 코드(SB-XXXX-XXXX)를 받고 → 판매자 계좌로 입금하고 → 앱에서 '고객센터에 입금 알리기'를 누르면 → 판매자가 확인한 뒤 24시간 안에 키를 보내요. 24시간은 입금을 알린 때부터예요.</li><li><b>카드 구독</b>은 2026년 12월 8일부터 열려요. 해지할 때까지 기간마다 자동으로 결제되고 키도 자동으로 연장돼요. 해지는 결제 메일의 구독 관리 링크에서 언제든 할 수 있고, 이미 결제한 기간까지는 써요.</li><li>유료 플랜에만 있는 기능은 구매 전에 써 볼 수 없어요. 무료 플랜에도 2배 프레임 생성과 벤치마크가 있으니, 먼저 내 PC에서 확인해 보세요.</li><li>추천 코드나 초대 코드가 있으면 플랜 화면과 계정 메뉴에서 입력할 수 있어요. 초대 보상인 할인 티켓은 직접 결제에만 쓸 수 있어요.</li><li>키는 받은 날부터 7일 안에 청약을 철회할 수 있어요. 키를 등록해 유료 기능을 쓰기 시작하면 철회가 제한될 수 있어요. 자세한 조건은 <a href="license.html#a9">사용권 계약 제9조</a>에 있어요.</li><li><b>산업</b> 키는 0.8.10 이상에서 써요.</li><li>이미 받은 프리미엄 키는 그대로 프로로 쓸 수 있어요.</li></ul>
<h2>설치</h2>
<div class="note"><b>Windows</b><ol><li>설치판을 받아 실행하면 바로 설치되고 켜져요. 관리자 권한은 필요 없어요.</li><li>"Windows의 PC 보호" 창이 뜨면 <b>추가 정보 → 실행</b>을 누르세요. 아직 코드 서명 전이라 처음 한 번 떠요.</li><li>포터블은 압축을 풀고 SystemBoost.exe를 실행하면 돼요.</li></ol></div>
<div class="note"><b>알아 두세요</b><p>프레임 생성은 다음 프레임을 기다려야 해서 입력 지연이 조금 늘어요(늘어난 값은 프로그램에 표시돼요). 빠른 반응이 중요한 경쟁 게임에는 권장하지 않아요.</p><p>게임은 테두리 없는 창 또는 창 모드로 실행해 주세요.</p></div>

  <div class="nh"><span class="badge">新バージョン</span><h2>SystemBoost 0.8.18</h2></div>
  <p class="nd">Windows版 · 0.8.14の次のバージョンです。0.8.15、0.8.16、0.8.17は個別にリリースしていません。</p>
  <div class="ng"><div class="ni"><h3>✦ PCに合わせたおすすめ（ウルトラ・ビジネス）</h3><p>左の「✦ Recommendations」で「Start check」を押すと、約1分でこのPCのスペック（CPU、RAM、グラフィックスカード、モニター）を読み取って短いベンチマークを実行し、フレーム生成の設定（倍率、品質）、ブースト項目、自分で変える必要がある参考事項をおすすめします。ゲームを閉じてから検査してください。</p><ul><li>選んだおすすめは「Apply selected recommendations at once」でまとめてオンにし、「Undo applied recommendations」で元に戻せます。変更する設定は適用前にバックアップされます。</li><li>ベンチマークの値はゲームのFPSではありません。ゲームでの効果はゲームによって違います。検査結果はこのPCにだけ保存され、どこにも送信しません。</li></ul></div>
  <div class="ni"><h3>👤 会員アカウント（任意）</h3><ul><li>アカウントは任意です。キーだけを使う方も今のID会員も、これまでどおり使えます。</li><li>メールアドレスでも登録でき、IDかメールでログインします。「Two-step verification」（2段階認証）、「Logged-in devices」（デバイスのログアウト）、「My licenses」（アカウントに連携したキー）が加わりました。</li><li>「Get my key again」：キーを買ったときのメールアドレスを入れると、そのアドレスにキーを送ります。会員でなくても使えます。</li><li>新しいアカウント機能は、販売者のサーバーが更新されてから表示されます。メールでの登録、再設定メール、「Get my key again」は、販売者がメール送信をオンにしてから使えます。</li></ul></div>
  <div class="ni"><h3>⚠️ オーバークロック・電力制限の案内と同意</h3><ul><li>オーバークロック / 電力制限を初めてオンにするとき「Overclocking &amp; Power Limit Notice」が表示され、同意するとオンになります。以前にオンにしていても、同意するまではグラフィックスカードの値を変えません。</li><li>グラフィックスカードや案内の文言が変わると、もう一度確認します。「Withdraw consent」を押すとオーバークロック / 電力制限をオフにし、グラフィックスカードを工場出荷時の値に戻します。詳しくは<a href="license.html#oc">使用許諾契約 第6条の2</a>をご覧ください。</li></ul></div>
  <div class="ni"><h3>🖥️ AMD Radeon</h3><ul><li>Radeonのドライバー機能をAMD公式SDK（ADLX）で組み込みました。ゲームにコードを入れたり、ゲームのメモリを読んだりしません。実際のRadeon搭載PCではまだテストしていません。</li><li>情報表示（温度、クロック、電力、使用率）、ドライバーのゲームプロファイル（ゲーム中にAnti-Lagをオン、Radeon Chillをオフ）、ウルトラ：デスクトップ向けRadeonの電力制限・クロック調整とAMD自動チューニング、全プラン：工場出荷時の値に戻す。</li><li>2026年12月31日までは、Radeon機能を初めて使うときにAMDコンポーネントの条件（<a href="license.html#a12-2">使用許諾契約 第12条の2</a>）に別途同意するとオンになります。2027年1月1日からは、この条項がすべての利用者に適用されます。</li></ul></div>
  <div class="ni"><h3>🆓 3日間体験はありません</h3><p>0.8.14の案内と使用許諾契約（2027年1月1日に施行予定だった条項）には3日間体験が書かれていましたが、体験は提供しません。購入前は無料プランでお試しください（2倍のフレーム生成、ベンチマーク）。</p></div></div>
  <p class="nf">アプリが新しいバージョンを自動でダウンロードし、閉じるときに適用します。すべての変更は<a href="https://github.com/DOKU-web/SystemBoost/releases/latest">リリースノート</a>と<a href="https://discord.gg/zUyeV2SJwm">公式Discord</a>の#changelogにあります。</p>

<section id="news" class="news">
  <div class="nh"><span class="badge">Nuevo</span><h2>SystemBoost 0.8.18</h2></div>
  <p class="nd">Para Windows · la versión siguiente a la 0.8.14. Las versiones 0.8.15, 0.8.16 y 0.8.17 no se publicaron por separado.</p>
  <div class="ng"><div class="ni"><h3>✦ Recomendaciones para tu PC (Ultra · Business)</h3><p>Pulsa «Start check» en «✦ Recommendations», a la izquierda. Durante un minuto aproximadamente, la app lee las especificaciones de este PC (CPU, RAM, tarjeta gráfica, monitor) y ejecuta benchmarks cortos; después recomienda ajustes de generación de fotogramas (multiplicador, calidad), opciones de boost y cosas que debes cambiar tú. Haz la comprobación con los juegos cerrados.</p><ul><li>Activa las que elijas con «Apply selected recommendations at once» y deshazlas con «Undo applied recommendations». Los ajustes se guardan en una copia de seguridad antes de cambiar.</li><li>Los valores del benchmark no son FPS de juego. El efecto en los juegos varía según el juego. Los resultados solo se guardan en este PC y no se envían a ninguna parte.</li></ul></div>
  <div class="ni"><h3>👤 Cuentas de miembro (opcional)</h3><ul><li>La cuenta es opcional. Quienes solo usan una clave y los miembros actuales con ID siguen como hasta ahora.</li><li>Ahora también puedes registrarte con un correo e iniciar sesión con tu ID o tu correo. Novedades: «Two-step verification» (verificación en dos pasos), «Logged-in devices» (cerrar sesión en dispositivos) y «My licenses» (claves vinculadas a tu cuenta).</li><li>«Get my key again»: escribe el correo con el que compraste la clave y la clave se envía a ese correo. No hace falta ser miembro.</li><li>Las nuevas funciones de cuenta aparecen cuando se actualiza el servidor del vendedor. El registro por correo, los correos de restablecimiento y «Get my key again» funcionan cuando el vendedor activa el envío de correos.</li></ul></div>
  <div class="ni"><h3>⚠️ Aviso y consentimiento de overclock · límite de potencia</h3><ul><li>La primera vez que activas el overclock / límite de potencia aparece el «Overclocking &amp; Power Limit Notice», y solo se activa cuando aceptas. Aunque lo hubieras activado antes, la app no cambia ningún valor de la tarjeta gráfica hasta que aceptes.</li><li>Se te vuelve a preguntar si cambia la tarjeta gráfica o el texto del aviso. «Withdraw consent» desactiva el overclock / límite de potencia y devuelve la tarjeta gráfica a los valores de fábrica. Detalles en el <a href="license.html#oc">artículo 6-2 del contrato</a>.</li></ul></div>
  <div class="ni"><h3>🖥️ AMD Radeon</h3><ul><li>Las funciones del controlador Radeon se han hecho con el SDK oficial de AMD (ADLX). No introducen código en los juegos ni leen su memoria. Aún no se han probado en un PC con Radeon real.</li><li>Información (temperatura, frecuencias, potencia, uso), perfil de juego del controlador (Anti-Lag activado y Radeon Chill desactivado durante el juego), Ultra: límite de potencia y ajuste de frecuencias y ajuste automático de AMD en Radeon de escritorio, todos los planes: restaurar los valores de fábrica.</li><li>Hasta el 31 de diciembre de 2026, las funciones Radeon solo se activan si, la primera vez que las usas, aceptas por separado las condiciones de los componentes de AMD (<a href="license.html#a12-2">artículo 12-2 del contrato</a>). Desde el 1 de enero de 2027, este artículo se aplica a todos los usuarios.</li></ul></div>
  <div class="ni"><h3>🆓 No hay prueba de 3 días</h3><p>Los avisos y el contrato de licencia de la 0.8.14 (en una cláusula que iba a entrar en vigor el 1 de enero de 2027) mencionaban una prueba de 3 días, pero no se ofrece ninguna prueba. Antes de comprar, usa el plan gratuito (generación de fotogramas 2×, benchmark).</p></div></div>
  <p class="nf">La app descarga sola las versiones nuevas y las instala al cerrarla. Todos los cambios: <a href="https://github.com/DOKU-web/SystemBoost/releases/latest">notas de la versión</a> y #changelog en el <a href="https://discord.gg/zUyeV2SJwm">Discord oficial</a>.</p>

  <div class="nh"><span class="badge">Novo</span><h2>SystemBoost 0.8.18</h2></div>
  <p class="nd">Para Windows · a versão seguinte à 0.8.14. As versões 0.8.15, 0.8.16 e 0.8.17 não foram lançadas separadamente.</p>
  <div class="ng"><div class="ni"><h3>✦ Recomendações para o seu PC (Ultra · Business)</h3><p>Clique em «Start check» em «✦ Recommendations», à esquerda. Em cerca de um minuto, o app lê as especificações deste PC (CPU, RAM, placa de vídeo, monitor) e roda benchmarks curtos; depois recomenda configurações de geração de quadros (multiplicador, qualidade), opções de boost e coisas que você mesmo precisa mudar. Faça a verificação com os jogos fechados.</p><ul><li>Ative as que escolher com «Apply selected recommendations at once» e desfaça com «Undo applied recommendations». As configurações recebem backup antes de mudar.</li><li>Os valores do benchmark não são FPS de jogo. O efeito nos jogos varia de jogo para jogo. Os resultados ficam só neste PC e não são enviados a lugar nenhum.</li></ul></div>
  <div class="ni"><h3>👤 Contas de membro (opcional)</h3><ul><li>A conta é opcional. Quem usa só a chave e os membros atuais com ID continuam como agora.</li><li>Agora também dá para se cadastrar com e-mail e entrar com ID ou e-mail. Novidades: «Two-step verification» (verificação em duas etapas), «Logged-in devices» (desconectar dispositivos) e «My licenses» (chaves vinculadas à conta).</li><li>«Get my key again»: informe o e-mail usado na compra da chave, e ela é enviada para esse e-mail. Não precisa ser membro.</li><li>Os novos recursos de conta aparecem depois que o servidor do vendedor for atualizado. Cadastro por e-mail, e-mails de redefinição e «Get my key again» funcionam depois que o vendedor ativar o envio de e-mails.</li></ul></div>

<section id="news" class="news">
  <div class="nh"><span class="badge">Neu</span><h2>SystemBoost 0.8.18</h2></div>
  <p class="nd">Für Windows · die nächste Version nach 0.8.14. 0.8.15, 0.8.16 und 0.8.17 wurden nicht einzeln veröffentlicht.</p>
  <div class="ng"><div class="ni"><h3>✦ Empfehlungen für deinen PC (Ultra · Business)</h3><p>Klicke links unter „✦ Recommendations“ auf „Start check“. Etwa eine Minute lang liest die App die Daten dieses PCs aus (CPU, RAM, Grafikkarte, Monitor) und führt kurze Benchmarks aus; danach empfiehlt sie Einstellungen für die Bildgenerierung (Faktor, Qualität), Boost-Optionen und Dinge, die du selbst ändern musst. Schließe vor dem Check deine Spiele.</p><ul><li>Ausgewählte Empfehlungen schaltest du mit „Apply selected recommendations at once“ ein, mit „Undo applied recommendations“ machst du sie rückgängig. Geänderte Einstellungen werden vorher gesichert.</li><li>Benchmark-Werte sind keine Spiel-FPS. Die Wirkung in Spielen ist von Spiel zu Spiel verschieden. Die Ergebnisse bleiben nur auf diesem PC und werden nirgendwohin gesendet.</li></ul></div>
  <div class="ni"><h3>👤 Mitgliedskonto (freiwillig)</h3><ul><li>Ein Konto ist freiwillig. Wer nur einen Schlüssel nutzt und bisherige ID-Mitglieder machen weiter wie jetzt.</li><li>Du kannst dich jetzt auch per E-Mail registrieren und mit ID oder E-Mail anmelden. Neu: „Two-step verification“ (Zwei-Schritt-Bestätigung), „Logged-in devices“ (Geräte abmelden) und „My licenses“ (mit dem Konto verknüpfte Schlüssel).</li><li>„Get my key again“: Gib die E-Mail-Adresse ein, mit der du den Schlüssel gekauft hast, und der Schlüssel wird an diese Adresse geschickt. Eine Mitgliedschaft ist nicht nötig.</li><li>Die neuen Kontofunktionen erscheinen, nachdem der Server des Verkäufers aktualisiert wurde. Registrierung per E-Mail, Mails zum Zurücksetzen und „Get my key again“ funktionieren, sobald der Verkäufer den Mailversand einschaltet.</li></ul></div>
  <div class="ni"><h3>⚠️ Hinweis und Zustimmung zu Übertaktung · Leistungslimit</h3><ul><li>Wenn du Übertaktung / Leistungslimit zum ersten Mal einschaltest, erscheint die „Overclocking &amp; Power Limit Notice“; eingeschaltet wird erst nach deiner Zustimmung. Auch wenn du die Funktion früher eingeschaltet hattest, ändert die App bis zu deiner Zustimmung keine Werte der Grafikkarte.</li><li>Ändern sich die Grafikkarte oder der Text des Hinweises, wirst du erneut gefragt. „Withdraw consent“ schaltet Übertaktung / Leistungslimit aus und setzt die Grafikkarte auf die Werkswerte zurück. Details in <a href="license.html#oc">Artikel 6-2 der Vereinbarung</a>.</li></ul></div>
  <div class="ni"><h3>🖥️ AMD Radeon</h3><ul><li>Die Radeon-Treiberfunktionen sind mit dem offiziellen SDK von AMD (ADLX) gebaut. Sie schleusen keinen Code in Spiele ein und lesen keinen Spielspeicher. Auf einem echten Radeon-PC wurden sie noch nicht getestet.</li><li>Informationen (Temperatur, Takt, Leistung, Auslastung), Treiber-Spielprofil (im Spiel Anti-Lag an und Radeon Chill aus), Ultra: Leistungslimit und Taktanpassung sowie AMD-Auto-Tuning für Desktop-Radeon, alle Pläne: Werkseinstellungen wiederherstellen.</li><li>Bis zum 31. Dezember 2026 werden die Radeon-Funktionen erst eingeschaltet, wenn du bei der ersten Nutzung den Bedingungen für die AMD-Komponenten (<a href="license.html#a12-2">Artikel 12-2 der Vereinbarung</a>) gesondert zustimmst. Ab dem 1. Januar 2027 gilt dieser Artikel für alle Nutzer.</li></ul></div>
  <div class="ni"><h3>🆓 Kein 3-Tage-Test</h3><p>In den Hinweisen und der Lizenzvereinbarung von 0.8.14 (in einer Klausel, die am 1. Januar 2027 in Kraft treten sollte) stand ein 3-Tage-Test, aber es gibt keinen Test. Probiere vor dem Kauf den kostenlosen Plan aus (2× Bildgenerierung, Benchmark).</p></div></div>
  <p class="nf">Die App lädt neue Versionen selbst und installiert sie beim Schließen. Alle Änderungen: <a href="https://github.com/DOKU-web/SystemBoost/releases/latest">Versionshinweise</a> und #changelog im <a href="https://discord.gg/zUyeV2SJwm">offiziellen Discord</a>.</p>
