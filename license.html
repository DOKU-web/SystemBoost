<h2 id="a1">Article 1 (Subject of this agreement) <span class="rev">Revised Jan 1, 2027</span></h2>

<h2 id="a5">Article 5 (Games and anti-cheat)</h2>
<p><span class="no">1.</span> The Program captures the game&#x27;s picture and shows it in a separate overlay. It does not inject code into game processes and does not change game memory or game files.</p>

<h2 id="a6">Article 6 (Features that change system settings)</h2>
<p class="chg"><span class="no">1.</span> Game boost, the work and streaming features (stream mode, work mode, startup programs), overclocking and power limits run only when the User turns them on. The Program backs up the previous values and provides a way to restore them. <span class="rev">Revised Dec 9, 2026</span></p>
<p class="imp"><span class="no">2.</span> Overclocking can cause game crashes, system freezes and driver errors. It may also affect the graphics card manufacturer&#x27;s warranty.</p>

<p class="imp"><span class="no">3.</span> The Seller does not guarantee that automatic recovery always works when a driver or hardware error has occurred.</p>
<h2 id="oc">Article 6-2 (Overclocking and hardware tuning) <span class="rev">Revised Jan 1, 2027</span></h2>
<p class="imp"><span class="no">1.</span> Overclocking and changing the power limit run your graphics card beyond the manufacturer&#x27;s default settings. This may cause system instability, game crashes, higher temperatures, shorter component lifespan, or hardware damage, and may void your GPU or PC manufacturer&#x27;s warranty.</p>
<p><span class="no">2.</span> SystemBoost provides temperature monitoring and automatic recovery, but cannot prevent every problem.</p>

<p><span class="no">4.</span> Paragraphs 1 to 3 are the wording of the app&#x27;s &quot;Overclocking &amp; Power Limit Notice&quot;. The notice and the consent also cover automatic tuning (automatic undervolting and overclocking) and changes that lower values. The Program shows the notice the first time overclocking or the power limit is turned on, and turns them on only after the User agrees. The User is asked again when the graphics card changes, when the notice&#x27;s wording changes, and when a preset containing overclocking values is imported.</p>
<p><span class="no">5.</span> The User can withdraw consent in the app at any time. The Program then turns overclocking and the power limit off, puts back the values it changed and returns the graphics card&#x27;s power limit and clocks to factory values. Settings changed by other programs (such as voltage or fans) may remain, and the app says so if it cannot put the values back.</p>
<p><span class="no">6.</span> A record of each consent and withdrawal (the notice&#x27;s version, time, graphics card model and app version) stays on the User&#x27;s PC. When the User agrees or withdraws in an app signed in as a member, the same record is also kept with the member account (Article 8, Paragraph 5).</p>

<p><span class="no">3.</span> Output FPS follows the monitor&#x27;s refresh rate unless the User chooses an output rate. A chosen rate can exceed the refresh rate, but a monitor displays only up to its own refresh rate.</p>
<p><span class="no">4.</span> Measurements on the sales page are results in the stated environment. Actual results differ by PC, game and settings.</p>
<h2 id="a8">Article 8 (Network use and personal information) <span class="rev">Revised Jan 1, 2027</span></h2>
<p><span class="no">1.</span> The Program sends the key&#x27;s identifying number to the Seller&#x27;s license server to check the key. It sends the subscription number and the key in use when renewing a subscription key, and the order code and the payer name and payment memo the User entered when paying directly. It connects to GitHub to check for updates.</p>
<p class="cont">The Seller&#x27;s server keeps the full text of each key it issues and the key&#x27;s record (plan, issue and expiry dates, email address, subscription number, note). The email address is the payment email of a card payment or an email the Seller entered, and it is also inside the key. If the Seller approves a direct payment with the note left empty, the payer name and payment memo go into the key record&#x27;s note. No retention period is set for key records or for the index that finds keys by email address; they are kept until the Seller deletes them.</p>
<p class="cont">Orders keep the order code, plan, payment method, the payer name and payment memo of a direct payment, and the email address, and are deleted 90 days after the order last changed. The Seller&#x27;s activity log also keeps email addresses and notes for 180 days.</p>
<p class="cont">When the User answers a price change notice for a card subscription, the Seller keeps the subscription number, the key&#x27;s identifying number, the answer chosen (agree or cancel), the time of the answer and how it was handled for 3 years from the day of the answer. If the Seller has turned it on, when a deposit is reported for a bank transfer order, the Seller is notified in a Discord channel only the Seller sees (Discord Inc., a US company) of the order code, the plan and the deadline for sending the key. Email addresses, names, payer names and payment memos are not sent.</p>
<p class="cont">The Seller&#x27;s server and its data are processed and stored in data centers that Cloudflare, Inc. (a US company) runs around the world, so personal information is transferred abroad. Member information is stored in Supabase&#x27;s database service; its location is shown in the privacy policy.</p>
<p><span class="no">2.</span> While it is on, the Program sends the Seller&#x27;s server a randomly created install number, the app version, operating system, plan, frame generation multiplier, and whether one-click game boost is in use, for usage statistics. The server also records the country of the connection and the times of the first and last connection. Keys, email addresses, game names and hardware information are not sent, and usage statistics store no IP address. The install number is deleted 90 days after the last connection.</p>
<p><span class="no">3.</span> Usage statistics are optional and start off. The User chooses whether to send them on the screen where the User agrees to this agreement, and can change this later in the app&#x27;s settings. When they are off, the Program sends no usage statistics.</p>
<p><span class="no">4.</span> When the User enters a referral code, the Program sends the code and a randomly created device number to the Seller&#x27;s server. Signing up as a member also sends the device number, but the server keeps it only when an invite code is used. The device number is used only to stop the same device from using a code again, and is deleted after 90 days.</p>
<p><span class="no">5.</span> Signing up as a member is optional and open only to people aged 14 or over. Members sign up with an ID or an email address. For members, the Seller keeps the ID (for an email sign-up, a member number the server creates), the email address (when signing up by email or adding one to the account) and the time it was confirmed, the password and recovery code as hash values, the times of sign-up and last login, the version and time of the notice agreed to, the invite code, the inviting member, the number of invitations and reward days, discount tickets (including the order code a ticket was used on), failed logins and lockouts, whether the member is blocked, login sessions and signed-in devices (device name, a hash value of the device number the app creates, the country of the connection, the times of the first and last connection), the keys linked to the account, and the records of consent to and withdrawal from the overclocking notice in Supabase&#x27;s database service. When 2-step login is turned on, the Seller also keeps the authenticator app&#x27;s secret (encrypted) and the backup codes (as hash values). This information is used to manage members, for login and account protection, for alerts of a login on a new device, for invite rewards and discount tickets, and to show a member&#x27;s keys. If a member sends a request to the support center while signed in to the app, the member&#x27;s ID is attached to it.</p>
<p class="cont">To check for account takeover, the Seller keeps a security log for 30 days: the time and kind of events such as logins, password changes and resets, changes to 2-step login, added email addresses, linked keys and account recovery requests, with the IP address, the country of the connection and the device name at that time. When a member who has lost both the password and the recovery code asks for account recovery, the Seller keeps the request and the details the member entered to confirm it (contact, order code, payment date, amount, last 4 digits of the card number, payer name and the like) for 90 days from the request and uses them only to confirm the member&#x27;s identity.</p>
<p class="cont">The Seller sends member emails (sign-up confirmation, password reset, alerts of a login on a new device and of a password change, key link confirmation, notice of an account recovery request), and the key resend emails that anyone can ask for without being a member, through Resend, Inc. (a US company). The recipient&#x27;s email address and the content of the email (for a key resend, the full key) are then transferred abroad. An email address entered to have keys sent again is used only to find the keys bought with it and send them to it, and is not stored. The Seller sends no advertising email.</p>
<p class="cont">When a member leaves, the member information in the live database is deleted at once, and a copy stays only in the backups described in Paragraph 9. The ID remains, however, in the record of an invite reward key (until the Seller deletes it), the Seller&#x27;s activity log (180 days) and support requests (for their retention period). Keys and payment records are not deleted when a member leaves, and keys keep working without membership.</p>
<p><span class="no">6.</span> To prevent abuse of sign-up, login, email requests (password reset, key resend, account recovery requests) and the support center, the Seller keeps hash values made from the connecting IP address for a short time. The hash values are made with a value only the server knows. Those for sign-up, login and email requests are deleted at the hourly cleanup after the clock hour they were counted in ends; those for the support center stay on the Seller&#x27;s server for up to 1 hour after the last request. A connection that enters a wrong password on the Seller&#x27;s dashboard is also counted by a hash value instead of the IP address, kept for 15 minutes after the last wrong attempt. Failed logins with an ID or email address that does not exist are kept as hash values for 1 day after the last failure (until the lockout ends, if locked). To avoid sending too many emails to one address, the emails sent are counted per hash value of the email address for 1 hour.</p>
<p><span class="no">7.</span> When the User sends a request to the support center, the Seller keeps its category, title, text, the Seller&#x27;s replies, the time of each message, its status, the time of consent, the language and a hash value of the access code. If the User enters or chooses them, the Seller also keeps the contact, order code, the key&#x27;s identifying number and app information (app version, operating system, GPU name). A refund request also carries its reason and the order and key information the server has (plan, the dates the key was received and expires, how it was received, subscription number, order code, payer name, order status, payment method). A full key sent for a refund request or subscription management is used only for checking and is not stored. Requests about payments and refunds are kept for 3 years and other requests for 1 year, counted from the day the request last changed.</p>
<p><span class="no">8.</span> The privacy policy can be seen in the app&#x27;s settings screen, in the support center, and on the /privacy page of the Seller&#x27;s server.</p>
<p><span class="no">9.</span> Deleted records stay for a short time in the backup and recovery features of the service companies. Records kept in Cloudflare&#x27;s database (Durable Objects), such as usage statistics, stay for up to 30 days after deletion, and member information kept in Supabase for up to 7 days after deletion, and are then gone. The Seller uses these copies only to recover from a failure, and after a recovery deletes again the records that had been deleted before.</p>

<h2 id="a1">제1조 (계약의 대상) <span class="rev">2027년 1월 1일 개정</span></h2>
<p>이 계약은 판매자와 SystemBoost(Windows용 프로그램으로, 앱, 엔진, 업데이트, 문서를 포함하며 이하 “프로그램”)를 설치하거나 쓰는 사람(이하 “사용자”) 사이에 적용됩니다. 사용자는 앱의 동의 화면에서 이 계약에 동의한 뒤 프로그램을 씁니다.</p>
<p class="cont">이 계약에서 “판매 페이지”는 앱의 ★ 플랜 화면과 고객센터, 판매자 서버의 도움말 페이지(/help)를 말합니다.</p>
<h2 id="a2">제2조 (사용권)</h2>
<p class="chg"><span class="no">1.</span> 판매자는 사용자에게 프로그램을 본인의 컴퓨터에서 쓸 수 있는 비독점적 사용권을 줍니다. 묶음 키를 산 사용자는 자신이 관리하는 컴퓨터(회사의 업무용 컴퓨터, 가족의 컴퓨터 등)에서도 쓸 수 있습니다. <span class="rev">2026년 12월 9일 개정</span></p>
<p><span class="no">2.</span> 프로그램은 판매되는 것이 아니라 사용이 허락되는 것입니다. 이 계약은 프로그램이나 그 구성 요소에 대한 권리를 사용자에게 넘기지 않습니다.</p>
<p><span class="no">3.</span> 사용자는 사용권을 다른 사람에게 넘길 수 없습니다.</p>
<h2 id="a3">제3조 (플랜과 라이선스 키)</h2>
<p><span class="no">1.</span> 무료 플랜은 키 없이 쓸 수 있습니다.</p>
<p class="chg"><span class="no">2.</span> 프로, 울트라, 산업 플랜은 판매자가 발급한 라이선스 키로 엽니다. 플랜별 기능과 기능을 쓰는 데 필요한 사양은 구매할 때 앱의 ★ 플랜 화면에 표시된 대로입니다. <span class="rev">2026년 12월 9일 개정</span> <span class="rev">2027년 1월 1일 개정</span></p>
<p class="chg"><span class="no">3.</span> 월간 키와 연간 키는 표시된 기간이 끝나면 유료 기능이 잠기고 무료 플랜으로 돌아갑니다. 계좌이체 등 직접 결제로 산 키는 자동으로 결제되지 않으므로 따로 해지할 것이 없습니다. 카드 구독으로 산 키는 사용자가 해지할 때까지 같은 기간(월간 또는 연간)마다 결제할 때 표시된 금액이 자동으로 결제되고, 결제될 때마다 그 기간만큼 연장됩니다. 해지는 결제 메일의 구독 관리 링크에서 언제든 할 수 있습니다(앱의 고객센터에서도 안내합니다). 해지하면 다음 자동 결제가 멈추고, 이미 결제한 기간이 끝날 때까지 쓴 뒤 무료 플랜으로 돌아갑니다. 연간 구독을 기간 중에 해지해도 같습니다. 이미 결제한 기간의 대금은 제9조의 청약철회, 이 조 제10항, 그 밖에 법령이 환급을 정한 경우에 돌려줍니다. 결제가 되지 않으면 키는 연장되지 않습니다. <span class="rev">2026년 12월 8일 개정</span> <span class="rev">2027년 1월 1일 개정</span></p>
<p><span class="no">4.</span> 평생 키는 사용 기간에 제한이 없습니다. 앞으로 나올 모든 운영체제와 게임에서 동작한다는 뜻은 아닙니다.</p>
<p class="chg"><span class="no">5.</span> 키는 구매자 본인만 씁니다. 다른 사람에게 주거나 공개할 수 없습니다. 묶음 키는 제9항을 따릅니다. <span class="rev">2026년 12월 9일 개정</span></p>
<p><span class="no">6.</span> 판매자는 키가 공개되거나 부정하게 쓰이면 그 키를 막을 수 있습니다. 막힌 키는 앱이 온라인으로 시작할 때 무료 플랜으로 돌아갑니다.</p>
<p><span class="no">7.</span> 추천 코드나 초대 코드로 받은 키는 표시된 기간 동안만 쓸 수 있습니다. 판매자는 추천 코드를 언제든 끝낼 수 있고, 이미 받은 키는 그 기간까지 쓸 수 있습니다.</p>
<p class="chg"><span class="no">8.</span> 회원은 초대 코드를 만들 수 있습니다. 초대 보상은 앱에 표시된 기간의 프로 키로 받습니다. 가입할 때 초대 코드를 쓴 회원은 앱에 표시된 할인 티켓을 받습니다. 티켓은 표시된 기간 안에 직접 결제에서 한 번 쓸 수 있고, 현금으로 바꾸거나 다른 사람에게 넘길 수 없습니다. 판매자는 거짓 계정 등 부정한 방법으로 얻은 보상을 취소하고 그 계정을 막을 수 있습니다. <span class="rev">2026년 12월 9일 개정</span></p>
<p class="chg"><span class="no">9.</span> 묶음 키는 같은 플랜의 연간 키 여러 개를 한 번에 사는 것입니다. 키 하나는 컴퓨터 한 대에 씁니다. 구매자는 자신이 관리하는 컴퓨터를 쓰는 사람(직원, 가족 등)에게 그 컴퓨터에 쓸 키를 줄 수 있고, 그 밖의 사람에게 팔거나 주거나 공개할 수 없습니다. 판매자는 공개되거나 부정하게 쓰인 키만 막고, 같은 묶음의 다른 키는 계속 쓸 수 있습니다. 묶음 키는 자동으로 결제되지 않고 할인 티켓을 쓸 수 없습니다. <span class="rev">2026년 12월 9일 개정</span></p>
<p class="chg"><span class="no">10.</span> 판매자가 계좌이체 등 직접 결제 주문을 승인하지 않고 거절하면 키를 발급하지 않습니다. 그 주문으로 이미 받은 돈이 있으면, 판매자는 그 돈을 지체 없이, 늦어도 받은 날부터 3영업일 안에 돌려주거나 돌려주는 데 필요한 조치를 합니다. <span class="rev">2027년 1월 1일 개정</span></p>
<p class="chg"><span class="no">11.</span> 미성년자가 법정대리인의 동의 없이 유료 플랜을 사면, 미성년자 본인이나 법정대리인이 그 구매 계약을 취소할 수 있습니다. 다만 법정대리인이 쓰도록 허락한 재산으로 산 경우처럼 민법이 취소를 인정하지 않는 경우는 제외합니다. <span class="rev">2027년 1월 1일 개정</span></p>
<h2 id="a4">제4조 (금지 행위)</h2>
<p>사용자는 다음 행위를 할 수 없습니다.</p>
<p class="imp"><span class="no">1.</span> 라이선스 확인이나 플랜 잠금을 우회하거나 없애는 행위, 그런 수단을 배포하는 행위</p>
<p class="imp"><span class="no">2.</span> 프로그램이나 키를 복제, 판매, 대여, 재배포하는 행위</p>
<p><span class="no">3.</span> 프로그램을 수정하거나 역분석하는 행위. 법이나 오픈소스 구성 요소의 라이선스가 허용하는 경우는 제외합니다.</p>
<p><span class="no">4.</span> 공개된 코드를 허락 없이 쓰는 행위</p>
<p><span class="no">5.</span> 프로그램에 있는 저작권 표시를 지우는 행위</p>
<h2 id="a5">제5조 (게임과 안티치트)</h2>
<p><span class="no">1.</span> 프로그램은 게임 화면을 캡처해 별도의 오버레이에 표시합니다. 게임 프로세스에 코드를 주입하지 않고 게임 메모리와 게임 파일을 바꾸지 않습니다.</p>
<p class="imp"><span class="no">2.</span> 판매자는 안티치트를 쓰는 게임에서 프로그램을 시험하지 않았습니다. 프로그램이 모든 게임의 이용약관이나 안티치트 정책에 맞는다고 보장하지 않습니다.</p>
<p class="imp"><span class="no">3.</span> 게임의 정책은 사용자가 쓰기 전에 직접 확인해야 합니다.</p>
<h2 id="a6">제6조 (시스템 설정을 바꾸는 기능)</h2>
<p class="chg"><span class="no">1.</span> 게임 부스트, 업무·방송 기능(방송 모드, 업무 모드, 시작 프로그램 정리), 오버클럭, 전력 제한은 사용자가 켤 때만 동작합니다. 프로그램은 바꾸기 전 값을 백업하고 되돌리는 기능을 제공합니다. <span class="rev">2026년 12월 9일 개정</span></p>
<p class="imp"><span class="no">2.</span> 오버클럭은 게임 강제 종료, 시스템 멈춤, 드라이버 오류를 일으킬 수 있습니다. 그래픽 카드 제조사의 보증에 영향을 줄 수도 있습니다.</p>
<p class="cont">위험을 이해한 뒤 작은 값부터 쓰세요.</p>
<p class="imp"><span class="no">3.</span> 드라이버나 하드웨어에 오류가 생긴 상황에서 자동 복구가 항상 동작한다고 보장하지 않습니다.</p>
<h2 id="oc">제6조의2 (오버클럭 및 하드웨어 조정) <span class="rev">2027년 1월 1일 개정</span></h2>
<p class="imp"><span class="no">1.</span> 오버클럭과 전력 제한 변경은 그래픽카드를 제조사 기본값보다 높은 조건에서 동작하게 합니다. 이로 인해 시스템 불안정, 게임 충돌, 발열 증가, 부품 수명 단축, 하드웨어 손상이 생길 수 있습니다. 그래픽카드·PC 제조사의 보증을 받지 못할 수도 있습니다.</p>
<p><span class="no">2.</span> SystemBoost는 온도 감시와 자동 복구 기능을 제공하지만, 모든 문제를 막을 수는 없습니다.</p>
<p class="imp"><span class="no">3.</span> 이 기능을 켜고 사용하는 결정과 그로 인한 결과의 책임은 사용자 본인에게 있습니다. 단, SystemBoost의 고의 또는 중대한 과실로 생긴 손해는 예외로 합니다.</p>
<p><span class="no">4.</span> 제1항부터 제3항은 앱의 &#x27;오버클럭 · 전력 제한 안내&#x27;와 같은 문구입니다. 이 안내와 동의는 자동 튜닝(자동 언더볼트, 자동 오버클럭)과 값을 낮추는 조정에도 적용됩니다. 프로그램은 오버클럭이나 전력 제한을 처음 켤 때 이 안내를 보여 주고, 사용자가 동의한 뒤에만 켭니다. 그래픽카드가 바뀌었을 때, 안내 문구가 바뀌었을 때, 오버클럭 값이 들어 있는 프리셋을 가져올 때에는 다시 동의를 받습니다.</p>
<p><span class="no">5.</span> 사용자는 앱에서 언제든 동의를 철회할 수 있습니다. 철회하면 프로그램은 오버클럭과 전력 제한을 끄고 자신이 바꾼 값을 되돌린 뒤, 그래픽카드의 전력 제한과 클럭을 공장 초기값으로 돌립니다. 다른 프로그램이 바꾼 설정(전압, 팬 등)은 남을 수 있고, 되돌리지 못하면 앱이 알려 줍니다.</p>
<p><span class="no">6.</span> 동의와 철회의 기록(안내 문구의 판, 시각, 그래픽카드 모델, 앱 버전)은 사용자의 PC에 남습니다. 회원으로 로그인한 앱에서 동의하거나 철회하면 같은 기록을 회원 계정에도 보관합니다(제8조 제5항).</p>
<h2 id="a7">제7조 (성능 안내)</h2>
<p><span class="no">1.</span> 프레임 생성은 게임이 실제로 그리는 프레임을 늘리지 않습니다. 프레임 사이의 화면을 만들어 넣습니다.</p>
<p class="imp"><span class="no">2.</span> 프레임 생성을 켜면 입력 지연이 늘어납니다. 경쟁 게임에는 권장하지 않습니다.</p>
<p><span class="no">3.</span> 출력 FPS는 사용자가 출력 프레임을 정하지 않으면 모니터 주사율을 따릅니다. 정한 값은 주사율을 넘을 수 있지만, 모니터는 자기 주사율까지만 표시합니다.</p>
<p><span class="no">4.</span> 판매 페이지의 측정값은 표시된 환경의 결과입니다. 실제 결과는 PC, 게임, 설정에 따라 다릅니다.</p>
<h2 id="a8">제8조 (네트워크 사용과 개인정보) <span class="rev">2027년 1월 1일 개정</span></h2>
<p><span class="no">1.</span> 프로그램은 키 확인을 위해 판매자의 라이선스 서버에 키의 식별 번호를 보냅니다. 구독 키를 갱신할 때는 구독 번호와 지금 쓰는 키를, 직접 결제를 할 때는 주문 코드와 사용자가 적은 입금자명과 결제 메모를 보냅니다. 업데이트 확인을 위해 GitHub에 연결합니다.</p>
<p class="cont">판매자의 서버는 발급한 키의 전체 내용과 키 기록(플랜, 발급일과 만료일, 메일 주소, 구독 번호, 메모)을 보관합니다. 메일 주소는 카드 결제의 결제 메일이나 판매자가 적은 메일이며, 키 안에도 들어 있습니다. 판매자가 메모를 비우고 직접 결제를 승인하면 입금자명과 결제 메모가 키 기록의 메모에 들어갑니다. 키 기록과 메일 주소로 키를 찾는 색인은 보관 기간을 정하지 않았고, 판매자가 지울 때까지 보관합니다.</p>
<p class="cont">주문에는 주문 코드, 플랜, 결제 방식, 직접 결제의 입금자명과 결제 메모, 메일 주소를 보관하고, 주문이 마지막으로 바뀐 날부터 90일 뒤 지웁니다. 판매자 작업 기록에도 메일 주소와 메모가 180일 동안 남습니다.</p>
<p class="cont">카드 구독의 가격 변경 안내에 답하면 판매자는 구독 번호, 키의 식별 번호, 고른 답(동의 또는 해지), 답한 시각과 처리 결과를 답한 날부터 3년 동안 보관합니다. 판매자가 켠 경우, 계좌이체 주문에 입금 알림이 오면 판매자만 보는 Discord(Discord Inc., 미국 회사) 채널로 주문 코드, 플랜, 키를 보낼 기한을 알립니다. 메일 주소, 이름, 입금자명, 결제 메모는 보내지 않습니다.</p>
<p class="cont">판매자의 서버와 그 데이터는 Cloudflare, Inc.(미국 회사)가 전 세계에 둔 데이터센터에서 처리하고 보관하므로, 개인정보가 국외로 이전됩니다. 회원 정보는 Supabase의 데이터베이스 서비스에 보관하며, 그 위치는 개인정보 처리방침에 표시합니다.</p>
<p><span class="no">2.</span> 프로그램은 사용 통계를 위해 켜져 있는 동안 판매자의 서버에 무작위로 만든 설치 번호, 앱 버전, 운영체제, 플랜, 프레임 생성 배수, 원클릭 게임 부스트 사용 여부를 보냅니다. 서버는 접속한 국가와 처음과 마지막 연결 시각을 함께 기록합니다. 키, 메일, 게임 이름, 하드웨어 정보는 보내지 않고, 사용 통계에는 IP 주소를 저장하지 않습니다. 설치 번호는 마지막 연결 뒤 90일이 지나면 지웁니다.</p>
<p><span class="no">3.</span> 사용 통계는 선택이며 처음에는 꺼져 있습니다. 사용자는 이 계약에 동의하는 화면에서 사용 통계를 보낼지 고르고, 나중에 앱의 설정에서 바꿀 수 있습니다. 끄면 프로그램은 사용 통계를 보내지 않습니다.</p>
<p><span class="no">4.</span> 사용자가 추천 코드를 입력하면 프로그램은 코드와 무작위로 만든 기기 번호를 판매자의 서버로 보냅니다. 회원 가입 때에도 기기 번호를 보내지만, 서버는 초대 코드를 쓴 경우에만 저장합니다. 기기 번호는 같은 기기가 코드를 다시 쓰지 못하게 막는 데에만 쓰고 90일 뒤 지웁니다.</p>
<p><span class="no">5.</span> 회원 가입은 선택이며 만 14세 이상만 할 수 있습니다. 회원은 아이디나 메일 주소로 가입합니다. 회원이 되면 판매자는 아이디(메일로 가입하면 서버가 만든 회원 번호), 메일 주소(메일로 가입하거나 계정에 더한 경우)와 확인한 시각, 해시값으로 바꾼 비밀번호와 복구 코드, 가입과 마지막 로그인 시각, 동의한 안내문의 판과 시각, 초대 코드, 초대한 회원, 초대 수와 보상 일수, 할인 티켓(티켓을 쓴 주문 코드 포함), 로그인 실패 횟수와 잠금, 차단 여부, 로그인 세션과 로그인한 기기(기기 이름, 앱이 만든 기기 번호의 해시값, 접속한 국가, 처음과 마지막 접속 시각), 계정에 연결한 키, 오버클럭 안내의 동의와 철회 기록을 Supabase의 데이터베이스 서비스에 보관합니다. 2단계 인증을 켜면 인증 앱의 비밀 값(암호화해서)과 백업 코드(해시값으로)도 보관합니다. 이 정보는 회원 관리, 로그인과 계정 보호, 새 기기 로그인 알림, 초대 보상, 할인 티켓, 회원의 키 보여 주기에 씁니다. 회원이 앱에서 로그인한 채로 고객센터에 문의하면 문의에 아이디가 붙습니다.</p>
<p class="cont">판매자는 계정 도용을 확인하려고 로그인, 비밀번호 변경과 재설정, 2단계 인증 변경, 메일 주소 추가, 키 연결, 계정 복구 요청 같은 일이 일어난 시각과 종류, 그때의 IP 주소, 접속한 국가, 기기 이름을 보안 기록으로 30일 동안 보관합니다. 비밀번호와 복구 코드를 모두 잃은 회원이 계정 복구를 요청하면, 요청과 회원이 적은 확인 정보(연락처, 주문 코드, 결제한 날, 금액, 카드 번호 끝 4자리, 입금자명 등)를 요청한 날부터 90일 동안 보관하고 본인 확인에만 씁니다.</p>
<p class="cont">판매자는 회원 메일(가입 확인, 비밀번호 재설정, 새 기기 로그인과 비밀번호 변경 알림, 키 연결 확인, 계정 복구 요청 알림)과, 회원이 아니어도 요청할 수 있는 키 다시 보내기 메일을 Resend, Inc.(미국 회사)를 거쳐 보냅니다. 이때 받는 메일 주소와 메일 내용(키 다시 보내기는 키 전체 포함)이 국외로 이전됩니다. 키 다시 보내기에 적은 메일 주소는 그 주소로 산 키를 찾아 그 주소로 보내는 데만 쓰고 저장하지 않습니다. 광고 메일은 보내지 않습니다.</p>
<p class="cont">탈퇴하면 운영 중인 데이터베이스의 회원 정보를 바로 지우고, 그 사본은 제9항의 백업에만 남습니다. 다만 아이디는 초대 보상 키의 기록(판매자가 지울 때까지), 판매자 작업 기록(180일), 고객센터 문의(그 문의의 보관 기간)에 남습니다. 키와 결제 기록은 탈퇴해도 지우지 않으며, 키는 회원이 아니어도 그대로 쓸 수 있습니다.</p>
<p><span class="no">6.</span> 가입, 로그인, 메일 요청(비밀번호 재설정, 키 다시 보내기, 계정 복구 요청), 고객센터의 남용을 막으려고 판매자는 접속 IP 주소로 만든 해시값을 잠시 보관합니다. 해시값은 서버만 아는 값을 섞어 만듭니다. 회원 가입, 로그인, 메일 요청의 해시값은 정시부터 센 그 1시간이 끝난 뒤 매시간 하는 정리에서 지우고, 고객센터의 해시값은 마지막 요청 뒤 1시간까지 판매자 서버에 둡니다. 판매자 화면에서 비밀번호를 틀린 접속도 IP 주소 대신 해시값으로 세고, 마지막으로 틀린 뒤 15분 동안 보관합니다. 없는 아이디나 메일 주소로 로그인을 틀린 기록은 해시값으로 마지막으로 틀린 뒤 1일(잠겨 있으면 잠금이 끝날 때까지) 보관합니다. 한 메일 주소로 메일을 너무 많이 보내지 않으려고 메일 주소의 해시값별로 보낸 수를 1시간 동안 셉니다.</p>
<p><span class="no">7.</span> 고객센터에 문의하면 판매자는 문의 종류, 제목, 내용, 판매자의 답, 각 글의 시각, 문의 상태, 동의한 시각, 언어, 확인 코드의 해시값을 보관합니다. 사용자가 적거나 고른 경우에는 연락처, 주문 코드, 키의 식별 번호, 앱 정보(앱 버전, 운영체제, GPU 이름)도 보관합니다. 환불 요청에는 환불 사유와, 서버가 가진 주문과 키 정보(플랜, 키를 받은 날과 만료일, 받은 경로, 구독 번호, 주문 코드, 입금자명, 주문 상태, 결제 방식)를 붙입니다. 환불 요청이나 구독 관리를 위해 보낸 키 전체는 확인에만 쓰고 저장하지 않습니다. 결제와 환불 문의는 3년, 그 밖의 문의는 1년 동안 보관하며, 문의가 마지막으로 바뀐 날부터 셉니다.</p>
<p><span class="no">8.</span> 개인정보 처리방침은 앱의 설정 화면과 고객센터, 판매자 서버의 /privacy 페이지에서 볼 수 있습니다.</p>
<p><span class="no">9.</span> 지운 기록도 서비스 회사의 백업과 복구 기능에 잠시 남습니다. 사용 통계처럼 Cloudflare의 데이터베이스(Durable Object)에 두는 기록은 지운 뒤 최대 30일, Supabase에 두는 회원 정보는 지운 뒤 최대 7일 동안 남았다가 지워집니다. 판매자는 이 사본을 장애 복구에만 쓰고, 복구하면 그 전에 지운 기록을 다시 지웁니다.</p>
<h2 id="a9">제9조 (구매와 청약철회)</h2>
<p><span class="no">1.</span> 사용자는 키를 받은 날부터 7일 이내에 청약을 철회할 수 있습니다.</p>
<p class="chg"><span class="no">2.</span> 키를 등록해 유료 기능을 쓰기 시작하면 디지털콘텐츠의 제공이 시작된 것으로 보아 청약철회가 제한될 수 있습니다. <span class="rev">2027년 1월 1일 개정</span></p>
<p class="cont">판매자는 구매 전에 쓸 수 있는 무료 플랜을 제공합니다. 유료 플랜에만 있는 기능은 구매 전에 써 볼 수 없습니다.</p>
<p><span class="no">3.</span> 프로그램이 표시나 광고의 내용과 다르거나 계약과 다르게 제공된 경우, 사용자는 받은 날부터 3개월 이내, 그 사실을 안 날 또는 알 수 있었던 날부터 30일 이내에 청약을 철회할 수 있습니다.</p>
<p><span class="no">4.</span> 환불이 끝나면 판매자는 해당 키를 막습니다.</p>
<p class="chg"><span class="no">5.</span> 청약철회와 환불 문의는 앱이나 도움말 페이지의 고객센터, 또는 판매 페이지에 표시한 연락처로 보냅니다. <span class="rev">2027년 1월 1일 개정</span></p>
<h2 id="a10">제10조 (보증과 책임)</h2>
<p><span class="no">1.</span> 판매자는 프로그램이 모든 PC와 게임에서 오류 없이 동작한다고 보증하지 않습니다.</p>
<p><span class="no">2.</span> 판매자는 자신의 고의 또는 중대한 과실로 생긴 손해를 배상합니다.</p>
<p class="chg"><span class="no">3.</span> 판매자의 경과실로 생긴 손해의 배상 범위는 통상의 손해로 하며, 사용자가 프로그램에 지급한 금액과 10만 원 가운데 큰 금액을 한도로 합니다. 무료 플랜만 쓰는 사용자에게는 10만 원이 한도입니다. <span class="rev">2027년 1월 1일 개정</span></p>
<p><span class="no">4.</span> 판매자는 운영체제, 드라이버, 게임 업데이트처럼 판매자가 통제할 수 없는 변경으로 생긴 호환 문제에 대해서는 책임지지 않습니다. 판매자에게 고의 또는 중대한 과실이 있는 경우는 제외합니다.</p>
<h2 id="a11">제11조 (계약의 종료)</h2>
<p><span class="no">1.</span> 사용자는 언제든 프로그램을 지워 이 계약을 끝낼 수 있습니다. 게임 부스트를 썼다면 지우기 전에 앱의 전체 되돌리기를 실행하세요.</p>
<p class="chg"><span class="no">2.</span> 사용자가 제3조 제5항이나 제9항, 또는 제4조를 어기면 판매자는 해당 키를 막고 사용권을 끝낼 수 있습니다. <span class="rev">2026년 12월 9일 개정</span></p>
<h2 id="a12">제12조 (외부 구성 요소)</h2>
<p>프로그램에는 외부 구성 요소가 들어 있습니다. 이 구성 요소는 각자의 라이선스를 따릅니다. 이 계약은 그 라이선스가 사용자에게 주는 권리를 제한하지 않습니다.</p>
<h2 id="a12-2">제12조의2 (AMD 구성 요소) <span class="rev">2027년 1월 1일 개정</span></h2>
<p><span class="no">1.</span> 라데온 드라이버 기능(관리자 도우미 sb_helper.exe의 AMD 기능)이 들어 있는 판의 프로그램은 Advanced Micro Devices, Inc.(이하 “AMD”)의 ADLX SDK로 만든 부분(이하 “AMD 구성 요소”)을 씁니다. 이 조는 처음 배포된 프로그램과 그 뒤에 사용자가 설치하거나 쓰는 모든 업데이트의 AMD 구성 요소에 적용됩니다.</p>
<p class="imp"><span class="no">2.</span> AMD 구성 요소는 제한된 라이선스에 따라 제공되며, AMD 하드웨어 제품(라데온 그래픽카드 등)과 함께 쓰는 목적으로만 쓸 수 있습니다.</p>
<p><span class="no">3.</span> 사용자는 AMD 구성 요소를 다른 사람에게 넘기거나 복제할 수 없습니다. 합리적인 백업 사본은 만들 수 있습니다. 또한 AMD 구성 요소를 수정하거나 2차적 저작물을 만드는 행위, 배포·공개·게시·재허락·양도하는 행위, 디컴파일·역분석·디스어셈블하거나 사람이 읽을 수 있는 형태로 바꾸는 행위(법이 명시적으로 허용하는 범위는 제외합니다), 저작권·상표·특허 표시를 바꾸거나 지우는 행위, AMD 구성 요소의 비밀 정보에서 바로 나온 발명으로 특허를 받으려 하거나 자신의 특허나 특허출원을 분석하거나 고치는 데 쓰는 행위를 할 수 없습니다. 이 항을 어기면 AMD 구성 요소를 쓸 권리는 끝납니다.</p>
<p><span class="no">4.</span> AMD 구성 요소와 그에 관한 모든 지식재산권은 AMD 또는 그 라이선스 제공자의 것입니다.</p>
<p class="imp"><span class="no">5.</span> AMD 구성 요소는 “있는 그대로” 제공됩니다. AMD는 명시적·묵시적·법정 보증(상품성, 특정 목적 적합성, 권원, 권리 비침해, 중단이나 오류 없는 동작, 거래 관행에서 생기는 보증을 포함합니다)을 하지 않습니다. 일부 나라의 법은 묵시적 보증의 배제를 허용하지 않으므로, 그 범위에서는 이 배제가 적용되지 않을 수 있습니다.</p>
<p class="imp"><span class="no">6.</span> AMD와 그 라이선스 제공자는 어떤 경우에도 AMD 구성 요소의 사용이나 이 계약으로 생긴 징벌적·직접·부수적·간접·특별·결과적 손해를 사용자에게 배상하지 않으며, 그런 손해가 생길 수 있음을 알았더라도 같습니다. 모든 손해와 청구에 대해 AMD가 사용자에게 지는 책임의 총액은 계약, 불법행위(과실 포함), 그 밖의 어떤 근거로도 미화 100달러를 넘지 않습니다.</p>
<p><span class="no">7.</span> 사용자는 대한민국과 미국, 그 밖에 적용되는 나라의 수출입 법령을 모두 지켜야 합니다. 필요한 허가나 승인 없이 AMD 구성 요소를 그런 허가나 승인이 필요한 나라, 사람, 용도로 수출하거나 재수출하거나 이전할 수 없습니다.</p>
<p><span class="no">8.</span> AMD는 이 계약의 제3자 수익자이며, 이 조를 사용자에게 직접 주장할 수 있습니다.</p>
<p class="imp"><span class="no">9.</span> 제5항과 제6항은 AMD의 보증과 책임에 관한 것입니다. 판매자의 보증과 책임은 제10조를 따르며, 이 조로 줄어들지 않습니다.</p>
<h2 id="a13">제13조 (계약의 변경)</h2>
<p>판매자는 계약을 바꾸려면 시행일 30일 전에 판매 페이지와 앱에 알리고, 바뀐 계약은 앱에서 다시 동의를 받습니다.</p>
<h2 id="a14">제14조 (준거법과 분쟁)</h2>
<p>이 계약에는 대한민국 법을 적용합니다. 분쟁의 관할 법원은 민사소송법에 따릅니다.</p>

<h2 id="a1">Article 1 (Subject of this agreement) <span class="rev">Revised Jan 1, 2027</span></h2>
<p>This agreement applies between the Seller and the person who installs or uses SystemBoost (a program for Windows, including the app, engine, updates and documents, the &quot;Program&quot;; that person, the &quot;User&quot;). The User agrees to this agreement on the app&#x27;s consent screen before using the Program.</p>
<p class="cont">In this agreement, the &quot;sales page&quot; means the app&#x27;s ★ Plans screen, the app&#x27;s Support, and the help page (/help) of the Seller&#x27;s server.</p>
<h2 id="a2">Article 2 (License)</h2>
<p class="chg"><span class="no">1.</span> The Seller gives the User a non-exclusive license to use the Program on the User&#x27;s own computer. A User who bought bundle keys may also use it on computers that User manages (such as a company&#x27;s work computers or family computers). <span class="rev">Revised Dec 9, 2026</span></p>
<p><span class="no">2.</span> The Program is licensed, not sold. This agreement transfers no rights in the Program or its components to the User.</p>
<p><span class="no">3.</span> The User may not transfer the license to anyone else.</p>
<h2 id="a3">Article 3 (Plans and license keys)</h2>
<p><span class="no">1.</span> The Free plan can be used without a key.</p>
<p class="chg"><span class="no">2.</span> The Pro, Ultra and Business plans are opened with a license key issued by the Seller. The features of each plan, and what each feature needs to work, are as shown on the app&#x27;s ★ Plans screen at the time of purchase. <span class="rev">Revised Dec 9, 2026</span> <span class="rev">Revised Jan 1, 2027</span></p>
<p class="chg"><span class="no">3.</span> With a monthly or yearly key, paid features lock when the stated period ends and the app returns to the Free plan. A key bought by direct payment, such as a bank transfer, is not charged automatically, so there is nothing to cancel. A key bought as a card subscription is charged the amount shown at purchase automatically every period (monthly or yearly) until the User cancels, and is extended by one period with each payment. The User can cancel at any time through the subscription management link in the payment email (the app&#x27;s Support also shows the way). Cancelling stops the next automatic payment; the period already paid can be used until it ends, and then the app returns to the Free plan. This is the same when a yearly subscription is cancelled during its period. Money for a period already paid is refunded on withdrawal under Article 9, in the case of Paragraph 10 of this Article, and wherever else the law provides for a refund. If a payment does not go through, the key is not extended. <span class="rev">Revised Dec 8, 2026</span> <span class="rev">Revised Jan 1, 2027</span></p>
<p><span class="no">4.</span> A lifetime key has no limit on its period of use. This does not mean it will work on every future operating system and game.</p>
<p class="chg"><span class="no">5.</span> A key is for the buyer&#x27;s own use only. It may not be given to others or made public. Bundle keys follow Paragraph 9. <span class="rev">Revised Dec 9, 2026</span></p>
<p><span class="no">6.</span> If a key is made public or misused, the Seller may block it. A blocked key returns to the Free plan when the app starts online.</p>
<p><span class="no">7.</span> A key received with a referral code or an invite code can be used only for the period shown. The Seller may end a referral code at any time. A key already received stays usable for its period.</p>
<p class="chg"><span class="no">8.</span> Members can create invite codes. Invite rewards are received as Pro keys for the period shown in the app. A member who uses an invite code at sign-up receives the discount ticket shown in the app. A ticket can be used once on a direct payment within the period shown, and cannot be exchanged for cash or given to anyone else. The Seller may cancel rewards obtained by improper means, such as false accounts, and block those accounts. <span class="rev">Revised Dec 9, 2026</span></p>
<p class="chg"><span class="no">9.</span> Bundle keys are several yearly keys of the same plan bought at once. One key is used on one computer. The buyer may give the people who use the computers the buyer manages (such as employees or family) the key for that computer, and may not sell, give or make keys public to anyone else. The Seller blocks only a key that was made public or misused; the other keys of the same bundle stay usable. Bundle keys are not charged automatically and cannot take a discount ticket. <span class="rev">Revised Dec 9, 2026</span></p>
<p class="chg"><span class="no">10.</span> If the Seller rejects a direct-payment order, such as a bank transfer, instead of approving it, no key is issued. Any money already received for that order is returned by the Seller without delay, at the latest within 3 business days of receiving it, or the Seller takes the steps needed to return it within that time. <span class="rev">Revised Jan 1, 2027</span></p>
<p class="chg"><span class="no">11.</span> If a minor buys a paid plan without the consent of a legal representative, the minor or the legal representative may cancel that purchase. This does not apply where the Civil Act does not allow cancellation, for example when the purchase was made with property the legal representative allowed the minor to use. <span class="rev">Revised Jan 1, 2027</span></p>
<h2 id="a4">Article 4 (Prohibited acts)</h2>
<p>The User may not:</p>
<p class="imp"><span class="no">1.</span> Bypass or remove the license check or plan locks, or distribute a means of doing so</p>
<p class="imp"><span class="no">2.</span> Copy, sell, rent or redistribute the Program or keys</p>
<p><span class="no">3.</span> Modify or reverse engineer the Program, except where the law or the license of an open source component allows it</p>
<p><span class="no">4.</span> Use the published code without permission</p>
<p><span class="no">5.</span> Remove copyright notices from the Program</p>
<h2 id="a5">Article 5 (Games and anti-cheat)</h2>
<p><span class="no">1.</span> The Program captures the game&#x27;s picture and shows it in a separate overlay. It does not inject code into game processes and does not change game memory or game files.</p>
<p class="imp"><span class="no">2.</span> The Seller has not tested the Program in games that use anti-cheat. The Seller does not guarantee that the Program complies with the terms of use or anti-cheat policy of every game.</p>
<p class="imp"><span class="no">3.</span> The User must check a game&#x27;s policy before using the Program with it.</p>
<h2 id="a6">Article 6 (Features that change system settings)</h2>
<p class="chg"><span class="no">1.</span> Game boost, the work and streaming features (stream mode, work mode, startup programs), overclocking and power limits run only when the User turns them on. The Program backs up the previous values and provides a way to restore them. <span class="rev">Revised Dec 9, 2026</span></p>
<p class="imp"><span class="no">2.</span> Overclocking can cause game crashes, system freezes and driver errors. It may also affect the graphics card manufacturer&#x27;s warranty.</p>
<p class="cont">Use small values first, after understanding the risks.</p>
<p class="imp"><span class="no">3.</span> The Seller does not guarantee that automatic recovery always works when a driver or hardware error has occurred.</p>
<h2 id="oc">Article 6-2 (Overclocking and hardware tuning) <span class="rev">Revised Jan 1, 2027</span></h2>
<p class="imp"><span class="no">1.</span> Overclocking and changing the power limit run your graphics card beyond the manufacturer&#x27;s default settings. This may cause system instability, game crashes, higher temperatures, shorter component lifespan, or hardware damage, and may void your GPU or PC manufacturer&#x27;s warranty.</p>
<p><span class="no">2.</span> SystemBoost provides temperature monitoring and automatic recovery, but cannot prevent every problem.</p>
<p class="imp"><span class="no">3.</span> You are solely responsible for choosing to enable these features and for any results of using them. This does not apply to damage caused by SystemBoost&#x27;s intentional misconduct or gross negligence.</p>
<p><span class="no">4.</span> Paragraphs 1 to 3 are the wording of the app&#x27;s &quot;Overclocking &amp; Power Limit Notice&quot;. The notice and the consent also cover automatic tuning (automatic undervolting and overclocking) and changes that lower values. The Program shows the notice the first time overclocking or the power limit is turned on, and turns them on only after the User agrees. The User is asked again when the graphics card changes, when the notice&#x27;s wording changes, and when a preset containing overclocking values is imported.</p>
<p><span class="no">5.</span> The User can withdraw consent in the app at any time. The Program then turns overclocking and the power limit off, puts back the values it changed and returns the graphics card&#x27;s power limit and clocks to factory values. Settings changed by other programs (such as voltage or fans) may remain, and the app says so if it cannot put the values back.</p>
<p><span class="no">6.</span> A record of each consent and withdrawal (the notice&#x27;s version, time, graphics card model and app version) stays on the User&#x27;s PC. When the User agrees or withdraws in an app signed in as a member, the same record is also kept with the member account (Article 8, Paragraph 5).</p>
<h2 id="a7">Article 7 (Performance)</h2>
<p><span class="no">1.</span> Frame generation does not increase the frames the game actually draws. It inserts images between frames.</p>
<p class="imp"><span class="no">2.</span> Turning on frame generation increases input delay. It is not recommended for competitive games.</p>
<p><span class="no">3.</span> Output FPS follows the monitor&#x27;s refresh rate unless the User chooses an output rate. A chosen rate can exceed the refresh rate, but a monitor displays only up to its own refresh rate.</p>
<p><span class="no">4.</span> Measurements on the sales page are results in the stated environment. Actual results differ by PC, game and settings.</p>
<h2 id="a8">Article 8 (Network use and personal information) <span class="rev">Revised Jan 1, 2027</span></h2>
<p><span class="no">1.</span> The Program sends the key&#x27;s identifying number to the Seller&#x27;s license server to check the key. It sends the subscription number and the key in use when renewing a subscription key, and the order code and the payer name and payment memo the User entered when paying directly. It connects to GitHub to check for updates.</p>
<p class="cont">The Seller&#x27;s server keeps the full text of each key it issues and the key&#x27;s record (plan, issue and expiry dates, email address, subscription number, note). The email address is the payment email of a card payment or an email the Seller entered, and it is also inside the key. If the Seller approves a direct payment with the note left empty, the payer name and payment memo go into the key record&#x27;s note. No retention period is set for key records or for the index that finds keys by email address; they are kept until the Seller deletes them.</p>
<p class="cont">Orders keep the order code, plan, payment method, the payer name and payment memo of a direct payment, and the email address, and are deleted 90 days after the order last changed. The Seller&#x27;s activity log also keeps email addresses and notes for 180 days.</p>
<p class="cont">When the User answers a price change notice for a card subscription, the Seller keeps the subscription number, the key&#x27;s identifying number, the answer chosen (agree or cancel), the time of the answer and how it was handled for 3 years from the day of the answer. If the Seller has turned it on, when a deposit is reported for a bank transfer order, the Seller is notified in a Discord channel only the Seller sees (Discord Inc., a US company) of the order code, the plan and the deadline for sending the key. Email addresses, names, payer names and payment memos are not sent.</p>
<p class="cont">The Seller&#x27;s server and its data are processed and stored in data centers that Cloudflare, Inc. (a US company) runs around the world, so personal information is transferred abroad. Member information is stored in Supabase&#x27;s database service; its location is shown in the privacy policy.</p>
<p><span class="no">2.</span> While it is on, the Program sends the Seller&#x27;s server a randomly created install number, the app version, operating system, plan, frame generation multiplier, and whether one-click game boost is in use, for usage statistics. The server also records the country of the connection and the times of the first and last connection. Keys, email addresses, game names and hardware information are not sent, and usage statistics store no IP address. The install number is deleted 90 days after the last connection.</p>
<p><span class="no">3.</span> Usage statistics are optional and start off. The User chooses whether to send them on the screen where the User agrees to this agreement, and can change this later in the app&#x27;s settings. When they are off, the Program sends no usage statistics.</p>
<p><span class="no">4.</span> When the User enters a referral code, the Program sends the code and a randomly created device number to the Seller&#x27;s server. Signing up as a member also sends the device number, but the server keeps it only when an invite code is used. The device number is used only to stop the same device from using a code again, and is deleted after 90 days.</p>
<p><span class="no">5.</span> Signing up as a member is optional and open only to people aged 14 or over. Members sign up with an ID or an email address. For members, the Seller keeps the ID (for an email sign-up, a member number the server creates), the email address (when signing up by email or adding one to the account) and the time it was confirmed, the password and recovery code as hash values, the times of sign-up and last login, the version and time of the notice agreed to, the invite code, the inviting member, the number of invitations and reward days, discount tickets (including the order code a ticket was used on), failed logins and lockouts, whether the member is blocked, login sessions and signed-in devices (device name, a hash value of the device number the app creates, the country of the connection, the times of the first and last connection), the keys linked to the account, and the records of consent to and withdrawal from the overclocking notice in Supabase&#x27;s database service. When 2-step login is turned on, the Seller also keeps the authenticator app&#x27;s secret (encrypted) and the backup codes (as hash values). This information is used to manage members, for login and account protection, for alerts of a login on a new device, for invite rewards and discount tickets, and to show a member&#x27;s keys. If a member sends a request to the support center while signed in to the app, the member&#x27;s ID is attached to it.</p>
<p class="cont">To check for account takeover, the Seller keeps a security log for 30 days: the time and kind of events such as logins, password changes and resets, changes to 2-step login, added email addresses, linked keys and account recovery requests, with the IP address, the country of the connection and the device name at that time. When a member who has lost both the password and the recovery code asks for account recovery, the Seller keeps the request and the details the member entered to confirm it (contact, order code, payment date, amount, last 4 digits of the card number, payer name and the like) for 90 days from the request and uses them only to confirm the member&#x27;s identity.</p>
<p class="cont">The Seller sends member emails (sign-up confirmation, password reset, alerts of a login on a new device and of a password change, key link confirmation, notice of an account recovery request), and the key resend emails that anyone can ask for without being a member, through Resend, Inc. (a US company). The recipient&#x27;s email address and the content of the email (for a key resend, the full key) are then transferred abroad. An email address entered to have keys sent again is used only to find the keys bought with it and send them to it, and is not stored. The Seller sends no advertising email.</p>
<p class="cont">When a member leaves, the member information in the live database is deleted at once, and a copy stays only in the backups described in Paragraph 9. The ID remains, however, in the record of an invite reward key (until the Seller deletes it), the Seller&#x27;s activity log (180 days) and support requests (for their retention period). Keys and payment records are not deleted when a member leaves, and keys keep working without membership.</p>
<p><span class="no">6.</span> To prevent abuse of sign-up, login, email requests (password reset, key resend, account recovery requests) and the support center, the Seller keeps hash values made from the connecting IP address for a short time. The hash values are made with a value only the server knows. Those for sign-up, login and email requests are deleted at the hourly cleanup after the clock hour they were counted in ends; those for the support center stay on the Seller&#x27;s server for up to 1 hour after the last request. A connection that enters a wrong password on the Seller&#x27;s dashboard is also counted by a hash value instead of the IP address, kept for 15 minutes after the last wrong attempt. Failed logins with an ID or email address that does not exist are kept as hash values for 1 day after the last failure (until the lockout ends, if locked). To avoid sending too many emails to one address, the emails sent are counted per hash value of the email address for 1 hour.</p>
<p><span class="no">7.</span> When the User sends a request to the support center, the Seller keeps its category, title, text, the Seller&#x27;s replies, the time of each message, its status, the time of consent, the language and a hash value of the access code. If the User enters or chooses them, the Seller also keeps the contact, order code, the key&#x27;s identifying number and app information (app version, operating system, GPU name). A refund request also carries its reason and the order and key information the server has (plan, the dates the key was received and expires, how it was received, subscription number, order code, payer name, order status, payment method). A full key sent for a refund request or subscription management is used only for checking and is not stored. Requests about payments and refunds are kept for 3 years and other requests for 1 year, counted from the day the request last changed.</p>
<p><span class="no">8.</span> The privacy policy can be seen in the app&#x27;s settings screen, in the support center, and on the /privacy page of the Seller&#x27;s server.</p>
<p><span class="no">9.</span> Deleted records stay for a short time in the backup and recovery features of the service companies. Records kept in Cloudflare&#x27;s database (Durable Objects), such as usage statistics, stay for up to 30 days after deletion, and member information kept in Supabase for up to 7 days after deletion, and are then gone. The Seller uses these copies only to recover from a failure, and after a recovery deletes again the records that had been deleted before.</p>

<p class="chg"><span class="no">2.</span> Once the User registers a key and starts using paid features, the digital content is treated as provided and withdrawal may be limited. <span class="rev">Revised Jan 1, 2027</span></p>
<p class="cont">The Seller offers a free plan that can be used before purchase. Features found only in paid plans cannot be tried before purchase.</p>
<p><span class="no">3.</span> If the Program differs from what was displayed or advertised, or is provided differently from the contract, the User may withdraw within 3 months of receiving it, or within 30 days of the day the User learned or could have learned of this.</p>
<p><span class="no">4.</span> When a refund is complete, the Seller blocks the key.</p>
<p class="chg"><span class="no">5.</span> Questions about withdrawal and refunds go to the support center in the app or on the help page, or to the contact shown on the sales page. <span class="rev">Revised Jan 1, 2027</span></p>

<p class="chg"><span class="no">3.</span> For damage caused by the Seller&#x27;s minor negligence, compensation covers ordinary damage, up to the amount the User paid for the Program or 100,000 won, whichever is greater. For a User who uses only the Free plan, the limit is 100,000 won. <span class="rev">Revised Jan 1, 2027</span></p>
<p><span class="no">4.</span> The Seller is not liable for compatibility problems caused by changes outside the Seller&#x27;s control, such as operating system, driver and game updates, except where the Seller acted with intent or gross negligence.</p>
<h2 id="a11">Article 11 (Ending this agreement)</h2>
<p><span class="no">1.</span> The User may end this agreement at any time by deleting the Program. If game boost was used, run the app&#x27;s full restore before deleting it.</p>
<p class="chg"><span class="no">2.</span> If the User breaches Article 3, Paragraph 5 or 9, or Article 4, the Seller may block the key concerned and end the license. <span class="rev">Revised Dec 9, 2026</span></p>

<p><span class="no">6.</span> A record of each consent and withdrawal (the notice&#x27;s version, time, graphics card model and app version) stays on the User&#x27;s PC. When the User agrees or withdraws in an app signed in as a member, the same record is also kept with the member account (Article 8, Paragraph 5).</p>

<h2 id="a8">Article 8 (Network use and personal information) <span class="rev">Revised Jan 1, 2027</span></h2>
<p><span class="no">1.</span> The Program sends the key&#x27;s identifying number to the Seller&#x27;s license server to check the key. It sends the subscription number and the key in use when renewing a subscription key, and the order code and the payer name and payment memo the User entered when paying directly. It connects to GitHub to check for updates.</p>
<p class="cont">The Seller&#x27;s server keeps the full text of each key it issues and the key&#x27;s record (plan, issue and expiry dates, email address, subscription number, note). The email address is the payment email of a card payment or an email the Seller entered, and it is also inside the key. If the Seller approves a direct payment with the note left empty, the payer name and payment memo go into the key record&#x27;s note. No retention period is set for key records or for the index that finds keys by email address; they are kept until the Seller deletes them.</p>
<p class="cont">Orders keep the order code, plan, payment method, the payer name and payment memo of a direct payment, and the email address, and are deleted 90 days after the order last changed. The Seller&#x27;s activity log also keeps email addresses and notes for 180 days.</p>
<p class="cont">When the User answers a price change notice for a card subscription, the Seller keeps the subscription number, the key&#x27;s identifying number, the answer chosen (agree or cancel), the time of the answer and how it was handled for 3 years from the day of the answer. If the Seller has turned it on, when a deposit is reported for a bank transfer order, the Seller is notified in a Discord channel only the Seller sees (Discord Inc., a US company) of the order code, the plan and the deadline for sending the key. Email addresses, names, payer names and payment memos are not sent.</p>
<p class="cont">The Seller&#x27;s server and its data are processed and stored in data centers that Cloudflare, Inc. (a US company) runs around the world, so personal information is transferred abroad. Member information is stored in Supabase&#x27;s database service; its location is shown in the privacy policy.</p>
<p><span class="no">2.</span> While it is on, the Program sends the Seller&#x27;s server a randomly created install number, the app version, operating system, plan, frame generation multiplier, and whether one-click game boost is in use, for usage statistics. The server also records the country of the connection and the times of the first and last connection. Keys, email addresses, game names and hardware information are not sent, and usage statistics store no IP address. The install number is deleted 90 days after the last connection.</p>
<p><span class="no">3.</span> Usage statistics are optional and start off. The User chooses whether to send them on the screen where the User agrees to this agreement, and can change this later in the app&#x27;s settings. When they are off, the Program sends no usage statistics.</p>
<p><span class="no">4.</span> When the User enters a referral code, the Program sends the code and a randomly created device number to the Seller&#x27;s server. Signing up as a member also sends the device number, but the server keeps it only when an invite code is used. The device number is used only to stop the same device from using a code again, and is deleted after 90 days.</p>
<p><span class="no">5.</span> Signing up as a member is optional and open only to people aged 14 or over. Members sign up with an ID or an email address. For members, the Seller keeps the ID (for an email sign-up, a member number the server creates), the email address (when signing up by email or adding one to the account) and the time it was confirmed, the password and recovery code as hash values, the times of sign-up and last login, the version and time of the notice agreed to, the invite code, the inviting member, the number of invitations and reward days, discount tickets (including the order code a ticket was used on), failed logins and lockouts, whether the member is blocked, login sessions and signed-in devices (device name, a hash value of the device number the app creates, the country of the connection, the times of the first and last connection), the keys linked to the account, and the records of consent to and withdrawal from the overclocking notice in Supabase&#x27;s database service. When 2-step login is turned on, the Seller also keeps the authenticator app&#x27;s secret (encrypted) and the backup codes (as hash values). This information is used to manage members, for login and account protection, for alerts of a login on a new device, for invite rewards and discount tickets, and to show a member&#x27;s keys. If a member sends a request to the support center while signed in to the app, the member&#x27;s ID is attached to it.</p>
<p class="cont">To check for account takeover, the Seller keeps a security log for 30 days: the time and kind of events such as logins, password changes and resets, changes to 2-step login, added email addresses, linked keys and account recovery requests, with the IP address, the country of the connection and the device name at that time. When a member who has lost both the password and the recovery code asks for account recovery, the Seller keeps the request and the details the member entered to confirm it (contact, order code, payment date, amount, last 4 digits of the card number, payer name and the like) for 90 days from the request and uses them only to confirm the member&#x27;s identity.</p>
<p class="cont">The Seller sends member emails (sign-up confirmation, password reset, alerts of a login on a new device and of a password change, key link confirmation, notice of an account recovery request), and the key resend emails that anyone can ask for without being a member, through Resend, Inc. (a US company). The recipient&#x27;s email address and the content of the email (for a key resend, the full key) are then transferred abroad. An email address entered to have keys sent again is used only to find the keys bought with it and send them to it, and is not stored. The Seller sends no advertising email.</p>
<p class="cont">When a member leaves, the member information in the live database is deleted at once, and a copy stays only in the backups described in Paragraph 9. The ID remains, however, in the record of an invite reward key (until the Seller deletes it), the Seller&#x27;s activity log (180 days) and support requests (for their retention period). Keys and payment records are not deleted when a member leaves, and keys keep working without membership.</p>
<p><span class="no">6.</span> To prevent abuse of sign-up, login, email requests (password reset, key resend, account recovery requests) and the support center, the Seller keeps hash values made from the connecting IP address for a short time. The hash values are made with a value only the server knows. Those for sign-up, login and email requests are deleted at the hourly cleanup after the clock hour they were counted in ends; those for the support center stay on the Seller&#x27;s server for up to 1 hour after the last request. A connection that enters a wrong password on the Seller&#x27;s dashboard is also counted by a hash value instead of the IP address, kept for 15 minutes after the last wrong attempt. Failed logins with an ID or email address that does not exist are kept as hash values for 1 day after the last failure (until the lockout ends, if locked). To avoid sending too many emails to one address, the emails sent are counted per hash value of the email address for 1 hour.</p>

<p class="imp"><span class="no">3.</span> You are solely responsible for choosing to enable these features and for any results of using them. This does not apply to damage caused by SystemBoost&#x27;s intentional misconduct or gross negligence.</p>
<p><span class="no">4.</span> Paragraphs 1 to 3 are the wording of the app&#x27;s &quot;Overclocking &amp; Power Limit Notice&quot;. The notice and the consent also cover automatic tuning (automatic undervolting and overclocking) and changes that lower values. The Program shows the notice the first time overclocking or the power limit is turned on, and turns them on only after the User agrees. The User is asked again when the graphics card changes, when the notice&#x27;s wording changes, and when a preset containing overclocking values is imported.</p>
<p><span class="no">5.</span> The User can withdraw consent in the app at any time. The Program then turns overclocking and the power limit off, puts back the values it changed and returns the graphics card&#x27;s power limit and clocks to factory values. Settings changed by other programs (such as voltage or fans) may remain, and the app says so if it cannot put the values back.</p>
<p><span class="no">6.</span> A record of each consent and withdrawal (the notice&#x27;s version, time, graphics card model and app version) stays on the User&#x27;s PC. When the User agrees or withdraws in an app signed in as a member, the same record is also kept with the member account (Article 8, Paragraph 5).</p>
<h2 id="a7">Article 7 (Performance)</h2>
<p><span class="no">1.</span> Frame generation does not increase the frames the game actually draws. It inserts images between frames.</p>
<p class="imp"><span class="no">2.</span> Turning on frame generation increases input delay. It is not recommended for competitive games.</p>
<p><span class="no">3.</span> Output FPS follows the monitor&#x27;s refresh rate unless the User chooses an output rate. A chosen rate can exceed the refresh rate, but a monitor displays only up to its own refresh rate.</p>
<p><span class="no">4.</span> Measurements on the sales page are results in the stated environment. Actual results differ by PC, game and settings.</p>
<h2 id="a8">Article 8 (Network use and personal information) <span class="rev">Revised Jan 1, 2027</span></h2>
<p><span class="no">1.</span> The Program sends the key&#x27;s identifying number to the Seller&#x27;s license server to check the key. It sends the subscription number and the key in use when renewing a subscription key, and the order code and the payer name and payment memo the User entered when paying directly. It connects to GitHub to check for updates.</p>
<p class="cont">The Seller&#x27;s server keeps the full text of each key it issues and the key&#x27;s record (plan, issue and expiry dates, email address, subscription number, note). The email address is the payment email of a card payment or an email the Seller entered, and it is also inside the key. If the Seller approves a direct payment with the note left empty, the payer name and payment memo go into the key record&#x27;s note. No retention period is set for key records or for the index that finds keys by email address; they are kept until the Seller deletes them.</p>
<p class="cont">Orders keep the order code, plan, payment method, the payer name and payment memo of a direct payment, and the email address, and are deleted 90 days after the order last changed. The Seller&#x27;s activity log also keeps email addresses and notes for 180 days.</p>
<p class="cont">When the User answers a price change notice for a card subscription, the Seller keeps the subscription number, the key&#x27;s identifying number, the answer chosen (agree or cancel), the time of the answer and how it was handled for 3 years from the day of the answer. If the Seller has turned it on, when a deposit is reported for a bank transfer order, the Seller is notified in a Discord channel only the Seller sees (Discord Inc., a US company) of the order code, the plan and the deadline for sending the key. Email addresses, names, payer names and payment memos are not sent.</p>
<p class="cont">The Seller&#x27;s server and its data are processed and stored in data centers that Cloudflare, Inc. (a US company) runs around the world, so personal information is transferred abroad. Member information is stored in Supabase&#x27;s database service; its location is shown in the privacy policy.</p>
<p><span class="no">2.</span> While it is on, the Program sends the Seller&#x27;s server a randomly created install number, the app version, operating system, plan, frame generation multiplier, and whether one-click game boost is in use, for usage statistics. The server also records the country of the connection and the times of the first and last connection. Keys, email addresses, game names and hardware information are not sent, and usage statistics store no IP address. The install number is deleted 90 days after the last connection.</p>
<p><span class="no">3.</span> Usage statistics are optional and start off. The User chooses whether to send them on the screen where the User agrees to this agreement, and can change this later in the app&#x27;s settings. When they are off, the Program sends no usage statistics.</p>
<p><span class="no">4.</span> When the User enters a referral code, the Program sends the code and a randomly created device number to the Seller&#x27;s server. Signing up as a member also sends the device number, but the server keeps it only when an invite code is used. The device number is used only to stop the same device from using a code again, and is deleted after 90 days.</p>
<p><span class="no">5.</span> Signing up as a member is optional and open only to people aged 14 or over. Members sign up with an ID or an email address. For members, the Seller keeps the ID (for an email sign-up, a member number the server creates), the email address (when signing up by email or adding one to the account) and the time it was confirmed, the password and recovery code as hash values, the times of sign-up and last login, the version and time of the notice agreed to, the invite code, the inviting member, the number of invitations and reward days, discount tickets (including the order code a ticket was used on), failed logins and lockouts, whether the member is blocked, login sessions and signed-in devices (device name, a hash value of the device number the app creates, the country of the connection, the times of the first and last connection), the keys linked to the account, and the records of consent to and withdrawal from the overclocking notice in Supabase&#x27;s database service. When 2-step login is turned on, the Seller also keeps the authenticator app&#x27;s secret (encrypted) and the backup codes (as hash values). This information is used to manage members, for login and account protection, for alerts of a login on a new device, for invite rewards and discount tickets, and to show a member&#x27;s keys. If a member sends a request to the support center while signed in to the app, the member&#x27;s ID is attached to it.</p>
<p class="cont">To check for account takeover, the Seller keeps a security log for 30 days: the time and kind of events such as logins, password changes and resets, changes to 2-step login, added email addresses, linked keys and account recovery requests, with the IP address, the country of the connection and the device name at that time. When a member who has lost both the password and the recovery code asks for account recovery, the Seller keeps the request and the details the member entered to confirm it (contact, order code, payment date, amount, last 4 digits of the card number, payer name and the like) for 90 days from the request and uses them only to confirm the member&#x27;s identity.</p>
<p class="cont">The Seller sends member emails (sign-up confirmation, password reset, alerts of a login on a new device and of a password change, key link confirmation, notice of an account recovery request), and the key resend emails that anyone can ask for without being a member, through Resend, Inc. (a US company). The recipient&#x27;s email address and the content of the email (for a key resend, the full key) are then transferred abroad. An email address entered to have keys sent again is used only to find the keys bought with it and send them to it, and is not stored. The Seller sends no advertising email.</p>
<p class="cont">When a member leaves, the member information in the live database is deleted at once, and a copy stays only in the backups described in Paragraph 9. The ID remains, however, in the record of an invite reward key (until the Seller deletes it), the Seller&#x27;s activity log (180 days) and support requests (for their retention period). Keys and payment records are not deleted when a member leaves, and keys keep working without membership.</p>
<p><span class="no">6.</span> To prevent abuse of sign-up, login, email requests (password reset, key resend, account recovery requests) and the support center, the Seller keeps hash values made from the connecting IP address for a short time. The hash values are made with a value only the server knows. Those for sign-up, login and email requests are deleted at the hourly cleanup after the clock hour they were counted in ends; those for the support center stay on the Seller&#x27;s server for up to 1 hour after the last request. A connection that enters a wrong password on the Seller&#x27;s dashboard is also counted by a hash value instead of the IP address, kept for 15 minutes after the last wrong attempt. Failed logins with an ID or email address that does not exist are kept as hash values for 1 day after the last failure (until the lockout ends, if locked). To avoid sending too many emails to one address, the emails sent are counted per hash value of the email address for 1 hour.</p>
<p><span class="no">7.</span> When the User sends a request to the support center, the Seller keeps its category, title, text, the Seller&#x27;s replies, the time of each message, its status, the time of consent, the language and a hash value of the access code. If the User enters or chooses them, the Seller also keeps the contact, order code, the key&#x27;s identifying number and app information (app version, operating system, GPU name). A refund request also carries its reason and the order and key information the server has (plan, the dates the key was received and expires, how it was received, subscription number, order code, payer name, order status, payment method). A full key sent for a refund request or subscription management is used only for checking and is not stored. Requests about payments and refunds are kept for 3 years and other requests for 1 year, counted from the day the request last changed.</p>
<p><span class="no">8.</span> The privacy policy can be seen in the app&#x27;s settings screen, in the support center, and on the /privacy page of the Seller&#x27;s server.</p>
<p><span class="no">9.</span> Deleted records stay for a short time in the backup and recovery features of the service companies. Records kept in Cloudflare&#x27;s database (Durable Objects), such as usage statistics, stay for up to 30 days after deletion, and member information kept in Supabase for up to 7 days after deletion, and are then gone. The Seller uses these copies only to recover from a failure, and after a recovery deletes again the records that had been deleted before.</p>

<h2 id="a1">Article 1 (Subject of this agreement) <span class="rev">Revised Jan 1, 2027</span></h2>
<p>This agreement applies between the Seller and the person who installs or uses SystemBoost (a program for Windows, including the app, engine, updates and documents, the &quot;Program&quot;; that person, the &quot;User&quot;). The User agrees to this agreement on the app&#x27;s consent screen before using the Program.</p>
<p class="cont">In this agreement, the &quot;sales page&quot; means the app&#x27;s ★ Plans screen, the app&#x27;s Support, and the help page (/help) of the Seller&#x27;s server.</p>
<h2 id="a2">Article 2 (License)</h2>
<p class="chg"><span class="no">1.</span> The Seller gives the User a non-exclusive license to use the Program on the User&#x27;s own computer. A User who bought bundle keys may also use it on computers that User manages (such as a company&#x27;s work computers or family computers). <span class="rev">Revised Dec 9, 2026</span></p>
<p><span class="no">2.</span> The Program is licensed, not sold. This agreement transfers no rights in the Program or its components to the User.</p>
<p><span class="no">3.</span> The User may not transfer the license to anyone else.</p>
<h2 id="a3">Article 3 (Plans and license keys)</h2>
<p><span class="no">1.</span> The Free plan can be used without a key.</p>
<p class="chg"><span class="no">2.</span> The Pro, Ultra and Business plans are opened with a license key issued by the Seller. The features of each plan, and what each feature needs to work, are as shown on the app&#x27;s ★ Plans screen at the time of purchase. <span class="rev">Revised Dec 9, 2026</span> <span class="rev">Revised Jan 1, 2027</span></p>
<p class="chg"><span class="no">3.</span> With a monthly or yearly key, paid features lock when the stated period ends and the app returns to the Free plan. A key bought by direct payment, such as a bank transfer, is not charged automatically, so there is nothing to cancel. A key bought as a card subscription is charged the amount shown at purchase automatically every period (monthly or yearly) until the User cancels, and is extended by one period with each payment. The User can cancel at any time through the subscription management link in the payment email (the app&#x27;s Support also shows the way). Cancelling stops the next automatic payment; the period already paid can be used until it ends, and then the app returns to the Free plan. This is the same when a yearly subscription is cancelled during its period. Money for a period already paid is refunded on withdrawal under Article 9, in the case of Paragraph 10 of this Article, and wherever else the law provides for a refund. If a payment does not go through, the key is not extended. <span class="rev">Revised Dec 8, 2026</span> <span class="rev">Revised Jan 1, 2027</span></p>
<p><span class="no">4.</span> A lifetime key has no limit on its period of use. This does not mean it will work on every future operating system and game.</p>
<p class="chg"><span class="no">5.</span> A key is for the buyer&#x27;s own use only. It may not be given to others or made public. Bundle keys follow Paragraph 9. <span class="rev">Revised Dec 9, 2026</span></p>
<p><span class="no">6.</span> If a key is made public or misused, the Seller may block it. A blocked key returns to the Free plan when the app starts online.</p>
<p><span class="no">7.</span> A key received with a referral code or an invite code can be used only for the period shown. The Seller may end a referral code at any time. A key already received stays usable for its period.</p>
<p class="chg"><span class="no">8.</span> Members can create invite codes. Invite rewards are received as Pro keys for the period shown in the app. A member who uses an invite code at sign-up receives the discount ticket shown in the app. A ticket can be used once on a direct payment within the period shown, and cannot be exchanged for cash or given to anyone else. The Seller may cancel rewards obtained by improper means, such as false accounts, and block those accounts. <span class="rev">Revised Dec 9, 2026</span></p>
<p class="chg"><span class="no">9.</span> Bundle keys are several yearly keys of the same plan bought at once. One key is used on one computer. The buyer may give the people who use the computers the buyer manages (such as employees or family) the key for that computer, and may not sell, give or make keys public to anyone else. The Seller blocks only a key that was made public or misused; the other keys of the same bundle stay usable. Bundle keys are not charged automatically and cannot take a discount ticket. <span class="rev">Revised Dec 9, 2026</span></p>
<p class="chg"><span class="no">10.</span> If the Seller rejects a direct-payment order, such as a bank transfer, instead of approving it, no key is issued. Any money already received for that order is returned by the Seller without delay, at the latest within 3 business days of receiving it, or the Seller takes the steps needed to return it within that time. <span class="rev">Revised Jan 1, 2027</span></p>
<p class="chg"><span class="no">11.</span> If a minor buys a paid plan without the consent of a legal representative, the minor or the legal representative may cancel that purchase. This does not apply where the Civil Act does not allow cancellation, for example when the purchase was made with property the legal representative allowed the minor to use. <span class="rev">Revised Jan 1, 2027</span></p>
<h2 id="a4">Article 4 (Prohibited acts)</h2>
