<h2 id="a1">Article 1 (Subject of this agreement)</h2>
<p>This agreement applies between the Seller and the person who installs or uses SystemBoost (the app, engine, updates and documents, the &quot;Program&quot;; that person, the &quot;User&quot;). The User agrees to this agreement on the app&#x27;s consent screen before using the Program.</p>
<h2 id="a2">Article 2 (License)</h2>

<p><span class="no">2.</span> The Program is licensed, not sold. This agreement transfers no rights in the Program or its components to the User.</p>

<h2 id="a3">Article 3 (Plans and license keys)</h2>
<p><span class="no">1.</span> The Free plan can be used without a key.</p>
<p class="chg"><span class="no">2.</span> The Pro, Ultra and Business plans are opened with a license key issued by the Seller. The features of each plan are as shown on the sales page. <span class="rev">Revised Dec 9, 2026</span></p>
<p class="chg"><span class="no">3.</span> With a monthly or yearly key, paid features lock when the stated period ends and the app returns to the Free plan. A key bought by direct payment, such as a bank transfer, is not charged automatically. A key bought as a card subscription is charged the amount shown at purchase automatically every period until the User cancels, and is extended by one period with each payment. The User can cancel at any time through the subscription management link in the payment email; after cancelling, the app returns to the Free plan when the period already paid ends. If a payment does not go through, the key is not extended. <span class="rev">Revised Dec 8, 2026</span></p>
<p><span class="no">4.</span> A lifetime key has no limit on its period of use. This does not mean it will work on every future operating system and game.</p>
<p class="chg"><span class="no">5.</span> A key is for the buyer&#x27;s own use only. It may not be given to others or made public. Bundle keys follow Paragraph 9. <span class="rev">Revised Dec 9, 2026</span></p>
<p><span class="no">6.</span> If a key is made public or misused, the Seller may block it. A blocked key returns to the Free plan when the app starts online.</p>
<p><span class="no">7.</span> A key received with a referral code or an invite code can be used only for the period shown. The Seller may end a referral code at any time. A key already received stays usable for its period.</p>
<p class="chg"><span class="no">8.</span> Members can create invite codes. Invite rewards are received as Pro keys for the period shown in the app. A member who uses an invite code at sign-up receives the discount ticket shown in the app. A ticket can be used once on a direct payment within the period shown, and cannot be exchanged for cash or given to anyone else. The Seller may cancel rewards obtained by improper means, such as false accounts, and block those accounts. <span class="rev">Revised Dec 9, 2026</span></p>

<h2 id="a5">Article 5 (Games and anti-cheat)</h2>
<p><span class="no">1.</span> The Program captures the game&#x27;s picture and shows it in a separate overlay. It does not inject code into game processes and does not change game memory or game files.</p>
<p class="imp"><span class="no">2.</span> The Seller has not tested the Program in games that use anti-cheat. The Seller does not guarantee that the Program complies with the terms of use or anti-cheat policy of every game.</p>

<h2 id="a6">Article 6 (Features that change system settings)</h2>
<p class="chg"><span class="no">1.</span> Game boost, the work and streaming features (stream mode, work mode, startup programs), overclocking and power limits run only when the User turns them on. The Program backs up the previous values and provides a way to restore them. <span class="rev">Revised Dec 9, 2026</span></p>
<p class="imp"><span class="no">2.</span> Overclocking can cause game crashes, system freezes and driver errors. It may also affect the graphics card manufacturer&#x27;s warranty.</p>

<p class="imp"><span class="no">3.</span> The Seller does not guarantee that automatic recovery always works when a driver or hardware error has occurred.</p>
<h2 id="a7">Article 7 (Performance)</h2>
<p><span class="no">1.</span> Frame generation does not increase the frames the game actually draws. It inserts images between frames.</p>
<p class="imp"><span class="no">2.</span> Turning on frame generation increases input delay. It is not recommended for competitive games.</p>
<p><span class="no">3.</span> Output FPS follows the monitor&#x27;s refresh rate unless the User chooses an output rate. A chosen rate can exceed the refresh rate, but a monitor displays only up to its own refresh rate.</p>
<p><span class="no">4.</span> Measurements on the sales page are results in the stated environment. Actual results differ by PC, game and settings.</p>
<h2 id="a8">Article 8 (Network use and personal information)</h2>
<p><span class="no">1.</span> The Program sends the key&#x27;s identifying number to the Seller&#x27;s license server to check the key, and connects to GitHub to check for updates. Setting up the Windows game environment on macOS downloads the files it needs.</p>
<p><span class="no">2.</span> While it is on, the Program sends the Seller&#x27;s server a randomly created install number, the app version, operating system, plan, frame generation multiplier, and whether one-click game boost is in use, for usage statistics. The server also records the country of the connection. Keys, email addresses, game names and hardware information are not sent, and the Seller does not store IP addresses. The install number is deleted 90 days after the last connection.</p>
<p><span class="no">3.</span> The User can turn off usage statistics in the app&#x27;s settings.</p>
<p><span class="no">4.</span> When the User enters a referral code, the Program sends the code and a randomly created device number to the Seller&#x27;s server. The device number is used only to stop the same device from using a code again, and is deleted after 90 days.</p>
<p><span class="no">5.</span> Signing up as a member is optional and open only to people aged 14 or over. For members, the Seller keeps the ID, the encrypted password and recovery code, the times of sign-up and last login, the time of consent, and the invite code and invitation records in Supabase&#x27;s database service. This information is used only to manage members and invite benefits, and is deleted at once when a member leaves.</p>
<p><span class="no">6.</span> To prevent abuse of sign-up and login, the Seller&#x27;s server keeps a one-way value made from the connecting IP address for up to 1 hour.</p>
<p><span class="no">7.</span> How personal information is handled is shown on the sales page.</p>

<h2 id="a1">제1조 (계약의 대상)</h2>
<p>이 계약은 판매자와 SystemBoost(앱, 엔진, 업데이트, 문서를 포함하며 이하 “프로그램”)를 설치하거나 쓰는 사람(이하 “사용자”) 사이에 적용됩니다. 사용자는 앱의 동의 화면에서 이 계약에 동의한 뒤 프로그램을 씁니다.</p>
<h2 id="a2">제2조 (사용권)</h2>
<p class="chg"><span class="no">1.</span> 판매자는 사용자에게 프로그램을 본인의 컴퓨터에서 쓸 수 있는 비독점적 사용권을 줍니다. 묶음 키를 산 사용자는 자신이 관리하는 컴퓨터(회사의 업무용 컴퓨터, 가족의 컴퓨터 등)에서도 쓸 수 있습니다. <span class="rev">2026년 12월 9일 개정</span></p>
<p><span class="no">2.</span> 프로그램은 판매되는 것이 아니라 사용이 허락되는 것입니다. 이 계약은 프로그램이나 그 구성 요소에 대한 권리를 사용자에게 넘기지 않습니다.</p>
<p><span class="no">3.</span> 사용자는 사용권을 다른 사람에게 넘길 수 없습니다.</p>
<h2 id="a3">제3조 (플랜과 라이선스 키)</h2>
<p><span class="no">1.</span> 무료 플랜은 키 없이 쓸 수 있습니다.</p>
<p class="chg"><span class="no">2.</span> 프로, 울트라, 산업 플랜은 판매자가 발급한 라이선스 키로 엽니다. 플랜별 기능은 판매 페이지에 표시한 대로입니다. <span class="rev">2026년 12월 9일 개정</span></p>
<p class="chg"><span class="no">3.</span> 월간 키와 연간 키는 표시된 기간이 끝나면 유료 기능이 잠기고 무료 플랜으로 돌아갑니다. 계좌이체 등 직접 결제로 산 키는 자동으로 결제되지 않습니다. 카드 구독으로 산 키는 사용자가 해지할 때까지 같은 기간마다 결제할 때 표시된 금액이 자동으로 결제되고, 결제될 때마다 그 기간만큼 연장됩니다. 해지는 결제 메일의 구독 관리 링크에서 언제든 할 수 있고, 해지하면 이미 결제한 기간이 끝날 때 무료 플랜으로 돌아갑니다. 결제가 되지 않으면 키는 연장되지 않습니다. <span class="rev">2026년 12월 8일 개정</span></p>
<p><span class="no">4.</span> 평생 키는 사용 기간에 제한이 없습니다. 앞으로 나올 모든 운영체제와 게임에서 동작한다는 뜻은 아닙니다.</p>
<p class="chg"><span class="no">5.</span> 키는 구매자 본인만 씁니다. 다른 사람에게 주거나 공개할 수 없습니다. 묶음 키는 제9항을 따릅니다. <span class="rev">2026년 12월 9일 개정</span></p>
<p><span class="no">6.</span> 판매자는 키가 공개되거나 부정하게 쓰이면 그 키를 막을 수 있습니다. 막힌 키는 앱이 온라인으로 시작할 때 무료 플랜으로 돌아갑니다.</p>
<p><span class="no">7.</span> 추천 코드나 초대 코드로 받은 키는 표시된 기간 동안만 쓸 수 있습니다. 판매자는 추천 코드를 언제든 끝낼 수 있고, 이미 받은 키는 그 기간까지 쓸 수 있습니다.</p>
<p class="chg"><span class="no">8.</span> 회원은 초대 코드를 만들 수 있습니다. 초대 보상은 앱에 표시된 기간의 프로 키로 받습니다. 가입할 때 초대 코드를 쓴 회원은 앱에 표시된 할인 티켓을 받습니다. 티켓은 표시된 기간 안에 직접 결제에서 한 번 쓸 수 있고, 현금으로 바꾸거나 다른 사람에게 넘길 수 없습니다. 판매자는 거짓 계정 등 부정한 방법으로 얻은 보상을 취소하고 그 계정을 막을 수 있습니다. <span class="rev">2026년 12월 9일 개정</span></p>
<p class="chg"><span class="no">9.</span> 묶음 키는 같은 플랜의 연간 키 여러 개를 한 번에 사는 것입니다. 키 하나는 컴퓨터 한 대에 씁니다. 구매자는 자신이 관리하는 컴퓨터를 쓰는 사람(직원, 가족 등)에게 그 컴퓨터에 쓸 키를 줄 수 있고, 그 밖의 사람에게 팔거나 주거나 공개할 수 없습니다. 판매자는 공개되거나 부정하게 쓰인 키만 막고, 같은 묶음의 다른 키는 계속 쓸 수 있습니다. 묶음 키는 자동으로 결제되지 않고 할인 티켓을 쓸 수 없습니다. <span class="rev">2026년 12월 9일 개정</span></p>
<h2 id="a4">제4조 (금지 행위)</h2>
<p>사용자는 다음 행위를 할 수 없습니다.</p>
<p class="imp"><span class="no">1.</span> 라이선스 확인이나 플랜 잠금을 우회하거나 없애는 행위, 그런 수단을 배포하는 행위</p>
<p class="imp"><span class="no">2.</span> 프로그램이나 키를 복제, 판매, 대여, 재배포하는 행위</p>
<p><span class="no">3.</span> 프로그램을 수정하거나 역분석하는 행위. 법이나 오픈소스 구성 요소의 라이선스가 허용하는 경우는 제외합니다.</p>
<p><span class="no">4.</span> 공개된 코드를 허락 없이 쓰는 행위</p>
<p><span class="no">5.</span> 프로그램에 있는 저작권 표시를 지우는 행위</p>
<h2 id="a5">제5조 (게임과 안티치트)</h2>
<p><span class="no">1.</span> 프로그램은 게임 화면을 캡처해 별도의 오버레이에 표시합니다. 게임 프로세스에 코드를 주입하지 않고 게임 메모리와 게임 파일을 바꾸지 않습니다.</p>
<p class="imp"><span class="no">2.</span> 판매자는 안티치트를 쓰는 게임에서 프로그램을 시험하지 않았습니다. 프로그램이 모든 게임의 이용약관이나 안티치트 정책에 맞는다고 보장하지 않습니다.</p>
<p class="imp"><span class="no">3.</span> 게임의 정책은 사용자가 쓰기 전에 직접 확인해야 합니다.</p>
<h2 id="a6">제6조 (시스템 설정을 바꾸는 기능)</h2>
<p class="chg"><span class="no">1.</span> 게임 부스트, 업무·방송 기능(방송 모드, 업무 모드, 시작 프로그램 정리), 오버클럭, 전력 제한은 사용자가 켤 때만 동작합니다. 프로그램은 바꾸기 전 값을 백업하고 되돌리는 기능을 제공합니다. <span class="rev">2026년 12월 9일 개정</span></p>
<p class="imp"><span class="no">2.</span> 오버클럭은 게임 강제 종료, 시스템 멈춤, 드라이버 오류를 일으킬 수 있습니다. 그래픽 카드 제조사의 보증에 영향을 줄 수도 있습니다.</p>
<p class="cont">위험을 이해한 뒤 작은 값부터 쓰세요.</p>
<p class="imp"><span class="no">3.</span> 드라이버나 하드웨어에 오류가 생긴 상황에서 자동 복구가 항상 동작한다고 보장하지 않습니다.</p>
<h2 id="a7">제7조 (성능 안내)</h2>
<p><span class="no">1.</span> 프레임 생성은 게임이 실제로 그리는 프레임을 늘리지 않습니다. 프레임 사이의 화면을 만들어 넣습니다.</p>
<p class="imp"><span class="no">2.</span> 프레임 생성을 켜면 입력 지연이 늘어납니다. 경쟁 게임에는 권장하지 않습니다.</p>
<p><span class="no">3.</span> 출력 FPS는 사용자가 출력 프레임을 정하지 않으면 모니터 주사율을 따릅니다. 정한 값은 주사율을 넘을 수 있지만, 모니터는 자기 주사율까지만 표시합니다.</p>
<p><span class="no">4.</span> 판매 페이지의 측정값은 표시된 환경의 결과입니다. 실제 결과는 PC, 게임, 설정에 따라 다릅니다.</p>
<h2 id="a8">제8조 (네트워크 사용과 개인정보)</h2>
<p><span class="no">1.</span> 프로그램은 키 확인을 위해 판매자의 라이선스 서버에 키의 식별 번호를 보내고, 업데이트 확인을 위해 GitHub에 연결합니다. macOS에서 Windows 게임 실행 환경을 설정하면 필요한 파일을 내려받습니다.</p>
<p><span class="no">2.</span> 프로그램은 사용 통계를 위해 켜져 있는 동안 판매자의 서버에 무작위로 만든 설치 번호, 앱 버전, 운영체제, 플랜, 프레임 생성 배수, 원클릭 게임 부스트 사용 여부를 보냅니다. 서버는 접속한 국가를 함께 기록합니다. 키, 메일, 게임 이름, 하드웨어 정보는 보내지 않고, 판매자는 IP 주소를 저장하지 않습니다. 설치 번호는 마지막 연결 뒤 90일이 지나면 지웁니다.</p>
<p><span class="no">3.</span> 사용자는 앱의 설정에서 사용 통계를 끌 수 있습니다.</p>
<p><span class="no">4.</span> 사용자가 추천 코드를 입력하면 프로그램은 코드와 무작위로 만든 기기 번호를 판매자의 서버로 보냅니다. 기기 번호는 같은 기기가 코드를 다시 쓰지 못하게 막는 데에만 쓰고 90일 뒤 지웁니다.</p>
<p><span class="no">5.</span> 회원 가입은 선택이며 만 14세 이상만 할 수 있습니다. 회원이 되면 판매자는 아이디, 암호화한 비밀번호와 복구 코드, 가입과 마지막 로그인 시각, 동의한 시각, 초대 코드와 초대 관계를 Supabase의 데이터베이스 서비스에 보관합니다. 이 정보는 회원 관리와 초대 혜택에만 쓰고, 탈퇴하면 바로 지웁니다.</p>
<p><span class="no">6.</span> 가입과 로그인의 남용을 막으려고, 판매자의 서버는 접속 IP를 되돌릴 수 없게 바꾼 값을 1시간까지 보관합니다.</p>
<p><span class="no">7.</span> 개인정보 처리 방법은 판매 페이지에 표시합니다.</p>
<h2 id="a9">제9조 (구매와 청약철회)</h2>
<p><span class="no">1.</span> 사용자는 키를 받은 날부터 7일 이내에 청약을 철회할 수 있습니다.</p>
<p class="imp"><span class="no">2.</span> 키를 등록해 유료 기능을 쓰기 시작하면 디지털콘텐츠의 제공이 시작된 것으로 보아 청약철회가 제한될 수 있습니다.</p>
<p class="cont">판매자는 구매 전에 쓸 수 있는 3일 시험 키를 제공합니다.</p>
<p><span class="no">3.</span> 프로그램이 표시나 광고의 내용과 다르거나 계약과 다르게 제공된 경우, 사용자는 받은 날부터 3개월 이내, 그 사실을 안 날 또는 알 수 있었던 날부터 30일 이내에 청약을 철회할 수 있습니다.</p>
<p><span class="no">4.</span> 환불이 끝나면 판매자는 해당 키를 막습니다.</p>
<p><span class="no">5.</span> 청약철회와 환불 문의는 판매 페이지에 표시한 연락처로 보냅니다.</p>
<h2 id="a10">제10조 (보증과 책임)</h2>
<p><span class="no">1.</span> 판매자는 프로그램이 모든 PC와 게임에서 오류 없이 동작한다고 보증하지 않습니다.</p>
<p><span class="no">2.</span> 판매자는 자신의 고의 또는 중대한 과실로 생긴 손해를 배상합니다.</p>
<p class="imp"><span class="no">3.</span> 판매자의 경과실로 생긴 손해의 배상 범위는 통상의 손해로 하며, 사용자가 프로그램에 지급한 금액을 한도로 합니다.</p>
<p><span class="no">4.</span> 판매자는 운영체제, 드라이버, 게임 업데이트처럼 판매자가 통제할 수 없는 변경으로 생긴 호환 문제에 대해서는 책임지지 않습니다. 판매자에게 고의 또는 중대한 과실이 있는 경우는 제외합니다.</p>
<h2 id="a11">제11조 (계약의 종료)</h2>

<p class="chg"><span class="no">2.</span> 사용자가 제3조 제5항이나 제9항, 또는 제4조를 어기면 판매자는 해당 키를 막고 사용권을 끝낼 수 있습니다. <span class="rev">2026년 12월 9일 개정</span></p>

<p><span class="no">7.</span> A key received with a referral code or an invite code can be used only for the period shown. The Seller may end a referral code at any time. A key already received stays usable for its period.</p>

<h2 id="a6">Article 6 (Features that change system settings)</h2>
<p class="chg"><span class="no">1.</span> Game boost, the work and streaming features (stream mode, work mode, startup programs), overclocking and power limits run only when the User turns them on. The Program backs up the previous values and provides a way to restore them. <span class="rev">Revised Dec 9, 2026</span></p>
<p class="imp"><span class="no">2.</span> Overclocking can cause game crashes, system freezes and driver errors. It may also affect the graphics card manufacturer&#x27;s warranty.</p>

<p class="imp"><span class="no">3.</span> The Seller does not guarantee that automatic recovery always works when a driver or hardware error has occurred.</p>

<p><span class="no">3.</span> Output FPS follows the monitor&#x27;s refresh rate unless the User chooses an output rate. A chosen rate can exceed the refresh rate, but a monitor displays only up to its own refresh rate.</p>
<p><span class="no">4.</span> Measurements on the sales page are results in the stated environment. Actual results differ by PC, game and settings.</p>
<h2 id="a8">Article 8 (Network use and personal information)</h2>
<p><span class="no">1.</span> The Program sends the key&#x27;s identifying number to the Seller&#x27;s license server to check the key, and connects to GitHub to check for updates. Setting up the Windows game environment on macOS downloads the files it needs.</p>
<p><span class="no">2.</span> While it is on, the Program sends the Seller&#x27;s server a randomly created install number, the app version, operating system, plan, frame generation multiplier, and whether one-click game boost is in use, for usage statistics. The server also records the country of the connection. Keys, email addresses, game names and hardware information are not sent, and the Seller does not store IP addresses. The install number is deleted 90 days after the last connection.</p>
<p><span class="no">3.</span> The User can turn off usage statistics in the app&#x27;s settings.</p>
<p><span class="no">4.</span> When the User enters a referral code, the Program sends the code and a randomly created device number to the Seller&#x27;s server. The device number is used only to stop the same device from using a code again, and is deleted after 90 days.</p>
<p><span class="no">5.</span> Signing up as a member is optional and open only to people aged 14 or over. For members, the Seller keeps the ID, the encrypted password and recovery code, the times of sign-up and last login, the time of consent, and the invite code and invitation records in Supabase&#x27;s database service. This information is used only to manage members and invite benefits, and is deleted at once when a member leaves.</p>
<p><span class="no">6.</span> To prevent abuse of sign-up and login, the Seller&#x27;s server keeps a one-way value made from the connecting IP address for up to 1 hour.</p>
<p><span class="no">7.</span> How personal information is handled is shown on the sales page.</p>
