<p class="imp"><span class="no">1.</span> Bypass or remove the license check or plan locks, or distribute a means of doing so</p>
<p class="imp"><span class="no">2.</span> Copy, sell, rent or redistribute the Program or keys</p>
<p><span class="no">3.</span> Modify or reverse engineer the Program, except where the law or the license of an open source component allows it</p>
<p><span class="no">4.</span> Use the published code without permission</p>
<p><span class="no">5.</span> Remove copyright notices from the Program</p>
<h2 id="a5">Article 5 (Games and anti-cheat)</h2>
<p><span class="no">1.</span> The Program captures the game&#x27;s picture and shows it in a separate overlay. It does not inject code into game processes and does not change game memory or game files.</p>
<p class="imp"><span class="no">2.</span> The Seller has not tested the Program in games that use anti-cheat. The Seller does not guarantee that the Program complies with the terms of use or anti-cheat policy of every game.</p>
<p class="imp"><span class="no">3.</span> The User must check a game&#x27;s policy before using the Program with it.</p>
<h2 id="a6">Article 6 (Features that change system settings)</h2>
<p class="chg"><span class="no">1.</span> Game boost, the work and streaming features (stream mode, work mode, startup programs), overclocking and power limits run only when the User turns them on. The Program backs up the previous values and provides a way to restore them. <span class="rev">Revised Dec 9, 2026</span></p>
<p class="imp"><span class="no">2.</span> Overclocking can cause game crashes, system freezes and driver errors. It may also affect the graphics card manufacturer&#x27;s warranty.</p>
<p class="cont">Use small values first, after understanding the risks.</p>
<p class="imp"><span class="no">3.</span> The Seller does not guarantee that automatic recovery always works when a driver or hardware error has occurred.</p>
<h2 id="oc">Article 6-2 (Overclocking and hardware tuning) <span class="rev">Revised Jan 1, 2027</span></h2>
<p class="imp"><span class="no">1.</span> Overclocking and changing the power limit run your graphics card beyond the manufacturer&#x27;s default settings. This may cause system instability, game crashes, higher temperatures, shorter component lifespan, or hardware damage, and may void your GPU or PC manufacturer&#x27;s warranty.</p>
<p><span class="no">2.</span> SystemBoost provides temperature monitoring and automatic recovery, but cannot prevent every problem.</p>
<p class="imp"><span class="no">3.</span> You are solely responsible for choosing to enable these features and for any results of using them. This does not apply to damage caused by SystemBoost&#x27;s intentional misconduct or gross negligence.</p>
<p><span class="no">4.</span> Paragraphs 1 to 3 are the wording of the app&#x27;s &quot;Overclocking &amp; Power Limit Notice&quot;. The notice and the consent also cover automatic tuning (automatic undervolting and overclocking) and changes that lower values. The Program shows the notice the first time overclocking or the power limit is turned on, and turns them on only after the User agrees. The User is asked again when the graphics card changes, when the notice&#x27;s wording changes, and when a preset containing overclocking values is imported.</p>
<p><span class="no">5.</span> The User can withdraw consent in the app at any time. The Program then turns overclocking and the power limit off, puts back the values it changed and returns the graphics card&#x27;s power limit and clocks to factory values. Settings changed by other programs (such as voltage or fans) may remain, and the app says so if it cannot put the values back.</p>
<p><span class="no">6.</span> A record of each consent and withdrawal (the notice&#x27;s version, time, graphics card model and app version) stays on the User&#x27;s PC. When the User agrees or withdraws in an app signed in as a member, the same record is also kept with the member account (Article 8, Paragraph 5).</p>
<h2 id="a7">Article 7 (Performance)</h2>
<p><span class="no">1.</span> Frame generation does not increase the frames the game actually draws. It inserts images between frames.</p>
<p class="imp"><span class="no">2.</span> Turning on frame generation increases input delay. It is not recommended for competitive games.</p>
<p><span class="no">3.</span> Output FPS follows the monitor&#x27;s refresh rate unless the User chooses an output rate. A chosen rate can exceed the refresh rate, but a monitor displays only up to its own refresh rate.</p>
<p><span class="no">4.</span> Measurements on the sales page are results in the stated environment. Actual results differ by PC, game and settings.</p>
<h2 id="a8">Article 8 (Network use and personal information) <span class="rev">Revised Jan 1, 2027</span></h2>
<p><span class="no">1.</span> The Program sends the key&#x27;s identifying number to the Seller&#x27;s license server to check the key. It sends the subscription number and the key in use when renewing a subscription key, and the order code and the payer name and payment memo the User entered when paying directly. It connects to GitHub to check for updates.</p>
<p class="cont">The Seller&#x27;s server keeps the full text of each key it issues and the key&#x27;s record (plan, issue and expiry dates, email address, subscription number, note). The email address is the payment email of a card payment or an email the Seller entered, and it is also inside the key. If the Seller approves a direct payment with the note left empty, the payer name and payment memo go into the key record&#x27;s note. No retention period is set for key records or for the index that finds keys by email address; they are kept until the Seller deletes them.</p>
<p class="cont">Orders keep the order code, plan, payment method, the payer name and payment memo of a direct payment, and the email address, and are deleted 90 days after the order last changed. The Seller&#x27;s activity log also keeps email addresses and notes for 180 days.</p>
<p class="cont">When the User answers a price change notice for a card subscription, the Seller keeps the subscription number, the key&#x27;s identifying number, the answer chosen (agree or cancel), the time of the answer and how it was handled for 3 years from the day of the answer. If the Seller has turned it on, when a deposit is reported for a bank transfer order, the Seller is notified in a Discord channel only the Seller sees (Discord Inc., a US company) of the order code, the plan and the deadline for sending the key. Email addresses, names, payer names and payment memos are not sent.</p>
<p class="cont">The Seller&#x27;s server and its data are processed and stored in data centers that Cloudflare, Inc. (a US company) runs around the world, so personal information is transferred abroad. Member information is stored in Supabase&#x27;s database service; its location is shown in the privacy policy.</p>
<p><span class="no">2.</span> While it is on, the Program sends the Seller&#x27;s server a randomly created install number, the app version, operating system, plan, frame generation multiplier, and whether one-click game boost is in use, for usage statistics. The server also records the country of the connection and the times of the first and last connection. Keys, email addresses, game names and hardware information are not sent, and usage statistics store no IP address. The install number is deleted 90 days after the last connection.</p>
<p><span class="no">3.</span> Usage statistics are optional and start off. The User chooses whether to send them on the screen where the User agrees to this agreement, and can change this later in the app&#x27;s settings. When they are off, the Program sends no usage statistics.</p>
<p><span class="no">4.</span> When the User enters a referral code, the Program sends the code and a randomly created device number to the Seller&#x27;s server. Signing up as a member also sends the device number, but the server keeps it only when an invite code is used. The device number is used only to stop the same device from using a code again, and is deleted after 90 days.</p>
<p><span class="no">5.</span> Signing up as a member is optional and open only to people aged 14 or over. Members sign up with an ID or an email address. For members, the Seller keeps the ID (for an email sign-up, a member number the server creates), the email address (when signing up by email or adding one to the account) and the time it was confirmed, the password and recovery code as hash values, the times of sign-up and last login, the version and time of the notice agreed to, the invite code, the inviting member, the number of invitations and reward days, discount tickets (including the order code a ticket was used on), failed logins and lockouts, whether the member is blocked, login sessions and signed-in devices (device name, a hash value of the device number the app creates, the country of the connection, the times of the first and last connection), the keys linked to the account, and the records of consent to and withdrawal from the overclocking notice in Supabase&#x27;s database service. When 2-step login is turned on, the Seller also keeps the authenticator app&#x27;s secret (encrypted) and the backup codes (as hash values). This information is used to manage members, for login and account protection, for alerts of a login on a new device, for invite rewards and discount tickets, and to show a member&#x27;s keys. If a member sends a request to the support center while signed in to the app, the member&#x27;s ID is attached to it.</p>
<p class="cont">To check for account takeover, the Seller keeps a security log for 30 days: the time and kind of events such as logins, password changes and resets, changes to 2-step login, added email addresses, linked keys and account recovery requests, with the IP address, the country of the connection and the device name at that time. When a member who has lost both the password and the recovery code asks for account recovery, the Seller keeps the request and the details the member entered to confirm it (contact, order code, payment date, amount, last 4 digits of the card number, payer name and the like) for 90 days from the request and uses them only to confirm the member&#x27;s identity.</p>
<p class="cont">The Seller sends member emails (sign-up confirmation, password reset, alerts of a login on a new device and of a password change, key link confirmation, notice of an account recovery request), and the key resend emails that anyone can ask for without being a member, through Resend, Inc. (a US company). The recipient&#x27;s email address and the content of the email (for a key resend, the full key) are then transferred abroad. An email address entered to have keys sent again is used only to find the keys bought with it and send them to it, and is not stored. The Seller sends no advertising email.</p>
<p class="cont">When a member leaves, the member information in the live database is deleted at once, and a copy stays only in the backups described in Paragraph 9. The ID remains, however, in the record of an invite reward key (until the Seller deletes it), the Seller&#x27;s activity log (180 days) and support requests (for their retention period). Keys and payment records are not deleted when a member leaves, and keys keep working without membership.</p>
<p><span class="no">6.</span> To prevent abuse of sign-up, login, email requests (password reset, key resend, account recovery requests) and the support center, the Seller keeps hash values made from the connecting IP address for a short time. The hash values are made with a value only the server knows. Those for sign-up, login and email requests are deleted at the hourly cleanup after the clock hour they were counted in ends; those for the support center stay on the Seller&#x27;s server for up to 1 hour after the last request. A connection that enters a wrong password on the Seller&#x27;s dashboard is also counted by a hash value instead of the IP address, kept for 15 minutes after the last wrong attempt. Failed logins with an ID or email address that does not exist are kept as hash values for 1 day after the last failure (until the lockout ends, if locked). To avoid sending too many emails to one address, the emails sent are counted per hash value of the email address for 1 hour.</p>
<p><span class="no">7.</span> When the User sends a request to the support center, the Seller keeps its category, title, text, the Seller&#x27;s replies, the time of each message, its status, the time of consent, the language and a hash value of the access code. If the User enters or chooses them, the Seller also keeps the contact, order code, the key&#x27;s identifying number and app information (app version, operating system, GPU name). A refund request also carries its reason and the order and key information the server has (plan, the dates the key was received and expires, how it was received, subscription number, order code, payer name, order status, payment method). A full key sent for a refund request or subscription management is used only for checking and is not stored. Requests about payments and refunds are kept for 3 years and other requests for 1 year, counted from the day the request last changed.</p>
<p><span class="no">8.</span> The privacy policy can be seen in the app&#x27;s settings screen, in the support center, and on the /privacy page of the Seller&#x27;s server.</p>
<p><span class="no">9.</span> Deleted records stay for a short time in the backup and recovery features of the service companies. Records kept in Cloudflare&#x27;s database (Durable Objects), such as usage statistics, stay for up to 30 days after deletion, and member information kept in Supabase for up to 7 days after deletion, and are then gone. The Seller uses these copies only to recover from a failure, and after a recovery deletes again the records that had been deleted before.</p>

<p><span class="no">1.</span> The User may withdraw from the purchase within 7 days of receiving the key.</p>
<p class="chg"><span class="no">2.</span> Once the User registers a key and starts using paid features, the digital content is treated as provided and withdrawal may be limited. <span class="rev">Revised Jan 1, 2027</span></p>
<p class="cont">The Seller offers a free plan that can be used before purchase. Features found only in paid plans cannot be tried before purchase.</p>
<p><span class="no">3.</span> If the Program differs from what was displayed or advertised, or is provided differently from the contract, the User may withdraw within 3 months of receiving it, or within 30 days of the day the User learned or could have learned of this.</p>
<p><span class="no">4.</span> When a refund is complete, the Seller blocks the key.</p>
<p class="chg"><span class="no">5.</span> Questions about withdrawal and refunds go to the support center in the app or on the help page, or to the contact shown on the sales page. <span class="rev">Revised Jan 1, 2027</span></p>

<p><span class="no">2.</span> The Seller compensates for damage caused by the Seller&#x27;s intent or gross negligence.</p>
<p class="chg"><span class="no">3.</span> For damage caused by the Seller&#x27;s minor negligence, compensation covers ordinary damage, up to the amount the User paid for the Program or 100,000 won, whichever is greater. For a User who uses only the Free plan, the limit is 100,000 won. <span class="rev">Revised Jan 1, 2027</span></p>
<p><span class="no">4.</span> The Seller is not liable for compatibility problems caused by changes outside the Seller&#x27;s control, such as operating system, driver and game updates, except where the Seller acted with intent or gross negligence.</p>
<h2 id="a11">Article 11 (Ending this agreement)</h2>

<p class="chg"><span class="no">2.</span> If the User breaches Article 3, Paragraph 5 or 9, or Article 4, the Seller may block the key concerned and end the license. <span class="rev">Revised Dec 9, 2026</span></p>

<h2 id="a8">Article 8 (Network use and personal information) <span class="rev">Revised Jan 1, 2027</span></h2>
<p><span class="no">1.</span> The Program sends the key&#x27;s identifying number to the Seller&#x27;s license server to check the key. It sends the subscription number and the key in use when renewing a subscription key, and the order code and the payer name and payment memo the User entered when paying directly. It connects to GitHub to check for updates.</p>
<p class="cont">The Seller&#x27;s server keeps the full text of each key it issues and the key&#x27;s record (plan, issue and expiry dates, email address, subscription number, note). The email address is the payment email of a card payment or an email the Seller entered, and it is also inside the key. If the Seller approves a direct payment with the note left empty, the payer name and payment memo go into the key record&#x27;s note. No retention period is set for key records or for the index that finds keys by email address; they are kept until the Seller deletes them.</p>
<p class="cont">Orders keep the order code, plan, payment method, the payer name and payment memo of a direct payment, and the email address, and are deleted 90 days after the order last changed. The Seller&#x27;s activity log also keeps email addresses and notes for 180 days.</p>
<p class="cont">When the User answers a price change notice for a card subscription, the Seller keeps the subscription number, the key&#x27;s identifying number, the answer chosen (agree or cancel), the time of the answer and how it was handled for 3 years from the day of the answer. If the Seller has turned it on, when a deposit is reported for a bank transfer order, the Seller is notified in a Discord channel only the Seller sees (Discord Inc., a US company) of the order code, the plan and the deadline for sending the key. Email addresses, names, payer names and payment memos are not sent.</p>
<p class="cont">The Seller&#x27;s server and its data are processed and stored in data centers that Cloudflare, Inc. (a US company) runs around the world, so personal information is transferred abroad. Member information is stored in Supabase&#x27;s database service; its location is shown in the privacy policy.</p>
<p><span class="no">2.</span> While it is on, the Program sends the Seller&#x27;s server a randomly created install number, the app version, operating system, plan, frame generation multiplier, and whether one-click game boost is in use, for usage statistics. The server also records the country of the connection and the times of the first and last connection. Keys, email addresses, game names and hardware information are not sent, and usage statistics store no IP address. The install number is deleted 90 days after the last connection.</p>
<p><span class="no">3.</span> Usage statistics are optional and start off. The User chooses whether to send them on the screen where the User agrees to this agreement, and can change this later in the app&#x27;s settings. When they are off, the Program sends no usage statistics.</p>
<p><span class="no">4.</span> When the User enters a referral code, the Program sends the code and a randomly created device number to the Seller&#x27;s server. Signing up as a member also sends the device number, but the server keeps it only when an invite code is used. The device number is used only to stop the same device from using a code again, and is deleted after 90 days.</p>
<p><span class="no">5.</span> Signing up as a member is optional and open only to people aged 14 or over. Members sign up with an ID or an email address. For members, the Seller keeps the ID (for an email sign-up, a member number the server creates), the email address (when signing up by email or adding one to the account) and the time it was confirmed, the password and recovery code as hash values, the times of sign-up and last login, the version and time of the notice agreed to, the invite code, the inviting member, the number of invitations and reward days, discount tickets (including the order code a ticket was used on), failed logins and lockouts, whether the member is blocked, login sessions and signed-in devices (device name, a hash value of the device number the app creates, the country of the connection, the times of the first and last connection), the keys linked to the account, and the records of consent to and withdrawal from the overclocking notice in Supabase&#x27;s database service. When 2-step login is turned on, the Seller also keeps the authenticator app&#x27;s secret (encrypted) and the backup codes (as hash values). This information is used to manage members, for login and account protection, for alerts of a login on a new device, for invite rewards and discount tickets, and to show a member&#x27;s keys. If a member sends a request to the support center while signed in to the app, the member&#x27;s ID is attached to it.</p>
<p class="cont">To check for account takeover, the Seller keeps a security log for 30 days: the time and kind of events such as logins, password changes and resets, changes to 2-step login, added email addresses, linked keys and account recovery requests, with the IP address, the country of the connection and the device name at that time. When a member who has lost both the password and the recovery code asks for account recovery, the Seller keeps the request and the details the member entered to confirm it (contact, order code, payment date, amount, last 4 digits of the card number, payer name and the like) for 90 days from the request and uses them only to confirm the member&#x27;s identity.</p>
<p class="cont">The Seller sends member emails (sign-up confirmation, password reset, alerts of a login on a new device and of a password change, key link confirmation, notice of an account recovery request), and the key resend emails that anyone can ask for without being a member, through Resend, Inc. (a US company). The recipient&#x27;s email address and the content of the email (for a key resend, the full key) are then transferred abroad. An email address entered to have keys sent again is used only to find the keys bought with it and send them to it, and is not stored. The Seller sends no advertising email.</p>
<p class="cont">When a member leaves, the member information in the live database is deleted at once, and a copy stays only in the backups described in Paragraph 9. The ID remains, however, in the record of an invite reward key (until the Seller deletes it), the Seller&#x27;s activity log (180 days) and support requests (for their retention period). Keys and payment records are not deleted when a member leaves, and keys keep working without membership.</p>
<p><span class="no">6.</span> To prevent abuse of sign-up, login, email requests (password reset, key resend, account recovery requests) and the support center, the Seller keeps hash values made from the connecting IP address for a short time. The hash values are made with a value only the server knows. Those for sign-up, login and email requests are deleted at the hourly cleanup after the clock hour they were counted in ends; those for the support center stay on the Seller&#x27;s server for up to 1 hour after the last request. A connection that enters a wrong password on the Seller&#x27;s dashboard is also counted by a hash value instead of the IP address, kept for 15 minutes after the last wrong attempt. Failed logins with an ID or email address that does not exist are kept as hash values for 1 day after the last failure (until the lockout ends, if locked). To avoid sending too many emails to one address, the emails sent are counted per hash value of the email address for 1 hour.</p>

<p class="imp"><span class="no">3.</span> You are solely responsible for choosing to enable these features and for any results of using them. This does not apply to damage caused by SystemBoost&#x27;s intentional misconduct or gross negligence.</p>
<p><span class="no">4.</span> Paragraphs 1 to 3 are the wording of the app&#x27;s &quot;Overclocking &amp; Power Limit Notice&quot;. The notice and the consent also cover automatic tuning (automatic undervolting and overclocking) and changes that lower values. The Program shows the notice the first time overclocking or the power limit is turned on, and turns them on only after the User agrees. The User is asked again when the graphics card changes, when the notice&#x27;s wording changes, and when a preset containing overclocking values is imported.</p>
<p><span class="no">5.</span> The User can withdraw consent in the app at any time. The Program then turns overclocking and the power limit off, puts back the values it changed and returns the graphics card&#x27;s power limit and clocks to factory values. Settings changed by other programs (such as voltage or fans) may remain, and the app says so if it cannot put the values back.</p>
<p><span class="no">6.</span> A record of each consent and withdrawal (the notice&#x27;s version, time, graphics card model and app version) stays on the User&#x27;s PC. When the User agrees or withdraws in an app signed in as a member, the same record is also kept with the member account (Article 8, Paragraph 5).</p>

<p><span class="no">3.</span> Output FPS follows the monitor&#x27;s refresh rate unless the User chooses an output rate. A chosen rate can exceed the refresh rate, but a monitor displays only up to its own refresh rate.</p>

<h2 id="a8">Article 8 (Network use and personal information) <span class="rev">Revised Jan 1, 2027</span></h2>
<p><span class="no">1.</span> The Program sends the key&#x27;s identifying number to the Seller&#x27;s license server to check the key. It sends the subscription number and the key in use when renewing a subscription key, and the order code and the payer name and payment memo the User entered when paying directly. It connects to GitHub to check for updates.</p>
<p class="cont">The Seller&#x27;s server keeps the full text of each key it issues and the key&#x27;s record (plan, issue and expiry dates, email address, subscription number, note). The email address is the payment email of a card payment or an email the Seller entered, and it is also inside the key. If the Seller approves a direct payment with the note left empty, the payer name and payment memo go into the key record&#x27;s note. No retention period is set for key records or for the index that finds keys by email address; they are kept until the Seller deletes them.</p>
<p class="cont">Orders keep the order code, plan, payment method, the payer name and payment memo of a direct payment, and the email address, and are deleted 90 days after the order last changed. The Seller&#x27;s activity log also keeps email addresses and notes for 180 days.</p>
<p class="cont">When the User answers a price change notice for a card subscription, the Seller keeps the subscription number, the key&#x27;s identifying number, the answer chosen (agree or cancel), the time of the answer and how it was handled for 3 years from the day of the answer. If the Seller has turned it on, when a deposit is reported for a bank transfer order, the Seller is notified in a Discord channel only the Seller sees (Discord Inc., a US company) of the order code, the plan and the deadline for sending the key. Email addresses, names, payer names and payment memos are not sent.</p>
<p class="cont">The Seller&#x27;s server and its data are processed and stored in data centers that Cloudflare, Inc. (a US company) runs around the world, so personal information is transferred abroad. Member information is stored in Supabase&#x27;s database service; its location is shown in the privacy policy.</p>
<p><span class="no">2.</span> While it is on, the Program sends the Seller&#x27;s server a randomly created install number, the app version, operating system, plan, frame generation multiplier, and whether one-click game boost is in use, for usage statistics. The server also records the country of the connection and the times of the first and last connection. Keys, email addresses, game names and hardware information are not sent, and usage statistics store no IP address. The install number is deleted 90 days after the last connection.</p>
<p><span class="no">3.</span> Usage statistics are optional and start off. The User chooses whether to send them on the screen where the User agrees to this agreement, and can change this later in the app&#x27;s settings. When they are off, the Program sends no usage statistics.</p>
<p><span class="no">4.</span> When the User enters a referral code, the Program sends the code and a randomly created device number to the Seller&#x27;s server. Signing up as a member also sends the device number, but the server keeps it only when an invite code is used. The device number is used only to stop the same device from using a code again, and is deleted after 90 days.</p>
<p><span class="no">5.</span> Signing up as a member is optional and open only to people aged 14 or over. Members sign up with an ID or an email address. For members, the Seller keeps the ID (for an email sign-up, a member number the server creates), the email address (when signing up by email or adding one to the account) and the time it was confirmed, the password and recovery code as hash values, the times of sign-up and last login, the version and time of the notice agreed to, the invite code, the inviting member, the number of invitations and reward days, discount tickets (including the order code a ticket was used on), failed logins and lockouts, whether the member is blocked, login sessions and signed-in devices (device name, a hash value of the device number the app creates, the country of the connection, the times of the first and last connection), the keys linked to the account, and the records of consent to and withdrawal from the overclocking notice in Supabase&#x27;s database service. When 2-step login is turned on, the Seller also keeps the authenticator app&#x27;s secret (encrypted) and the backup codes (as hash values). This information is used to manage members, for login and account protection, for alerts of a login on a new device, for invite rewards and discount tickets, and to show a member&#x27;s keys. If a member sends a request to the support center while signed in to the app, the member&#x27;s ID is attached to it.</p>
<p class="cont">To check for account takeover, the Seller keeps a security log for 30 days: the time and kind of events such as logins, password changes and resets, changes to 2-step login, added email addresses, linked keys and account recovery requests, with the IP address, the country of the connection and the device name at that time. When a member who has lost both the password and the recovery code asks for account recovery, the Seller keeps the request and the details the member entered to confirm it (contact, order code, payment date, amount, last 4 digits of the card number, payer name and the like) for 90 days from the request and uses them only to confirm the member&#x27;s identity.</p>
<p class="cont">The Seller sends member emails (sign-up confirmation, password reset, alerts of a login on a new device and of a password change, key link confirmation, notice of an account recovery request), and the key resend emails that anyone can ask for without being a member, through Resend, Inc. (a US company). The recipient&#x27;s email address and the content of the email (for a key resend, the full key) are then transferred abroad. An email address entered to have keys sent again is used only to find the keys bought with it and send them to it, and is not stored. The Seller sends no advertising email.</p>
<p class="cont">When a member leaves, the member information in the live database is deleted at once, and a copy stays only in the backups described in Paragraph 9. The ID remains, however, in the record of an invite reward key (until the Seller deletes it), the Seller&#x27;s activity log (180 days) and support requests (for their retention period). Keys and payment records are not deleted when a member leaves, and keys keep working without membership.</p>
<p><span class="no">6.</span> To prevent abuse of sign-up, login, email requests (password reset, key resend, account recovery requests) and the support center, the Seller keeps hash values made from the connecting IP address for a short time. The hash values are made with a value only the server knows. Those for sign-up, login and email requests are deleted at the hourly cleanup after the clock hour they were counted in ends; those for the support center stay on the Seller&#x27;s server for up to 1 hour after the last request. A connection that enters a wrong password on the Seller&#x27;s dashboard is also counted by a hash value instead of the IP address, kept for 15 minutes after the last wrong attempt. Failed logins with an ID or email address that does not exist are kept as hash values for 1 day after the last failure (until the lockout ends, if locked). To avoid sending too many emails to one address, the emails sent are counted per hash value of the email address for 1 hour.</p>
<p><span class="no">7.</span> When the User sends a request to the support center, the Seller keeps its category, title, text, the Seller&#x27;s replies, the time of each message, its status, the time of consent, the language and a hash value of the access code. If the User enters or chooses them, the Seller also keeps the contact, order code, the key&#x27;s identifying number and app information (app version, operating system, GPU name). A refund request also carries its reason and the order and key information the server has (plan, the dates the key was received and expires, how it was received, subscription number, order code, payer name, order status, payment method). A full key sent for a refund request or subscription management is used only for checking and is not stored. Requests about payments and refunds are kept for 3 years and other requests for 1 year, counted from the day the request last changed.</p>
<p><span class="no">8.</span> The privacy policy can be seen in the app&#x27;s settings screen, in the support center, and on the /privacy page of the Seller&#x27;s server.</p>
<p><span class="no">9.</span> Deleted records stay for a short time in the backup and recovery features of the service companies. Records kept in Cloudflare&#x27;s database (Durable Objects), such as usage statistics, stay for up to 30 days after deletion, and member information kept in Supabase for up to 7 days after deletion, and are then gone. The Seller uses these copies only to recover from a failure, and after a recovery deletes again the records that had been deleted before.</p>

<h2 id="a6">Article 6 (Features that change system settings)</h2>
<p class="chg"><span class="no">1.</span> Game boost, the work and streaming features (stream mode, work mode, startup programs), overclocking and power limits run only when the User turns them on. The Program backs up the previous values and provides a way to restore them. <span class="rev">Revised Dec 9, 2026</span></p>

<p class="imp"><span class="no">1.</span> Overclocking and changing the power limit run your graphics card beyond the manufacturer&#x27;s default settings. This may cause system instability, game crashes, higher temperatures, shorter component lifespan, or hardware damage, and may void your GPU or PC manufacturer&#x27;s warranty.</p>
<p><span class="no">2.</span> SystemBoost provides temperature monitoring and automatic recovery, but cannot prevent every problem.</p>
<p class="imp"><span class="no">3.</span> You are solely responsible for choosing to enable these features and for any results of using them. This does not apply to damage caused by SystemBoost&#x27;s intentional misconduct or gross negligence.</p>
<p><span class="no">4.</span> Paragraphs 1 to 3 are the wording of the app&#x27;s &quot;Overclocking &amp; Power Limit Notice&quot;. The notice and the consent also cover automatic tuning (automatic undervolting and overclocking) and changes that lower values. The Program shows the notice the first time overclocking or the power limit is turned on, and turns them on only after the User agrees. The User is asked again when the graphics card changes, when the notice&#x27;s wording changes, and when a preset containing overclocking values is imported.</p>
<p><span class="no">5.</span> The User can withdraw consent in the app at any time. The Program then turns overclocking and the power limit off, puts back the values it changed and returns the graphics card&#x27;s power limit and clocks to factory values. Settings changed by other programs (such as voltage or fans) may remain, and the app says so if it cannot put the values back.</p>
<p><span class="no">6.</span> A record of each consent and withdrawal (the notice&#x27;s version, time, graphics card model and app version) stays on the User&#x27;s PC. When the User agrees or withdraws in an app signed in as a member, the same record is also kept with the member account (Article 8, Paragraph 5).</p>
<h2 id="a7">Article 7 (Performance)</h2>

<p><span class="no">3.</span> Output FPS follows the monitor&#x27;s refresh rate unless the User chooses an output rate. A chosen rate can exceed the refresh rate, but a monitor displays only up to its own refresh rate.</p>
<p><span class="no">4.</span> Measurements on the sales page are results in the stated environment. Actual results differ by PC, game and settings.</p>
<h2 id="a8">Article 8 (Network use and personal information) <span class="rev">Revised Jan 1, 2027</span></h2>
<p><span class="no">1.</span> The Program sends the key&#x27;s identifying number to the Seller&#x27;s license server to check the key. It sends the subscription number and the key in use when renewing a subscription key, and the order code and the payer name and payment memo the User entered when paying directly. It connects to GitHub to check for updates.</p>
<p class="cont">The Seller&#x27;s server keeps the full text of each key it issues and the key&#x27;s record (plan, issue and expiry dates, email address, subscription number, note). The email address is the payment email of a card payment or an email the Seller entered, and it is also inside the key. If the Seller approves a direct payment with the note left empty, the payer name and payment memo go into the key record&#x27;s note. No retention period is set for key records or for the index that finds keys by email address; they are kept until the Seller deletes them.</p>
<p class="cont">Orders keep the order code, plan, payment method, the payer name and payment memo of a direct payment, and the email address, and are deleted 90 days after the order last changed. The Seller&#x27;s activity log also keeps email addresses and notes for 180 days.</p>
<p class="cont">When the User answers a price change notice for a card subscription, the Seller keeps the subscription number, the key&#x27;s identifying number, the answer chosen (agree or cancel), the time of the answer and how it was handled for 3 years from the day of the answer. If the Seller has turned it on, when a deposit is reported for a bank transfer order, the Seller is notified in a Discord channel only the Seller sees (Discord Inc., a US company) of the order code, the plan and the deadline for sending the key. Email addresses, names, payer names and payment memos are not sent.</p>
<p class="cont">The Seller&#x27;s server and its data are processed and stored in data centers that Cloudflare, Inc. (a US company) runs around the world, so personal information is transferred abroad. Member information is stored in Supabase&#x27;s database service; its location is shown in the privacy policy.</p>
<p><span class="no">2.</span> While it is on, the Program sends the Seller&#x27;s server a randomly created install number, the app version, operating system, plan, frame generation multiplier, and whether one-click game boost is in use, for usage statistics. The server also records the country of the connection and the times of the first and last connection. Keys, email addresses, game names and hardware information are not sent, and usage statistics store no IP address. The install number is deleted 90 days after the last connection.</p>
<p><span class="no">3.</span> Usage statistics are optional and start off. The User chooses whether to send them on the screen where the User agrees to this agreement, and can change this later in the app&#x27;s settings. When they are off, the Program sends no usage statistics.</p>
<p><span class="no">4.</span> When the User enters a referral code, the Program sends the code and a randomly created device number to the Seller&#x27;s server. Signing up as a member also sends the device number, but the server keeps it only when an invite code is used. The device number is used only to stop the same device from using a code again, and is deleted after 90 days.</p>
<p><span class="no">5.</span> Signing up as a member is optional and open only to people aged 14 or over. Members sign up with an ID or an email address. For members, the Seller keeps the ID (for an email sign-up, a member number the server creates), the email address (when signing up by email or adding one to the account) and the time it was confirmed, the password and recovery code as hash values, the times of sign-up and last login, the version and time of the notice agreed to, the invite code, the inviting member, the number of invitations and reward days, discount tickets (including the order code a ticket was used on), failed logins and lockouts, whether the member is blocked, login sessions and signed-in devices (device name, a hash value of the device number the app creates, the country of the connection, the times of the first and last connection), the keys linked to the account, and the records of consent to and withdrawal from the overclocking notice in Supabase&#x27;s database service. When 2-step login is turned on, the Seller also keeps the authenticator app&#x27;s secret (encrypted) and the backup codes (as hash values). This information is used to manage members, for login and account protection, for alerts of a login on a new device, for invite rewards and discount tickets, and to show a member&#x27;s keys. If a member sends a request to the support center while signed in to the app, the member&#x27;s ID is attached to it.</p>
<p class="cont">To check for account takeover, the Seller keeps a security log for 30 days: the time and kind of events such as logins, password changes and resets, changes to 2-step login, added email addresses, linked keys and account recovery requests, with the IP address, the country of the connection and the device name at that time. When a member who has lost both the password and the recovery code asks for account recovery, the Seller keeps the request and the details the member entered to confirm it (contact, order code, payment date, amount, last 4 digits of the card number, payer name and the like) for 90 days from the request and uses them only to confirm the member&#x27;s identity.</p>
<p class="cont">The Seller sends member emails (sign-up confirmation, password reset, alerts of a login on a new device and of a password change, key link confirmation, notice of an account recovery request), and the key resend emails that anyone can ask for without being a member, through Resend, Inc. (a US company). The recipient&#x27;s email address and the content of the email (for a key resend, the full key) are then transferred abroad. An email address entered to have keys sent again is used only to find the keys bought with it and send them to it, and is not stored. The Seller sends no advertising email.</p>
<p class="cont">When a member leaves, the member information in the live database is deleted at once, and a copy stays only in the backups described in Paragraph 9. The ID remains, however, in the record of an invite reward key (until the Seller deletes it), the Seller&#x27;s activity log (180 days) and support requests (for their retention period). Keys and payment records are not deleted when a member leaves, and keys keep working without membership.</p>
<p><span class="no">6.</span> To prevent abuse of sign-up, login, email requests (password reset, key resend, account recovery requests) and the support center, the Seller keeps hash values made from the connecting IP address for a short time. The hash values are made with a value only the server knows. Those for sign-up, login and email requests are deleted at the hourly cleanup after the clock hour they were counted in ends; those for the support center stay on the Seller&#x27;s server for up to 1 hour after the last request. A connection that enters a wrong password on the Seller&#x27;s dashboard is also counted by a hash value instead of the IP address, kept for 15 minutes after the last wrong attempt. Failed logins with an ID or email address that does not exist are kept as hash values for 1 day after the last failure (until the lockout ends, if locked). To avoid sending too many emails to one address, the emails sent are counted per hash value of the email address for 1 hour.</p>
<p><span class="no">7.</span> When the User sends a request to the support center, the Seller keeps its category, title, text, the Seller&#x27;s replies, the time of each message, its status, the time of consent, the language and a hash value of the access code. If the User enters or chooses them, the Seller also keeps the contact, order code, the key&#x27;s identifying number and app information (app version, operating system, GPU name). A refund request also carries its reason and the order and key information the server has (plan, the dates the key was received and expires, how it was received, subscription number, order code, payer name, order status, payment method). A full key sent for a refund request or subscription management is used only for checking and is not stored. Requests about payments and refunds are kept for 3 years and other requests for 1 year, counted from the day the request last changed.</p>
<p><span class="no">8.</span> The privacy policy can be seen in the app&#x27;s settings screen, in the support center, and on the /privacy page of the Seller&#x27;s server.</p>
<p><span class="no">9.</span> Deleted records stay for a short time in the backup and recovery features of the service companies. Records kept in Cloudflare&#x27;s database (Durable Objects), such as usage statistics, stay for up to 30 days after deletion, and member information kept in Supabase for up to 7 days after deletion, and are then gone. The Seller uses these copies only to recover from a failure, and after a recovery deletes again the records that had been deleted before.</p>
