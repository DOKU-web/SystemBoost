# Builds every platform on each push and pull request.
# Releasing: write RELEASE_NOTES.md, then push a tag (git tag v0.7.0 && git push origin v0.7.0).
# The tag build packs with Velopack (installer, portable, update packages + deltas) and publishes a
# GitHub Release; installed and portable apps pick it up by themselves (Services/Updater.cs), and the
# download page always points at the newest release (releases/latest/download/...).
#
# 코드 서명 준비 (2026-11-05 조사, 인증서를 사기 전까지는 지금처럼 서명 없이 빌드됩니다)
# 가격은 조사일의 판매 페이지 기준이니 구매 전에 다시 확인하세요. 서명을 켜는 단계는 windows, macos 잡의 주석에 있습니다.
#
# Windows 인증서 공통 사항
# - 2026년 3월부터 인증서 1장의 유효기간은 최대 약 15개월(460일)입니다.
# - 개인키는 USB 토큰이나 클라우드 HSM에만 둘 수 있습니다. USB 토큰은 GitHub 호스트 러너에 꽂을 수 없어서 CI 서명에는 클라우드 HSM이 필요합니다.
# - 서명해도 SmartScreen 경고가 바로 사라지지는 않습니다. EV도 2024년부터 OV와 같이 평판이 쌓여야 경고가 줄어듭니다.
# - 릴리스 1번에 서명하는 파일은 SystemBoost.exe, sb_framegen.exe, Update.exe, Setup.exe로 약 4개입니다(헬퍼를 넣으면 5개).
#
# Windows 선택지 (대략 1년 비용)
# 1) SSL.com IV + eSigner: 약 $309. 인증서 $129 + eSigner 1단계 연 $180(240회, 월 20회 분량).
#    개인 실명으로 발급하고 사업자등록이 필요 없습니다(정부 발급 신분증 확인). GitHub Actions 절차가 공식 문서에 있습니다.
#    한국 거주자 가능 여부는 페이지에 없으니 구매 전에 SSL.com에 문의하세요.
# 2) SSL.com OV + eSigner: 약 $309. 사업자 명의입니다. 금액과 CI 방법은 1)과 같습니다. 한국 개인사업자 가능 여부는 구매 전에 문의하세요.
# 3) 국내 대행 USB 토큰: Sectigo OV 약 66만 원, DigiCert EV 약 105만 원(SecureSign, VAT·토큰·배송 포함).
#    사업자등록증이 필요하고, 토큰이라 CI에서 서명할 수 없습니다. 내 PC에서 build.ps1을 돌려 서명해야 합니다.
# 4) Certum Standard Code Signing in the Cloud: €209부터. 개인 명의 발급이 가능해 보입니다.
#    SimplySign 앱이 접속 코드를 만드는 방식이고 무인 CI 서명 방법은 공식 페이지에 없습니다.
# 5) Azure Artifact Signing: 월 $9.99이지만 쓸 수 없습니다. 조직은 미국·캐나다·EU·영국, 개인은 미국·캐나다만 가입할 수 있습니다.
#
# macOS: Apple Developer Program 연 $99 (개인 가입 가능, 한국 원화 가격은 가입 화면에 표시됩니다).
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-cross mesa-vulkan-drivers libvulkan-dev g++-mingw-w64-x86-64-posix python3-numpy python3-scipy python3-pil
      - run: native/framegen/tests/run_all.sh
      - name: Metal shaders are up to date with the HLSL
        run: tools/gen_metal.sh && git diff --exit-code native/framegen-mac/Sources/SBFrameGenMac/GeneratedShaders.swift

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet tool install -g vpk --version 0.0.1298
      # 서명 켜기 (SSL.com eSigner 기준, 실제 인증서로는 아직 시험하지 않았습니다)
      # 1. 인증서를 eSigner에 등록하고, QR 코드와 함께 나오는 secret code를 저장합니다.
      # 2. GitHub Secrets에 ES_USERNAME, ES_PASSWORD, ES_TOTP_SECRET을 넣습니다.
      # 3. 아래 단계의 주석을 풉니다. 태그 빌드에서만 돌기 때문에 일반 push는 서명 횟수를 쓰지 않습니다.
      # eSigner CKA가 클라우드 키를 Windows 인증서 저장소에 올려 주므로, 지문을 SIGN_CERT_THUMBPRINT로 넘기면
      # build.ps1의 vpk pack --signParams가 그대로 서명합니다. 저장소에 인증서를 올려 주는 다른 클라우드 HSM도 같은 방식입니다.
      # 그런 도구가 없는 서비스는 build.ps1이 vpk pack --signTemplate "<서명 명령> {{file}}"을 쓰도록 고쳐야 합니다.
      # CKA 최신 버전은 https://www.ssl.com/downloads/#cka 에서 확인하세요. -key 파일은 공식 문서에 설명이 없으니 첫 실행 때 확인이 필요합니다.
      # - name: Load the signing certificate
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   shell: pwsh
      #   env:
      #     ES_USERNAME: ${{ secrets.ES_USERNAME }}
      #     ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
      #     ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
      #   run: |
      #     $dir = "$env:USERPROFILE\eSignerCKA"
      #     New-Item -ItemType Directory -Force $dir | Out-Null
      #     Invoke-WebRequest -OutFile cka.zip "https://github.com/SSLcom/eSignerCKA/releases/download/v1.0.6/SSL.COM-eSigner-CKA_1.0.6.zip"
      #     Expand-Archive -Force cka.zip cka
      #     $setup = (Get-ChildItem cka -Recurse -Filter *.exe | Select-Object -First 1).FullName
      #     & $setup /CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /DIR="$dir" | Out-Null
      #     & "$dir\eSignerCKATool.exe" config -mode product -user "$env:ES_USERNAME" -pass "$env:ES_PASSWORD" -totp "$env:ES_TOTP_SECRET" -key "$dir\master.key" -r
      #     & "$dir\eSignerCKATool.exe" unload
      #     & "$dir\eSignerCKATool.exe" load
      #     $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
      #     "SIGN_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        env:
          # tag builds fetch the previous release so only the changed parts are packed (deltas)
          VPK_REPO_URL: ${{ startsWith(github.ref, 'refs/tags/v') && format('https://github.com/{0}', github.repository) || '' }}
          VPK_TOKEN: ${{ github.token }}
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.6.0' }
          build\windows\build.ps1 -Version $v
      - uses: actions/upload-artifact@v4
        with: { name: SystemBoost-Windows, path: 'dist/windows/Releases/**' }
      - uses: actions/upload-artifact@v4
        with: { name: download-Windows, path: 'dist/windows/download/*' }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Refresh Wine runtime manifest (URLs + SHA-256 from the GitHub API)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: tools/update_wine_manifest.sh
      - run: dotnet tool install -g vpk --version 0.0.1298
      # 서명 켜기 (실제 인증서로는 아직 시험하지 않았습니다)
      # Apple Developer Program에 가입한 뒤 Developer ID Application, Developer ID Installer 인증서를 만듭니다.
      # 인증서는 Account Holder만 만들 수 있고, 조직으로 가입하면 D-U-N-S 번호가 필요합니다.
      # GitHub Secrets에 아래 값을 넣고 단계의 주석을 풉니다. 값이 없으면 이 단계는 건너뛰고 서명 없이 빌드합니다.
      #   MAC_SIGN_IDENTITY      Developer ID Application: 이름 (TEAMID)
      #   MAC_INSTALL_IDENTITY   Developer ID Installer: 이름 (TEAMID)
      #   MAC_NOTARY_PROFILE     notarytool 프로필 이름 (아무 이름이나, 예: systemboost-notary)
      #   MAC_CERT_P12_BASE64    두 인증서를 키체인에서 함께 내보낸 .p12의 base64 (base64 -i cert.p12 | pbcopy)
      #   MAC_CERT_P12_PASSWORD  .p12를 내보낼 때 정한 비밀번호
      #   MAC_KEYCHAIN_PASSWORD  CI 임시 키체인 비밀번호 (임의의 값)
      #   MAC_NOTARY_APPLE_ID    Apple 계정 이메일
      #   MAC_NOTARY_TEAM_ID     팀 ID 10자리
      #   MAC_NOTARY_PASSWORD    appleid.apple.com에서 만든 앱 암호
      # 키체인 명령은 GitHub 문서(Installing an Apple certificate on macOS runners)를 따랐습니다. default-keychain 줄은
      # vpk가 notarytool 프로필을 찾도록 따로 더한 것이라 첫 서명 빌드에서 공증 단계를 확인해야 합니다.
      # - name: Import the Apple signing certificates
      #   env:
      #     MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      #     MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
      #     MAC_KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
      #     MAC_NOTARY_PROFILE: ${{ secrets.MAC_NOTARY_PROFILE }}
      #     MAC_NOTARY_APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
      #     MAC_NOTARY_TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
      #     MAC_NOTARY_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
      #   run: |
      #     [ -n "$MAC_CERT_P12_BASE64" ] || exit 0
      #     KC="$RUNNER_TEMP/app-signing.keychain-db"
      #     P12="$RUNNER_TEMP/signing.p12"
      #     echo -n "$MAC_CERT_P12_BASE64" | base64 --decode -o "$P12"
      #     security create-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KC"
      #     security set-keychain-settings -lut 21600 "$KC"
      #     security unlock-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KC"
      #     security import "$P12" -P "$MAC_CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
      #     security set-key-partition-list -S apple-tool:,apple: -k "$MAC_KEYCHAIN_PASSWORD" "$KC"
      #     security list-keychain -d user -s "$KC"
      #     security default-keychain -d user -s "$KC"
      #     rm -f "$P12"
      #     xcrun notarytool store-credentials "$MAC_NOTARY_PROFILE" --apple-id "$MAC_NOTARY_APPLE_ID" --team-id "$MAC_NOTARY_TEAM_ID" --password "$MAC_NOTARY_PASSWORD"
      - name: Build
        env:
          VPK_REPO_URL: ${{ startsWith(github.ref, 'refs/tags/v') && format('https://github.com/{0}', github.repository) || '' }}
          VPK_TOKEN: ${{ github.token }}
          # optional Apple signing (repository secrets); unsigned builds still work but Gatekeeper warns
          SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          INSTALL_IDENTITY: ${{ secrets.MAC_INSTALL_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.MAC_NOTARY_PROFILE }}
        run: |
          v=0.6.0; [[ "$GITHUB_REF" == refs/tags/v* ]] && v="${GITHUB_REF_NAME#v}"
          build/macos/build.sh "$v"
      - uses: actions/upload-artifact@v4
        with: { name: SystemBoost-macOS-AppleSilicon, path: 'dist/macos/Releases-AppleSilicon/**' }
      - uses: actions/upload-artifact@v4
        with: { name: SystemBoost-macOS-Intel, path: 'dist/macos/Releases-Intel/**' }
      - uses: actions/upload-artifact@v4
        with: { name: download-macOS, path: 'dist/macos/download/*' }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, windows, macos]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet tool install -g vpk --version 0.0.1298
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Upload update packages (one release, three channels)
        run: |
          NAME="SystemBoost ${TAG#v}"
          vpk upload github --repoUrl "$REPO_URL" --token "$TOKEN" --tag "$TAG" --releaseName "$NAME" -o dist/SystemBoost-Windows --channel win --publish
          vpk upload github --repoUrl "$REPO_URL" --token "$TOKEN" --tag "$TAG" --releaseName "$NAME" -o dist/SystemBoost-macOS-AppleSilicon --channel osx-arm64 --merge --publish
          vpk upload github --repoUrl "$REPO_URL" --token "$TOKEN" --tag "$TAG" --releaseName "$NAME" -o dist/SystemBoost-macOS-Intel --channel osx-x64 --merge --publish
      - name: Add the fixed-name downloads for the download page
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release upload "$TAG" dist/download-Windows/* dist/download-macOS/* --clobber --repo "${{ github.repository }}"
          [ -f RELEASE_NOTES.md ] && gh release edit "$TAG" --notes-file RELEASE_NOTES.md --repo "${{ github.repository }}" || true
